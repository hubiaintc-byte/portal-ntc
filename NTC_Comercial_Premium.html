<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NTC Comercial Premium · Sistema Integrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0E2A47; --navy-d:#08182B; --navy-l:#1E4474;
  --gold:#B68B40; --gold-d:#8C6A2D; --gold-l:#D6B070;
  --cream:#FBF8F2; --cream-2:#F0EBDF; --line:#E2DCCC; --line-2:#F0EBDF;
  --ink:#1A1A1A; --ink-2:#3A3A3A; --muted:#6B6B6B;
  --white:#fff; --bg:#F5F1E8; --row-alt:#F8F5ED;
  --ok:#2E6B43; --ok-bg:#E1F0E5;
  --warn:#B68B40; --warn-bg:#F8EBD2;
  --danger:#A04040; --danger-bg:#F8E6E2;
  --info:#2C5F8B; --info-bg:#DEEBF5;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Barlow',-apple-system,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 3px rgba(14,42,71,.08),0 4px 16px rgba(14,42,71,.05);
  --shadow-l:0 8px 32px rgba(14,42,71,.14);
  --radius:10px; --radius-s:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}

/* LAYOUT */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#E8DFC8;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:22px 22px 18px;border-bottom:1px solid rgba(214,176,112,.18)}
.brand .logo{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold-l);letter-spacing:.5px;line-height:1.1}
.brand .sub{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#C9BC9A;margin-top:6px;font-weight:500}
.brand .v{font-size:9.5px;color:#8A7E5F;margin-top:6px;letter-spacing:1px}
.userbox{padding:10px 22px 14px;border-bottom:1px solid rgba(214,176,112,.12);font-size:12px;color:#D6CFB8}
.userbox .name{font-weight:600;color:var(--gold-l);font-size:13px}
.userbox .role{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8A7E5F;margin-top:2px}
nav.menu{padding:12px 12px;flex:1;overflow-y:auto}
nav.menu .group{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#8A7E5F;padding:12px 12px 6px;font-weight:600}
nav.menu a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:#D6CFB8;font-size:13px;font-weight:500;margin-bottom:2px;transition:all .15s;cursor:pointer}
nav.menu a:hover{background:rgba(182,139,64,.10);color:var(--gold-l)}
nav.menu a.active{background:linear-gradient(90deg,rgba(182,139,64,.20),rgba(182,139,64,.06));color:var(--gold-l);box-shadow:inset 3px 0 0 var(--gold)}
nav.menu a .ic{width:16px;text-align:center;font-size:13px}
.sidefoot{padding:12px 22px;font-size:10px;color:#8A7E5F;border-top:1px solid rgba(214,176,112,.12);letter-spacing:.5px}

main.content{padding:0;overflow-x:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .crumb{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.topbar h1{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--navy);letter-spacing:.3px;line-height:1.1}
.topbar .actions{display:flex;gap:8px;align-items:center}
.view{padding:26px 32px 60px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;letter-spacing:.2px;transition:all .15s;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-l)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-d)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--cream-2);border-color:var(--gold)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#8b3535}
.btn-sm{padding:4px 9px;font-size:11px}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px;border:1px solid var(--line)}
.card-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#FBF8F2);gap:12px;flex-wrap:wrap}
.card-head h3{font-family:var(--serif);font-size:17px;color:var(--navy);font-weight:600}
.card-head .sub{font-size:11px;color:var(--muted);letter-spacing:.8px;margin-top:2px}
.card-body{padding:18px 20px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;padding:16px 18px;border-radius:var(--radius);box-shadow:var(--shadow);border-left:3px solid var(--gold);border:1px solid var(--line);border-left:3px solid var(--gold)}
.kpi.navy{border-left-color:var(--navy)}
.kpi.ok{border-left-color:var(--ok)}
.kpi.warn{border-left-color:var(--warn)}
.kpi.danger{border-left-color:var(--danger)}
.kpi .label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600;margin-top:5px;line-height:1}
.kpi .hint{font-size:11px;color:var(--muted);margin-top:7px}

/* TABLES */
.tbl-wrap{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.tbl-toolbar{padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl-toolbar input[type="search"],.tbl-toolbar select{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;color:var(--ink)}
.tbl-toolbar input[type="search"]{flex:1;max-width:320px;min-width:200px}
.tbl-meta{margin-left:auto;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:10px 14px;background:var(--navy);color:var(--gold-l);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
table.tbl th:hover{background:var(--navy-d)}
table.tbl td{padding:9px 14px;border-bottom:1px solid #F4F0E5;vertical-align:middle}
table.tbl tbody tr:nth-child(even){background:var(--row-alt)}
table.tbl tbody tr:hover{background:var(--cream-2)}
table.tbl td a.link{color:var(--navy-l);font-weight:600;cursor:pointer}
table.tbl td a.link:hover{color:var(--gold-d);text-decoration:underline}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td.actions{text-align:right;white-space:nowrap}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;background:#EEEAE0;color:var(--ink-2);white-space:nowrap}
.badge.ok,.badge.success{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--gold-d)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.primary{background:rgba(14,42,71,.10);color:var(--navy)}
.badge.accent{background:rgba(182,139,64,.18);color:var(--gold-d)}

/* FORMS */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form.cols-3{grid-template-columns:repeat(3,1fr)}
.form.cols-4{grid-template-columns:repeat(4,1fr)}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{display:block;font-size:10.5px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.7px}
.field label .req{color:var(--gold);margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(182,139,64,.10)}
.field textarea{resize:vertical;min-height:70px;font-family:var(--sans);line-height:1.45}
.field .hint{font-size:10.5px;color:var(--muted)}
.field .computed-display{padding:8px 11px;border:1px dashed var(--line);border-radius:6px;background:#FBF9F2;color:var(--ink-2);font-size:13px;font-style:italic}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(8,24,43,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:12px;max-width:880px;width:100%;box-shadow:var(--shadow-l);display:flex;flex-direction:column;max-height:90vh}
.modal.lg{max-width:1100px}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px 12px 0 0}
.modal-head .crumb{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
.modal-head h3{font-family:var(--serif);font-size:19px;color:var(--navy);font-weight:600}
.close-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FBF9F2;border-radius:0 0 12px 12px}
.modal-foot .left{margin-right:auto}

/* SECTION TITLE */
.sect-title{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sect-title h4{font-family:var(--serif);font-size:15px;color:var(--gold-d);font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.sect-title .n{font-size:10.5px;color:var(--muted);letter-spacing:.5px}

/* EMPTY */
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:38px;color:var(--gold-l);margin-bottom:10px}
.empty h4{font-family:var(--serif);font-size:17px;color:var(--navy);margin-bottom:6px;font-weight:600}

/* CHARTS */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:22px}
.chart-grid.eq{grid-template-columns:1fr 1fr}
.chart-box{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 18px}
.chart-box h4{font-family:var(--serif);font-size:15px;color:var(--navy);font-weight:600;margin-bottom:10px}
.chart-wrap{position:relative;height:230px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;letter-spacing:.3px;cursor:pointer;border:none;background:none}
.tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}

/* TOAST */
#toast-host{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:11px 16px;font-size:12.5px;box-shadow:var(--shadow-l);min-width:270px;animation:slideIn .18s ease}
.toast.ok{border-left-color:var(--ok)}
.toast.danger{border-left-color:var(--danger)}
.toast strong{color:var(--navy);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:1px}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* LOGIN GATE */
.login-gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;padding:36px 38px;max-width:440px;width:100%;box-shadow:var(--shadow-l)}
.login-card .logo{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--navy);text-align:center;line-height:1.05}
.login-card .sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-d);text-align:center;margin-top:6px;font-weight:600}
.login-card h2{font-family:var(--serif);font-size:18px;color:var(--navy);margin:24px 0 4px;font-weight:600}
.login-card p.hint{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.login-card .users-list{display:grid;gap:8px;margin-bottom:14px}
.login-card .user-pick{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s;background:#FBF9F2}
.login-card .user-pick:hover{border-color:var(--gold);background:var(--cream-2)}
.login-card .user-pick .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--serif)}
.login-card .user-pick .info{flex:1}
.login-card .user-pick .info strong{display:block;color:var(--navy);font-size:13.5px}
.login-card .user-pick .info span{font-size:11px;color:var(--muted);letter-spacing:.4px}
.login-card .role-pill{font-size:9.5px;background:var(--navy);color:var(--gold-l);padding:3px 8px;border-radius:99px;letter-spacing:1px;font-weight:600;text-transform:uppercase}

/* PRINT */
@media print{
  body{background:#fff}
  #app{display:block}
  aside.sidebar,.topbar,.tbl-toolbar,.no-print{display:none !important}
  .view{padding:0}
  .modal-bg{position:static;padding:0;background:none}
  .modal{box-shadow:none;max-width:none;max-height:none}
}

/* MOBILE */
@media (max-width:1024px){
  #app{grid-template-columns:60px 1fr}
  nav.menu a span:not(.ic){display:none}
  nav.menu .group,.brand .sub,.brand .v,.sidefoot,.userbox{display:none}
  .brand{padding:14px 8px;text-align:center}
  .brand .logo{font-size:18px}
}
</style>
</head>
<body>
<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/ntc-logos/TN2_LogoLimpa_Transparente_Dark.svg" alt="Instituto NTC do Brasil" style="width:100%;max-width:180px;height:auto;display:block;margin:0 auto 10px">
      <div class="sub" style="text-align:center">Comercial Premium · v3.0</div>
      <div class="v" style="text-align:center">Instituto NTC do Brasil · 2026</div>
    </div>
    <div class="userbox" id="userbox"></div>
    <nav class="menu" id="menu"></nav>
    <div class="sidefoot">© Instituto NTC do Brasil<br>Sistema Comercial Integrado</div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="titles">
        <div class="crumb" id="crumb">VISÃO EXECUTIVA</div>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div class="actions" id="page-actions"></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<div id="modal-host"></div>
<div id="toast-host"></div>
<div id="login-host"></div>

<script>

  ORIGEM_CONTEUDO: ['Cadastro manual','Importado de folder HTML','Importado de folder PDF','Sincronizado do site NTC','Outro'],
  TIPO_ATIVO: ['Capa limpa','Banner','Imagem de apoio','Foto de palestrante','Logo','Ícone','Thumbnail do folder','Imagem institucional','Outro'],

  TIPO_VINCULO_BIB: ['Programa','Módulo','Produto/Evento'],

const PERMISSOES = {
  'Administrador': { read:'*', write:'*', delete:'*' },
  'Comercial':     { read:'*', write:['clientes','contatos','oportunidades','propostas','versoes','envios','followups','produtos','condicoes','biblioteca','ativos','textos_padrao'], delete:[] },
  'Revisor':       { read:'*', write:['propostas','versoes','followups','biblioteca','ativos','textos_padrao'], delete:[] },
  'Financeiro':    { read:'*', write:['contratos','empenhos','notas','recebimentos','comissoes'], delete:[] },
  'Consulta':      { read:'*', write:[], delete:[] },
};

function podeEscrever(entidade){
  const u = STATE.currentUser; if(!u) return false;
  const p = PERMISSOES[u.perfil]; if(!p) return false;
  if(p.write==='*') return true;
  return Array.isArray(p.write) && p.write.includes(entidade);
}
function podeApagar(entidade){
  const u = STATE.currentUser; if(!u) return false;
  const p = PERMISSOES[u.perfil]; if(!p) return false;
  if(p.delete==='*') return true;
  return Array.isArray(p.delete) && p.delete.includes(entidade);
}

/* ------------------------------------------------------------
   INDEXEDDB · camada de persistência
   ------------------------------------------------------------ */
const DB_NAME = 'ntc_comercial_premium_v3';
const DB_VERSION = 3; // v2: adiciona stores `biblioteca` e `ativos` · v3: adiciona `textos_padrao` (Biblioteca de Textos-Padrão de Proposta)
const STORES = ['clientes','contatos','programas','modulos','produtos','oportunidades','propostas','versoes','envios','followups','condicoes','contratos','empenhos','notas','recebimentos','comissoes','biblioteca','ativos','textos_padrao','usuarios','meta'];

function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
    };
    r.onsuccess = e=>res(e.target.result);
    r.onerror = e=>rej(e);
  });
}
function tx(stores, mode='readonly'){ return STATE.db.transaction(stores, mode); }
function dbAll(store){
  return new Promise((res,rej)=>{
    const r = tx([store]).objectStore(store).getAll();
    r.onsuccess = e=>res(e.target.result||[]);
    r.onerror = e=>rej(e);
  });
}
function dbGet(store,id){
  return new Promise((res,rej)=>{
    const r = tx([store]).objectStore(store).get(id);
    r.onsuccess = e=>res(e.target.result||null);
    r.onerror = e=>rej(e);
  });
}
function dbPut(store,obj){
  return new Promise((res,rej)=>{
    const t = tx([store],'readwrite');
    const r = t.objectStore(store).put(obj);
    r.onsuccess = e=>res(e.target.result);
    r.onerror = e=>rej(e);
  });
}
function dbDel(store,id){
  return new Promise((res,rej)=>{
    const t = tx([store],'readwrite');
    const r = t.objectStore(store).delete(id);
    r.onsuccess = e=>res(true);
    r.onerror = e=>rej(e);
  });
}
function dbClear(store){
  return new Promise((res,rej)=>{
    const t = tx([store],'readwrite');
    const r = t.objectStore(store).clear();
    r.onsuccess = e=>res(true);
    r.onerror = e=>rej(e);
  });
}

const $ = (sel,el=document)=>el.querySelector(sel);
const $$ = (sel,el=document)=>Array.from(el.querySelectorAll(sel));
const today = ()=> new Date().toISOString().slice(0,10);
const addDays = (d,n)=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const esc = s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s=>(s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toUpperCase();
const newId = pfx=>`${pfx}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;

const fmt = {
  money: v=>(Number(v||0)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
  pct: v=>(Number(v||0)*100).toFixed(1).replace('.',',')+'%',
  num: v=>(Number(v||0)).toLocaleString('pt-BR'),
  date: d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—',
  text: v=>v==null||v===''?'—':String(v),
};

function computeField(field,rec){ try{ return field.compute(rec, ctxObj()); }catch(e){ return null; } }

function getDisplay(entity,rec,key){
  const sch = SCHEMA[entity]; if(!sch) return '';
  const fld = sch.fields.find(f=>f.key===key);
  // Pseudo cols
  if(key==='id') return rec.id||'';
  if(!fld){
    // valor cru
    return rec[key]!=null ? String(rec[key]) : '—';
  }
  let v = rec[key];
  if(fld.type==='computed') v = computeField(fld,rec);
  if(fld.type==='money') return fmt.money(v);
  if(fld.type==='percent') return fmt.pct(v);
  if(fld.type==='number') return v==null||v===''?'—':fmt.num(v);
  if(fld.type==='date') return fmt.date(v);
  if(fld.type==='ref'){
    const r = byId(fld.entity,v); return r ? (fld.labelFn?fld.labelFn(r):r.id) : '—';
  }
  if(fld.type==='multiref'){
    const ids = v||[]; const arr = ids.map(id=>byId(fld.entity,id)).filter(Boolean);
    return arr.length ? arr.map(r=> fld.labelFn?fld.labelFn(r):r.id).join(', ') : '—';
  }
  if(fld.type==='bool') return v?'Sim':'Não';
  return v==null||v===''?'—':String(v);
}

function badgeFor(v){ const c = BADGE_CLASS[v]||''; return `<span class="badge ${c}">${esc(v||'—')}</span>`; }

function toast(msg, kind=''){
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `<strong>${kind==='ok'?'Sucesso':kind==='danger'?'Erro':'Aviso'}</strong>${esc(msg)}`;
  $('#toast-host').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function renderMenu(){
  const el = $('#menu');
  el.innerHTML = NAV_GROUPS.map(g=>{
    const entries = g.entries.map(e=>{
      const active = STATE.view===e.key?'active':'';
      return `<a class="${active}" data-nav="${e.key}"><span class="ic">${e.ic}</span><span>${e.label}</span></a>`;
    }).join('');
    return `<div class="group">${g.title}</div>${entries}`;
  }).join('');
  $$('[data-nav]', el).forEach(a=> a.onclick = (ev)=>{ ev.preventDefault(); navigate(a.dataset.nav); });
}

function navigate(view){ STATE.view = view; STATE.filter=''; STATE.sort={col:null,dir:1}; render(); }

function render(){
  renderMenu();
  if(VIEW_HANDLERS[STATE.view]){
    VIEW_HANDLERS[STATE.view]();
  } else if(SCHEMA[STATE.view]){
    renderEntityList(STATE.view);
  } else {
    $('#crumb').textContent = 'SISTEMA';
    $('#page-title').textContent = 'Tela não encontrada';
    $('#view').innerHTML = '<div class="empty"><div class="ic">?</div><h4>Tela indisponível</h4></div>';
  }
}

const VIEW_HANDLERS = {};

/* ============================================================
   SCHEMA-DRIVEN CRUD · lista, formulário, modal
   ============================================================ */

function applyFilter(entity, list){
  let arr = list.slice();
  if(STATE.filter){
    const q = STATE.filter.toLowerCase();
    arr = arr.filter(r=>{
      return Object.values(r).some(v=>{
        if(v==null) return false;
        if(Array.isArray(v)) return v.join(' ').toLowerCase().includes(q);
        return String(v).toLowerCase().includes(q);
      });
    });
  }
  if(STATE.sort.col){
    const k = STATE.sort.col, dir = STATE.sort.dir;
    arr.sort((a,b)=>{
      const va = getDisplay(entity,a,k), vb = getDisplay(entity,b,k);
      return va<vb?-1*dir:va>vb?1*dir:0;
    });
  }
  return arr;
}

function renderEntityList(entity){
  const sch = SCHEMA[entity]; if(!sch) return;
  $('#crumb').textContent = 'CADASTROS';
  $('#page-title').textContent = sch.label;
  const canWrite = podeEscrever(entity);
  $('#page-actions').innerHTML = canWrite ? `<button class="btn btn-gold" id="btn-new">+ ${esc(sch.singular)}</button>` : '';
  if(canWrite) $('#btn-new').onclick = ()=> openEntityForm(entity);

  const list = STATE.cache[entity] || [];
  const filtered = applyFilter(entity, list);

  $('#view').innerHTML = `
    <div class="tbl-wrap">
      <div class="tbl-toolbar">
        <input type="search" id="tbl-search" placeholder="Buscar em ${esc(sch.label.toLowerCase())}…" value="${esc(STATE.filter)}">
        <span class="tbl-meta">${filtered.length} de ${list.length} registro(s)</span>
      </div>
      ${filtered.length===0 ? `<div class="empty"><div class="ic">${esc(sch.icon)}</div><h4>Nenhum registro</h4><div>Clique em <strong>+ ${esc(sch.singular)}</strong> para criar o primeiro.</div></div>` : `
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          ${sch.listCols.map(c=>{
            const fld = sch.fields.find(f=>f.key===c);
            const lbl = c==='id' ? 'ID' : (fld?fld.label:c);
            const arrow = STATE.sort.col===c ? (STATE.sort.dir>0?'▲':'▼') : '';
            return `<th data-sort="${c}">${esc(lbl)} <span style="opacity:.6;font-size:9px">${arrow}</span></th>`;
          }).join('')}
          <th style="width:180px">Ações</th>
        </tr></thead>
        <tbody>${filtered.map(r=>{
          const cells = sch.listCols.map(c=>{
            const fld = sch.fields.find(f=>f.key===c);
            let val = getDisplay(entity,r,c);
            if(fld && (fld.type==='list' || c==='status' || c==='vigente' || c==='prioridade')){
              return `<td>${badgeFor(r[c])}</td>`;
            }
            if(fld && (fld.type==='money')) return `<td class="num">${esc(val)}</td>`;
            if(fld && (fld.type==='number')) return `<td class="num">${esc(val)}</td>`;
            if(c==='id' || c==='codigo' || c==='cod_base' || c==='sigla') return `<td><a class="link" data-open="${esc(r.id)}">${esc(val)}</a></td>`;
            return `<td>${esc(val)}</td>`;
          }).join('');
          const actions = `<td class="actions">
            <button class="btn btn-sm btn-ghost" data-view="${esc(r.id)}">Ver</button>
            ${podeEscrever(entity)?`<button class="btn btn-sm btn-ghost" data-edit="${esc(r.id)}">Editar</button>`:''}
            ${podeApagar(entity)?`<button class="btn btn-sm btn-ghost" data-del="${esc(r.id)}">×</button>`:''}
          </td>`;
          return `<tr>${cells}${actions}</tr>`;
        }).join('')}</tbody>
      </table></div>`}
    </div>
  `;
  const s = $('#tbl-search'); if(s){ s.oninput = (e)=>{ STATE.filter = e.target.value; renderEntityList(entity); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }; }
  $$('[data-sort]').forEach(th=> th.onclick = ()=>{
    const c = th.dataset.sort;
    if(STATE.sort.col===c) STATE.sort.dir *= -1;
    else { STATE.sort.col = c; STATE.sort.dir = 1; }
    renderEntityList(entity);
  });
  $$('[data-view]').forEach(b=> b.onclick = ()=> openEntityView(entity, b.dataset.view));
  $$('[data-open]').forEach(b=> b.onclick = ()=> openEntityView(entity, b.dataset.open));
  $$('[data-edit]').forEach(b=> b.onclick = ()=> openEntityForm(entity, b.dataset.edit));
  $$('[data-del]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Excluir este registro? A ação não pode ser desfeita.')) return;
    await dbDel(entity, b.dataset.del);
    await refreshCache(entity);
    toast('Registro excluído.','ok');
    renderEntityList(entity);
  });
}

function fieldInput(field, value, prefix='f-'){
  const id = prefix + field.key;
  const req = field.required ? '<span class="req">*</span>' : '';
  const label = `<label for="${id}">${esc(field.label)}${req}</label>`;
  const v = value==null?'':value;

  if(field.type==='textarea'){
    return `<div class="field full">${label}<textarea id="${id}" name="${field.key}" rows="${field.rows||3}">${esc(v)}</textarea></div>`;
  }
  if(field.type==='list'){
    const opts = LIST[field.list] || [];
    return `<div class="field">${label}<select id="${id}" name="${field.key}"><option value="">— Selecione —</option>${opts.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if(field.type==='ref'){
    const refs = STATE.cache[field.entity] || [];
    return `<div class="field">${label}<select id="${id}" name="${field.key}"><option value="">— Selecione —</option>${refs.map(r=>{const lbl = field.labelFn?field.labelFn(r):r.id;return `<option value="${esc(r.id)}" ${r.id===v?'selected':''}>${esc(lbl)}</option>`}).join('')}</select></div>`;
  }
  if(field.type==='multiref'){
    const refs = STATE.cache[field.entity] || [];
    const vals = Array.isArray(v)?v:[];
    return `<div class="field full">${label}<div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;max-height:160px;overflow-y:auto">${refs.length===0?'<span style="font-size:12px;color:var(--muted)">Nenhum registro disponível.</span>':refs.map(r=>{const lbl = field.labelFn?field.labelFn(r):r.id;return `<label style="display:inline-flex;gap:5px;font-size:12px;background:#FBF9F2;padding:4px 9px;border-radius:4px;cursor:pointer"><input type="checkbox" name="${field.key}" value="${esc(r.id)}" ${vals.includes(r.id)?'checked':''}>${esc(lbl)}</label>`}).join('')}</div></div>`;
  }
  if(field.type==='number'||field.type==='money'){
    return `<div class="field">${label}<input id="${id}" name="${field.key}" type="number" step="${field.type==='money'?'0.01':'1'}" value="${esc(v)}"></div>`;
  }
  if(field.type==='percent'){
    const pct = v===''||v==null ? '' : (Number(v)*100);
    return `<div class="field">${label}<input id="${id}" name="${field.key}" type="number" step="0.01" value="${esc(pct)}" placeholder="ex.: 15 para 15%"><div class="hint">Digite o número inteiro (15 = 15%).</div></div>`;
  }
  if(field.type==='date'){
    return `<div class="field">${label}<input id="${id}" name="${field.key}" type="date" value="${esc(v)}"></div>`;
  }
  if(field.type==='url'){
    return `<div class="field full">${label}<input id="${id}" name="${field.key}" type="url" value="${esc(v)}" placeholder="https://… ou nome do arquivo"></div>`;
  }
  if(field.type==='bool'){
    return `<div class="field"><label><input type="checkbox" id="${id}" name="${field.key}" ${v?'checked':''} style="margin-right:6px;vertical-align:middle">${esc(field.label)}</label></div>`;
  }
  if(field.type==='computed'){
    const calc = computeField(field, STATE._editing||{});
    let disp = calc==null?'(será calculado)':String(calc);
    if(field.key==='valor_liquido'||field.key==='valor_bruto'||field.key==='base'||field.key==='valor') disp = fmt.money(calc);
    if(field.key==='desconto'&&typeof calc==='number'&&calc<=1) disp = fmt.pct(calc);
    return `<div class="field">${label}<div class="computed-display" data-computed="${field.key}">${esc(disp)}</div></div>`;
  }
  return `<div class="field">${label}<input id="${id}" name="${field.key}" type="text" value="${esc(v)}"></div>`;
}

function buildForm(entity, record){
  const sch = SCHEMA[entity];
  const fields = sch.fields.filter(f=>f.type!=='computed' || ['valor_liquido','valor_bruto','desconto','valor'].includes(f.key));
  return `<form id="entity-form" class="form">${fields.map(f=>fieldInput(f, record[f.key])).join('')}</form>`;
}

function collectForm(form, sch){
  const out = {};
  for(const f of sch.fields){
    if(f.type==='computed') continue;
    if(f.type==='multiref'){
      out[f.key] = $$(`[name="${f.key}"]:checked`, form).map(x=>x.value);
      continue;
    }
    if(f.type==='bool'){
      out[f.key] = !!$(`[name="${f.key}"]`, form)?.checked;
      continue;
    }
    const el = $(`[name="${f.key}"]`, form);
    if(!el) continue;
    let v = el.value;
    if(f.type==='number'||f.type==='money') v = v===''?'':Number(v);
    if(f.type==='percent') v = v===''?'':Number(v)/100;
    out[f.key] = v;
  }
  return out;
}

function validateForm(form, sch){
  const errs = [];
  for(const f of sch.fields){
    if(f.required && f.type!=='computed'){
      const el = $(`[name="${f.key}"]`, form);
      if(!el) continue;
      if(f.type==='multiref'){
        if($$(`[name="${f.key}"]:checked`, form).length===0) errs.push(f.label);
      } else if(!el.value) errs.push(f.label);
    }
  }
  return errs;
}

function openEntityForm(entity, id){
  if(!podeEscrever(entity)){ toast('Você não tem permissão para editar esta entidade.','danger'); return; }
  const sch = SCHEMA[entity];
  const rec = id ? (STATE.cache[entity].find(r=>r.id===id) || {}) : {};
  STATE._editing = JSON.parse(JSON.stringify(rec));
  if(!id){
    // Defaults
    if(sch.fields.find(f=>f.key==='data_criacao')) STATE._editing.data_criacao = today();
    if(sch.fields.find(f=>f.key==='data_abertura')) STATE._editing.data_abertura = today();
    if(sch.fields.find(f=>f.key==='data')) STATE._editing.data = today();
    if(entity==='usuarios') STATE._editing.ativo = true;
  }
  showModal({
    title: id?`Editar ${sch.singular}`:`Novo ${sch.singular}`,
    crumb: sch.label,
    body: buildForm(entity, STATE._editing),
    actions:[
      {label:'Cancelar', cls:'btn-ghost', onclick:closeModal},
      {label:id?'Salvar alterações':'Criar registro', cls:'btn-gold', onclick: async()=>{
        const form = $('#entity-form');
        const errs = validateForm(form, sch);
        if(errs.length){ toast('Preencha: '+errs.join(', '),'danger'); return; }
        const data = collectForm(form, sch);
        const out = Object.assign({}, rec, data);
        if(!out.id) out.id = newId(sch.prefix);
        await dbPut(entity, out);
        await refreshCache(entity);
        toast(id?'Registro atualizado.':'Registro criado.','ok');
        closeModal();
        render();
      }}
    ],
    lg:true
  });
  // recompute em campos derivados
  $$('input,select,textarea','#entity-form').forEach(el=> el.addEventListener('input', ()=>{
    const data = collectForm($('#entity-form'), sch);
    Object.assign(STATE._editing, data);
    $$('[data-computed]').forEach(d=>{
      const k = d.dataset.computed;
      const f = sch.fields.find(x=>x.key===k);
      if(f && f.type==='computed'){
        let calc = computeField(f, STATE._editing);
        let disp = calc==null?'(será calculado)':String(calc);
        if(['valor_liquido','valor_bruto','base','valor'].includes(k)) disp = fmt.money(calc);
        if(k==='desconto'&&typeof calc==='number'&&calc<=1) disp = fmt.pct(calc);
        d.textContent = disp;
      }
    });
  }));
}

function openEntityView(entity, id){
  const sch = SCHEMA[entity];
  const rec = STATE.cache[entity].find(r=>r.id===id);
  if(!rec){ toast('Registro não encontrado.','danger'); return; }

  // Caso especial: proposta abre tela dedicada com geração HTML
  if(entity==='propostas'){ return openPropostaDetail(rec); }

  const rows = sch.fields.map(f=>{
    let v;
    if(f.type==='computed') v = computeField(f, rec);
    else v = rec[f.key];
    let disp;
    if(f.type==='money'||(f.type==='computed' && typeof v==='number' && f.key.includes('valor'))) disp = fmt.money(v);
    else if(f.type==='percent') disp = fmt.pct(v);
    else if(f.type==='date') disp = fmt.date(v);
    else if(f.type==='ref'){ const r=byId(f.entity,v); disp = r?(f.labelFn?f.labelFn(r):r.id):'—'; }
    else if(f.type==='multiref'){ const ids=v||[]; disp = ids.map(x=>byId(f.entity,x)).filter(Boolean).map(r=>f.labelFn?f.labelFn(r):r.id).join(', ')||'—'; }
    else if(f.type==='bool') disp = v?'Sim':'Não';
    else if(f.type==='list') disp = v?badgeFor(v):'—';
    else if(f.type==='textarea') disp = `<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0">${esc(v||'—')}</pre>`;
    else if(f.type==='url') disp = v?`<a href="${esc(v)}" target="_blank" style="color:var(--gold-d)">${esc(v)}</a>`:'—';
    else disp = esc(v==null||v===''?'—':v);
    return `<tr><th style="text-align:left;padding:6px 10px;color:var(--navy);font-size:11px;letter-spacing:.6px;text-transform:uppercase;width:200px;background:#FBF9F2;border:1px solid var(--line)">${esc(f.label)}</th><td style="padding:7px 12px;border:1px solid var(--line)">${disp}</td></tr>`;
  }).join('');

  showModal({
    title: sch.label_of(rec) || sch.singular,
    crumb: sch.label,
    body: `<table style="width:100%;border-collapse:collapse;font-size:13px">${rows}</table>`,
    actions:[
      {label:'Fechar', cls:'btn-ghost', onclick:closeModal},
      ...(podeEscrever(entity)?[{label:'Editar', cls:'btn-gold', onclick:()=>{ closeModal(); openEntityForm(entity, id); }}]:[])
    ],
    lg:true
  });
}

function showModal({title, crumb, body, actions=[], lg=false}){
  $('#modal-host').innerHTML = `
    <div class="modal-bg">
      <div class="modal ${lg?'lg':''}">
        <div class="modal-head">
          <div>
            ${crumb?`<div class="crumb">${esc(crumb)}</div>`:''}
            <h3>${esc(title)}</h3>
          </div>
          <button class="close-x" data-close>×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||'btn-ghost'} ${a.left?'left':''}" data-act="${i}">${esc(a.label)}</button>`).join('')}</div>
      </div>
    </div>
  `;
  $$('[data-close]').forEach(b=> b.onclick = closeModal);

async function novaVersaoProposta(codBase){
  if(!podeEscrever('propostas')){ toast('Sem permissão para criar versão.','danger'); return; }
  const vs = (STATE.cache.propostas||[]).filter(p=>p.codigo_base===codBase).sort((a,b)=>(b.versao||0)-(a.versao||0));
  if(!vs.length) return;
  const base = vs[0];
  const motivo = prompt('Motivo da nova versão (alteração de valor, quantitativo, módulos, desconto, etc.):', 'Ajuste comercial solicitado pelo cliente');
  if(motivo==null) return;
  const nova = JSON.parse(JSON.stringify(base));
  nova.id = newId('PROP');
  nova.versao = (base.versao||1) + 1;
  nova.codigo = `${codBase}-v${String(nova.versao).padStart(2,'0')}`;
  nova.data_criacao = today();
  nova.data_envio = '';
  nova.status = 'Rascunho';
  nova.motivo_revisao = motivo;
  nova.substitui = base.codigo;
  await dbPut('propostas', nova);
  // Marca a anterior como Substituída
  base.status = 'Substituída';
  await dbPut('propostas', base);
  // Cria entrada na entidade Versões
  await dbPut('versoes', {
    id: newId('VER'),
    cod_base: codBase,
    n_versao: nova.versao,
    proposta: nova.id,
    data: today(),
    substitui: base.codigo,
    motivo: 'Solicitação do cliente',
    sintese: motivo,
    status_anterior: 'Substituída',
    vigente: 'Sim',
    aprovacao: 'Pendente',
  });
  await refreshCache('propostas'); await refreshCache('versoes');
  toast(`Versão v${String(nova.versao).padStart(2,'0')} criada.`,'ok');
  openPropostaDetail(nova);
}

async function registrarEnvioProposta(p){
  if(!podeEscrever('envios')){ toast('Sem permissão.','danger'); return; }
  const c = byId('clientes',p.cliente)||{};
  const usuarios = (STATE.cache.usuarios||[]).filter(u=>u.ativo);
  showModal({
    title:'Registrar envio · '+p.codigo,
    crumb:'PROPOSTA',
    body:`<div class="form cols-2">
      <div class="field"><label>Data do envio</label><input id="ev-data" type="date" value="${today()}"></div>
      <div class="field"><label>Canal</label><select id="ev-canal">${LIST.CANAL.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>
      <div class="field full"><label>Destinatários</label><input id="ev-dest" value="${esc((c.dirigente||'')+' · '+(c.email||''))}"></div>
      <div class="field"><label>Tipo de material</label><select id="ev-tipo">${LIST.TIPO_MATERIAL.map(o=>`<option ${o==='Proposta'?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
      <div class="field"><label>Responsável</label><select id="ev-resp">${usuarios.map(u=>`<option value="${u.id}" ${u.id===STATE.currentUser.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></div>
      <div class="field full"><label>Observações</label><textarea id="ev-obs" rows="3"></textarea></div>
    </div>`,
    actions:[
      {label:'Cancelar', cls:'btn-ghost', onclick:closeModal},
      {label:'Salvar', cls:'btn-gold', onclick: async()=>{
        const env = {id:newId('EN'), data:$('#ev-data').value, cliente:p.cliente, programa:p.programa, proposta:p.id, tipo:$('#ev-tipo').value, destinatarios:$('#ev-dest').value, canal:$('#ev-canal').value, responsavel:$('#ev-resp').value, status:'Enviado', observacoes:$('#ev-obs').value};
        await dbPut('envios', env); await refreshCache('envios');
        if(['Rascunho','Em revisão','Aprovação interna'].includes(p.status)){ p.status='Enviada'; p.data_envio = env.data; p.canal_envio=env.canal; p.destinatario=env.destinatarios; await dbPut('propostas',p); await refreshCache('propostas'); }
        toast('Envio registrado.','ok');
        closeModal();
        openPropostaDetail(p);
      }}
    ]
  });
}

function startPropostaWizard(opp){
  if(!podeEscrever('propostas')){ toast('Sem permissão para criar proposta.','danger'); return; }
  const o = typeof opp==='string' ? byId('oportunidades',opp) : opp;
  const meta = (STATE.cache.meta||[]).find(m=>m.id==='config')||{ano:2026,validade_padrao:30};
  STATE.wizard = {
    oportunidade: o?.id || '',
    cliente: o?.cliente || (STATE.cache.clientes[0]?.id||''),
    programa: o?.programa || (STATE.cache.programas[0]?.id||''),
    tipo: 'Programa Completo',
    modulos: o?.modulos||[],
    produtos: o?.produtos||[],
    qtd_pagantes: o?.qtd||0,
    cortesias: 0,
    valor_unitario: 0,
    perc_desconto: 0,
    modalidade: o?.modalidade||'',
    replay: '90 dias',
    cond_pagto: 'À vista após NF · 15 dias',
    cond_especificas: '',
    observacoes: '',
    elaborador: STATE.currentUser?.id||'',
    aprovador: 'USR-002',
    validade_dias: meta.validade_padrao||30,
  };
  renderWizard();
}

}

async function finalizarWizard(){
  const w = STATE.wizard;
  if(!w.cliente || !w.programa){ toast('Selecione cliente e programa.','danger'); return; }
  const c = byId('clientes',w.cliente); const pg = byId('programas',w.programa);
  const meta = (STATE.cache.meta||[]).find(m=>m.id==='config')||{ano:2026,validade_padrao:30};
  const ano = meta.ano;
  const sigla = (c.sigla||c.orgao||'').replace(/[^A-Z0-9]/gi,'').toUpperCase();
  const codBase = `NTC-PROP-${ano}-${pg.sigla}-${c.uf}-${sigla}`;
  const existing = (STATE.cache.propostas||[]).filter(p=>p.codigo_base===codBase);
  const versao = existing.length ? Math.max(...existing.map(p=>p.versao||0))+1 : 1;
  const vb = Number(w.valor_unitario||0)*Number(w.qtd_pagantes||0);
  const desc = vb*Number(w.perc_desconto||0)/100;
  const vl = vb - desc;
  const validade = addDays(today(), w.validade_dias);

  const p = {
    id: newId('PROP'),
    codigo_base: codBase,
    codigo: `${codBase}-v${String(versao).padStart(2,'0')}`,
    oportunidade: w.oportunidade,
    cliente: w.cliente,
    programa: w.programa,
    tipo: w.tipo,
    versao,
    modulos: w.modulos.slice(),
    produtos: w.produtos.slice(),
    qtd_pagantes: w.qtd_pagantes,
    cortesias: w.cortesias,
    valor_unitario: w.valor_unitario,
    perc_desconto: w.perc_desconto/100,
    desconto: desc,
    valor_bruto: vb,
    valor_liquido: vl,
    modalidade: w.modalidade,
    replay: w.replay,
    cond_pagto: w.cond_pagto,
    cond_especificas: w.cond_especificas,
    observacoes: w.observacoes,
    elaborador: w.elaborador,
    aprovador: w.aprovador,
    data_criacao: today(),
    data_envio: '',
    validade,
    status: 'Rascunho',
    canal_envio:'',
    destinatario:'',
    motivo_revisao: versao>1?'Nova versão gerada pelo assistente':'',
    // Registra qual versão de conteúdo institucional foi usada (Biblioteca-first)
    versao_conteudo: '',
    versao_conteudo_label: '',
  };
  // Resolve a Biblioteca antes de gravar, para já registrar a versão
  const bib = getConteudoInstitucional(p);
  if(bib){ p.versao_conteudo = bib.id; p.versao_conteudo_label = bib.titulo + ' · v' + String(bib.versao||1).padStart(2,'0'); }
  await dbPut('propostas', p); await refreshCache('propostas');
  toast(`Proposta ${p.codigo} criada.`,'ok');
  openPropostaDetail(p);
}

function abrirHtmlProposta(p, autoprint){
  const html = gerarHtmlProposta(p);
  const w = window.open('','_blank');
  w.document.write(html); w.document.close();
  if(autoprint) setTimeout(()=>w.print(), 800);
}

function gerarHtmlProposta(p){
  if(p.tipo==='Programa Completo') return tplProgramaCompleto(p);
  if(p.tipo==='Módulo Avulso') return tplModuloAvulso(p);
  if(p.tipo==='Produto/Evento Avulso') return tplProdutoAvulso(p);
  return tplCustomizada(p);
}

/* ----------------------------------------------------------------
   BIBLIOTECA-FIRST · busca conteúdo institucional na Biblioteca
   Comercial NTC antes de cair para o cadastro cru do programa.
   Registra qual versão foi usada na proposta.
---------------------------------------------------------------- */
function getConteudoInstitucional(p){
  const bib = STATE.cache.biblioteca||[];
  // 1. Tenta entrada Publicada vinculada ao módulo selecionado (se Módulo Avulso)
  let entrada = null;
  if(p.tipo==='Módulo Avulso' && (p.modulos||[]).length){
    const mid = p.modulos[0];
    entrada = bib.filter(b=>b.tipo_vinculo==='Módulo' && b.modulo===mid && b.status==='Publicado').sort((a,b)=>(b.versao||0)-(a.versao||0))[0];
  }
  // 2. Tenta entrada Publicada vinculada ao produto/evento selecionado
  if(!entrada && p.tipo==='Produto/Evento Avulso' && (p.produtos||[]).length){
    const pid = p.produtos[0];
    entrada = bib.filter(b=>b.tipo_vinculo==='Produto/Evento' && b.produto===pid && b.status==='Publicado').sort((a,b)=>(b.versao||0)-(a.versao||0))[0];
  }
  // 3. Cai para entrada do Programa
  if(!entrada){
    entrada = bib.filter(b=>b.tipo_vinculo==='Programa' && b.programa===p.programa && b.status==='Publicado').sort((a,b)=>(b.versao||0)-(a.versao||0))[0];
  }
  // 4. Registra a versão usada (se a proposta ainda não a tinha gravada)
  if(entrada && p.id && p.versao_conteudo!==entrada.id){
    p.versao_conteudo = entrada.id;
    p.versao_conteudo_label = entrada.titulo + ' · v' + String(entrada.versao||1).padStart(2,'0');
    dbPut('propostas', p).then(()=>refreshCache('propostas'));
  }
  return entrada;
}

// Helper · obtém valor com fallback Biblioteca → Programa cru
function bibOuProg(bib, pg, campoBib, campoProg){
  if(bib && bib[campoBib] && String(bib[campoBib]).trim()) return bib[campoBib];
  return (pg||{})[campoProg||campoBib] || '';
}

// Enriquece o objeto programa com dados da Biblioteca Publicada (biblioteca-first)
function mergePg(p, pg){
  const bib = getConteudoInstitucional(p);
  if(!bib) return pg||{};
  const out = Object.assign({}, pg||{});
  // Mapeamento Biblioteca → chaves usadas nos templates (mesmo nome do schema programa)
  if(bib.apresentacao) out.descricao = bib.apresentacao;
  if(bib.objetivo_geral) out.objetivo_geral = bib.objetivo_geral;
  if(bib.objetivos_especificos) out.objetivos_esp = bib.objetivos_especificos;
  if(bib.publico_alvo) out.publico = bib.publico_alvo;
  if(bib.eixos_tematicos) out.eixos_tematicos = bib.eixos_tematicos;
  if(bib.metodologia) out.metodologia = bib.metodologia;
  if(bib.diferenciais) out.diferenciais = bib.diferenciais;
  if(bib.resultados) out.resultados = bib.resultados;
  if(bib.docentes) out.corpo_docente = bib.docentes;
  if(bib.eventon) out.eventon = bib.eventon;
  if(bib.certificacao) out.certificacao = bib.certificacao;
  if(bib.ch) out.ch_total = bib.ch;
  if(bib.modalidade) out.modalidades = bib.modalidade;
  out._bibInfo = { id:bib.id, versao:bib.versao, titulo:bib.titulo };
  return out;
}

// Enriquece o objeto módulo com a entrada de Biblioteca específica do módulo
function mergeModulo(p, m){
  const bib = STATE.cache.biblioteca||[];
  const entrada = bib.filter(b=>b.tipo_vinculo==='Módulo' && b.modulo===m.id && b.status==='Publicado').sort((a,b)=>(b.versao||0)-(a.versao||0))[0];
  if(!entrada) return m||{};
  const out = Object.assign({}, m||{});
  if(entrada.apresentacao) out.descricao = entrada.apresentacao;
  if(entrada.objetivo_geral) out.objetivo = entrada.objetivo_geral;
  if(entrada.programacao) out.programacao = entrada.programacao;
  if(entrada.docentes) out.palestrantes = entrada.docentes;
  if(entrada.publico_alvo) out.publico = entrada.publico_alvo;
  if(entrada.diferenciais) out.diferenciais = entrada.diferenciais;
  if(entrada.resultados) out.resultados = entrada.resultados;
  if(entrada.ch) out.ch = entrada.ch;
  if(entrada.eixos_tematicos) out.eixo = (out.eixo||'') || entrada.eixos_tematicos.split('\n')[0];
  // Conteúdos centrais — tenta puxar 'conteudos' se houver, senão usa programação
  out.conteudos = entrada.observacoes_uso?out.conteudos:out.conteudos;
  return out;
}

/* ============================================================
   MOTOR DOCUMENTAL · v2 (ETAPA 1)
   CSS A4 dedicado · capa fullbleed · cabeçalho/rodapé recorrentes
   · numeração de páginas · seções vazias ocultas com renumeração
   ============================================================ */

// Constrói as seções da proposta com renumeração dinâmica.
// Cada item: { titulo, body, fallback? }. Se body vazio e sem fallback, a seção é omitida.
// O parâmetro `inicio` permite iniciar a numeração em valor diferente de 1 (útil quando a Capa é a seção 1).
function buildSecoes(secoes, inicio = 1){
  let n = inicio - 1;
  const out = [];
  for(const s of secoes){
    const body = (s.body||'').toString().trim();
    if(!body && !s.fallback) continue;
    n++;
    out.push(`<section class="sec"><h2><span class="num">${n}</span>${esc(s.titulo)}</h2>${body || s.fallback}</section>`);
  }
  return out.join('');
}

// Renderiza um bloco de parágrafo a partir de string com quebras (\n\n = parágrafo; \n simples = lista se começar com • ou - ou número)
function bloco(txt){
  if(!txt) return '';
  const t = String(txt).trim();
  // Detecta lista (linhas que começam com • - * ou 1. )
  const linhas = t.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const ehLista = linhas.length>=2 && linhas.every(l=>/^([•\-\*]|\d+[.\)])\s+/.test(l));
  if(ehLista){
    return '<ul>'+linhas.map(l=>'<li>'+esc(l.replace(/^([•\-\*]|\d+[.\)])\s+/,''))+'</li>').join('')+'</ul>';
  }
  // Parágrafos separados por linha em branco
  const paragrafos = t.split(/\n\s*\n/).filter(Boolean);
  return paragrafos.map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
}

/* ============================================================
   MOTOR DE SELEÇÃO DE TEXTOS-PADRÃO (Etapa 3)
   Aplica regras automáticas para puxar blocos da Biblioteca de
   Textos-Padrão de Proposta com base em modalidade, replay,
   certificação, natureza do cliente e presença de EventON.
   Auditoria: grava em p.blocos_textos_usados os IDs efetivamente
   utilizados, para preservar a versão usada no momento da emissão.
   ============================================================ */

// Seleciona o melhor bloco Publicado conforme critérios.
// Critérios suportados: categoria, modalidade, tipoProposta, tituloPrefix.
// Aplica fallback Modalidade={X} → Modalidade=Todas; idem para tipoProposta.
function pickBloco({categoria, modalidade, tipoProposta, tituloPrefix} = {}){
  const todos = STATE.cache.textos_padrao || [];
  const matches = todos.filter(t => {
    if(t.status !== 'Publicado') return false;
    if(categoria && t.categoria !== categoria) return false;
    if(tituloPrefix){
      const tit = (t.titulo||'').toLowerCase();
      if(!tit.startsWith(tituloPrefix.toLowerCase())) return false;
    }
    return true;
  });
  // Ranking: prefere modalidade exata e tipoProposta exato; "Todas" como fallback.
  const score = (t) => {
    let s = 0;
    if(modalidade){
      if(t.modalidade === modalidade) s += 100;
      else if(t.modalidade === 'Todas') s += 50;
      else return -1; // modalidade incompatível
    }
    if(tipoProposta){
      if(t.tipo_aplicavel === tipoProposta) s += 10;
      else if(t.tipo_aplicavel === 'Todas') s += 5;
      else return -1;
    }
    s += (t.versao || 0); // desempate por versão mais recente
    return s;
  };
  const ranked = matches.map(t => ({t, s: score(t)})).filter(x => x.s >= 0).sort((a,b) => b.s - a.s);
  return ranked[0]?.t || null;
}

// Detecta modalidade canônica (Online | Presencial | Híbrido) a partir do texto livre
// que o vendedor escreveu no campo "modalidade" da proposta.
function detectarModalidade(p){
  const m = (p.modalidade||'').toLowerCase();
  if(!m) return null;
  if(m.includes('híbrid') || m.includes('hibrid')) return 'Híbrido';
  if(m.includes('presencial')) return 'Presencial';
  if(m.includes('online') || m.includes('ead') || m.includes('eventon') || m.includes('ao vivo') || m.includes('digital')) return 'Online';
  if(m.includes('in company') || m.includes('turma fechada')) return 'Presencial'; // default conservador
  return null;
}

// Identifica órgão público — entra a maioria dos tipos de instituição da Administração Pública.
function ehOrgaoPublico(c){
  if(!c) return false;
  const tipo = (c.tipo||'').toLowerCase();
  const esfera = (c.esfera||'').toLowerCase();
  const publicos = ['secretaria','autarquia','fundação','fundacao','tribunal','câmara','camara','assembleia','consórcio','consorcio','escola de governo'];
  if(publicos.some(t => tipo.includes(t))) return true;
  if(['municipal','estadual','federal'].includes(esfera)) return true;
  return false;
}

// Decide se proposta envolve EventON.
function envolveEventON(p){
  return (p.modalidade||'').toLowerCase().includes('eventon');
}

// Decide se proposta envolve replay (campo p.replay preenchido com algo significativo)
function envolveReplay(p){
  const r = (p.replay||'').toString().trim();
  return r.length>0 && !/^(não|nao|n\/a|na|0)$/i.test(r);
}

// Decide se há certificação prevista — verifica programa/biblioteca ou usa default true
function envolveCertificacao(p){
  // Se a proposta menciona modalidade qualquer, sempre haverá certificação institucional NTC
  return true;
}

/* ============================================================
   RENDERIZADOR EDITORIAL UNIFICADO (Etapa 4)
   Monta a sequência institucional de 23 seções internas (2-24)
   além da Capa (seção 1), com regra de fallback em três níveis:
   (1) dados da proposta/cliente/programa/biblioteca já merged,
   (2) Texto-Padrão Publicado da categoria correspondente,
   (3) fallback institucional embutido — e omite a seção
   quando nenhuma fonte produz conteúdo significativo.
   Auditoria: registra em p.blocos_textos_usados os IDs dos
   textos-padrão efetivamente aplicados.
   ============================================================ */

// Wrapper de pickBloco com registro de auditoria no ctx.
function pickPadrao(ctx, opcoes){
  const t = pickBloco(opcoes);
  if(t && ctx){
    if(!ctx.usados) ctx.usados = [];
    ctx.usados.push(t.id);
  }
  return t;
}

// Renderiza programação conforme o tipo de proposta
function secProgramacao(ctx){
  const { p, pg } = ctx;
  if(p.tipo === 'Programa Completo'){
    const mods = (STATE.cache.modulos||[]).filter(m=>m.programa===p.programa).sort((a,b)=>(a.numero||0)-(b.numero||0)).map(m=>mergeModulo(p,m));
    if(!mods.length) return '';
    const intro = `<p>A presente proposta contempla a <strong>trilha completa do Programa ${esc(pg.sigla||'')}</strong>, integrada pelos seguintes módulos formativos:</p>`;
    const cards = mods.map(m=>`
      <div class="item-card">
        <div class="titulo">Módulo ${m.numero} · ${esc(m.titulo_comercial||m.titulo)}</div>
        <div class="meta">${esc(m.eixo||'')} ${m.ch?'· '+esc(m.ch):''} ${m.formato?'· '+esc(m.formato):''}</div>
        ${m.descricao?`<p>${esc(m.descricao)}</p>`:''}
      </div>`).join('');
    return intro + cards;
  }
  if(p.tipo === 'Módulo Avulso'){
    const m = mergeModulo(p, byId('modulos', (p.modulos||[])[0]) || {});
    if(!m.id) return '';
    return `
      <div class="item-card">
        <div class="titulo">Módulo ${m.numero||''} · ${esc(m.titulo_comercial||m.titulo||'')}</div>
        <div class="meta">${esc(m.eixo||'')} ${m.ch?'· '+esc(m.ch):''} ${m.formato?'· '+esc(m.formato):''}</div>
        ${m.descricao?'<h4>Apresentação</h4>'+bloco(m.descricao):''}
        ${m.conteudos?'<h4>Conteúdos Centrais</h4>'+bloco(m.conteudos):''}
        ${m.programacao?'<h4>Programação Detalhada</h4>'+bloco(m.programacao):''}
        ${m.resultados?'<h4>Resultados Esperados</h4>'+bloco(m.resultados):''}
      </div>`;
  }
  if(p.tipo === 'Produto/Evento Avulso'){
    const pd = byId('produtos', (p.produtos||[])[0]) || {};
    if(!pd.id) return '';
    return `
      <div class="item-card">
        <div class="titulo">${esc(pd.tipo||'')} · ${esc(pd.nome||'')}</div>
        <div class="meta">${esc(pd.subtitulo||'')} ${pd.local?'· '+esc(pd.local):''}</div>
        ${pd.descricao?'<h4>Apresentação</h4>'+bloco(pd.descricao):''}
        ${pd.programacao?'<h4>Programação</h4>'+bloco(pd.programacao):'<h4>Programação</h4>'+bloco('A definir conforme cronograma EventON ou cronograma exclusivo do contratante.')}
        ${pd.palestrantes?'<h4>Palestrantes</h4>'+bloco(pd.palestrantes):''}
      </div>`;
  }
  // Customizada / In Company
  const mods = (p.modulos||[]).map(id=>byId('modulos',id)).filter(Boolean).map(m=>mergeModulo(p,m));
  const prods = (p.produtos||[]).map(id=>byId('produtos',id)).filter(Boolean);
  if(!mods.length && !prods.length){
    return '<p style="font-style:italic;color:#6B6B6B">Arquitetura customizada a ser desenhada conjuntamente com o(a) demandante a partir de diagnóstico institucional preliminar e workshop de pactuação técnica.</p>';
  }
  return [
    ...mods.map(m=>`<div class="item-card"><div class="titulo">Módulo ${m.numero} · ${esc(m.titulo_comercial||m.titulo)}</div><div class="meta">${esc(m.eixo||'')} ${m.ch?'· '+esc(m.ch):''}</div>${m.descricao?'<p>'+esc(m.descricao)+'</p>':''}</div>`),
    ...prods.map(pd=>`<div class="item-card"><div class="titulo">${esc(pd.tipo)} · ${esc(pd.nome)}</div><div class="meta">${esc(pd.formato||'')} ${pd.ch?'· '+esc(pd.ch):''}</div>${pd.descricao?'<p>'+esc(pd.descricao)+'</p>':''}</div>`)
  ].join('');
}

  const descritor = (p.tipo==='Programa Completo') ? `trilha completa do Programa <strong>${esc(pg.nome||'')}</strong>` :
                    (p.tipo==='Módulo Avulso') ? `Módulo do Programa <strong>${esc(pg.sigla||'')}</strong>` :
                    (p.tipo==='Produto/Evento Avulso') ? `produto/evento institucional vinculado ao Programa <strong>${esc(pg.sigla||'')}</strong>` :
                    `solução customizada vinculada ao Programa <strong>${esc(pg.sigla||'')}</strong>`;
  const personalizado = `<p>Constitui objeto da presente proposta a prestação, pelo Instituto NTC do Brasil ao(à) <strong>${esc(c.orgao||'contratante')}</strong>, de serviços de capacitação executiva e técnica referentes à <strong>${descritor}</strong>, na modalidade <strong>${esc(p.modalidade||'a pactuar')}</strong>, observados os quantitativos, condições comerciais e cláusulas pactuadas neste documento.</p>`;
  if(tp) return personalizado + bloco(tp.texto);
  return personalizado;
}

// Seção 6 — Objetivos
function secObjetivos(ctx){
  const { pg } = ctx;
  const og = pg.objetivo_geral||'';
  const oe = pg.objetivos_esp||'';
  if(!og && !oe) return `<h3>Objetivo Geral</h3>${bloco('')}`;
  let html = '';
  if(og) html += `<h3>Objetivo Geral</h3>${bloco(og)}`;
  if(oe) html += `<h3>Objetivos Específicos</h3>${bloco(oe)}`;
  return html;
}

// Seção 7 — Público-alvo
function secPublico(ctx){
  const { pg } = ctx;
  if(pg.publico && pg.publico.trim()) return bloco(pg.publico);
  return bloco('');
}

// Seção 8 — Arquitetura da Solução
function secArquitetura(ctx){
  const { p, pg } = ctx;
  const mods = (STATE.cache.modulos||[]).filter(m=>m.programa===p.programa);

    <p>A arquitetura técnico-pedagógica do Programa <strong>${esc(pg.sigla||'NTC')}</strong> articula-se em torno dos eixos estratégicos do programa e admite múltiplas modalidades de execução, conforme o interesse e a conveniência do(a) demandante.</p>
    <div class="grid3">

// Seção 10 — Metodologia
function secMetodologia(ctx){
  const { p, pg } = ctx;
  let html = '';
  if(pg.metodologia && pg.metodologia.trim()){
    html += bloco(pg.metodologia);
  } else {
    const tp = pickPadrao(ctx, { categoria:'Metodologia NTC', tipoProposta: p.tipo });

    html += '<h3>Eixos Temáticos</h3>' + bloco(pg.eixos_tematicos);

}

// Seção 11 — Corpo Docente / Curadoria
function secDocencia(ctx){
  const { pg } = ctx;
  if(pg.corpo_docente && pg.corpo_docente.trim()) return bloco(pg.corpo_docente);
  return bloco('Doutores e mestres com vivência prática junto à Administração Pública, sob curadoria científica do Conselho Acadêmico do Instituto NTC do Brasil.');
}

// Seção 12 — Diferenciais NTC
function secDiferenciais(ctx){
  const { pg } = ctx;
  if(pg.diferenciais && pg.diferenciais.trim()) return bloco(pg.diferenciais);
  return bloco('');
}

// Seção 13 — Resultados Esperados
function secResultados(ctx){
  const { pg } = ctx;
  if(pg.resultados && pg.resultados.trim()) return bloco(pg.resultados);
  return bloco('');

function secQuadroComercial(ctx){

// Seção 15 — Condições Comerciais (boxes + texto-padrão complementar)
function secCondicoesComerciais(ctx){
  const { p, pg } = ctx;
  let html = corpoCondicoes(p, pg);
  const tp = pickPadrao(ctx, { categoria:'Condições comerciais', tipoProposta: p.tipo });
  if(tp) html += `<h3>Cláusulas Comerciais Complementares</h3>${bloco(tp.texto)}`;
  return html;
}

// Seção 16 — Condições de Participação por modalidade
function secCondicoesParticipacao(ctx){
  const { p } = ctx;
  const modalidade = detectarModalidade(p);
  const tp = pickPadrao(ctx, { tituloPrefix:'Condições de Participação —', modalidade, tipoProposta: p.tipo });
  if(tp) return bloco(tp.texto);
  // Fallback: tenta qualquer "Condições de Participação —" sem filtro de modalidade
  const tpAlt = pickPadrao(ctx, { tituloPrefix:'Condições de Participação —' });
  if(tpAlt) return bloco(tpAlt.texto);
  return '';
}

// Seção 17 — Certificação e Replay (combinado)
function secCertificacaoReplay(ctx){
  const { p, pg } = ctx;
  let html = '';
  // Certificação
  const tpCert = pickPadrao(ctx, { categoria:'Certificação', tipoProposta: p.tipo });
  if(tpCert){ html += '<h3>Certificação</h3>' + bloco(tpCert.texto); }
  else if(pg.certificacao){ html += '<h3>Certificação</h3>' + bloco(pg.certificacao); }
  else { html += '<h3>Certificação</h3>' + bloco(''); }
  // Replay
  if(envolveReplay(p)){
    const tpRep = pickPadrao(ctx, { categoria:'Replay', tipoProposta: p.tipo });
    if(tpRep){ html += '<h3>Replay</h3>' + bloco(tpRep.texto); }
    else { html += `<h3>Replay</h3><p>Período de replay institucional pactuado: <strong>${esc(p.replay||'')}</strong>.</p>`; }
  }
  return html;
}

// Seção 18 — Cancelamento, Substituição e Ausência
// Prioridade: bloco unificado (categoria "Cancelamento, substituição e ausência")
// Fallback: três categorias separadas legadas (Cancelamento / Substituição / Ausência)
// Em qualquer caso, anexa o bloco de Reagendamento (categoria própria) ao final.
function secCancelamentoSubAusencia(ctx){
  const { p } = ctx;
  let html = '';
  const unificado = pickPadrao(ctx, { categoria:'Cancelamento, substituição e ausência', tipoProposta: p.tipo });
  if(unificado){
    html += bloco(unificado.texto);
  } else {
    const tpCanc = pickPadrao(ctx, { categoria:'Cancelamento', tipoProposta: p.tipo });
    if(tpCanc) html += '<h3>Cancelamento</h3>' + bloco(tpCanc.texto);
    const tpSubs = pickPadrao(ctx, { categoria:'Substituição de participantes', tipoProposta: p.tipo });
    if(tpSubs) html += '<h3>Substituição de Participantes</h3>' + bloco(tpSubs.texto);
    const tpAus = pickPadrao(ctx, { categoria:'Ausência / não participação', tipoProposta: p.tipo });
    if(tpAus) html += '<h3>Ausência e Não Participação</h3>' + bloco(tpAus.texto);
  }
  const tpReag = pickPadrao(ctx, { categoria:'Reagendamento ou alteração pelo Instituto NTC', tipoProposta: p.tipo });
  if(tpReag) html += '<h3>Reagendamento ou Alteração pelo Instituto NTC</h3>' + bloco(tpReag.texto);
  return html;
}

// Seção 19 — Proteção de Conteúdo e Direitos Autorais
function secProtecaoConteudo(ctx){
  const tp = pickPadrao(ctx, { categoria:'Proteção de conteúdo, direitos autorais e uso de imagem', tipoProposta: ctx.p.tipo });
  return tp ? bloco(tp.texto) : '';
}

// Seção 20 — Forma de Contratação
function secFormaContratacao(ctx){
  const tp = pickPadrao(ctx, { categoria:'Forma de contratação', tipoProposta: ctx.p.tipo });
  return tp ? bloco(tp.texto) : '';
}

// Seção 21 — Fundamentação Legal e Segurança Jurídica
function secFundamentacaoLegal(ctx){
  const { p, c } = ctx;
  let html = '';
  // Para órgão público — fundamentação específica
  if(ehOrgaoPublico(c)){
    const tp = pickPadrao(ctx, { categoria:'Fundamentação legal', tipoProposta: p.tipo });
    if(tp) html += bloco(tp.texto);
  }
  // Segurança jurídica institucional (texto-padrão ou TXT_INST)
  html += bloco('');

// Seção 22 — Próximos Passos
function secProximosPassos(ctx){
  const tp = pickPadrao(ctx, { categoria:'Próximos passos', tipoProposta: ctx.p.tipo });
  return tp ? bloco(tp.texto) : '';
}

// Seção 23 — Fechamento Institucional
function secFechamento(ctx){
  const { c } = ctx;
  const tp = pickPadrao(ctx, { categoria:'Fechamento institucional', tipoProposta: ctx.p.tipo });
  let html = '';
  if(tp){
    html += bloco(tp.texto.replace('(a) demandante', '(a) <strong>'+esc(c.orgao||'demandante')+'</strong>'));
  } else {
    html += `<p>O Instituto NTC do Brasil agradece a <strong>${esc(c.orgao||'')}</strong> pela oportunidade desta apresentação e renova a disposição institucional de servir à elevação da qualidade dos serviços públicos.</p>`;
  }
  html += '<div class="quote">Excelência institucional, rigor técnico e compromisso com a Administração Pública brasileira.</div>';

}

// Seção 24 — Dados Institucionais da NTC
// Prioridade: bloco unificado da categoria "Dados institucionais"
// Fallback: composição entre Apresentação institucional NTC + Dados bancários (categorias legadas).
function secDadosInstitucionais(ctx){
  const dadosInst = pickPadrao(ctx, { categoria:'Dados institucionais', tipoProposta: ctx.p.tipo });
  if(dadosInst){
    return bloco(dadosInst.texto);
  }
  const tpInst = pickPadrao(ctx, { categoria:'Apresentação institucional NTC', tipoProposta: ctx.p.tipo });
  const tpBanco = pickPadrao(ctx, { categoria:'Dados bancários', tipoProposta: ctx.p.tipo });
  let html = '';
  if(tpInst) html += '<h3>Sobre o Instituto NTC do Brasil</h3>' + bloco(tpInst.texto);
  if(tpBanco) html += '<h3>Dados para Contratação e Pagamento</h3>' + bloco(tpBanco.texto);
  if(html) html += `<div class="footer-final"><strong>Instituto NTC do Brasil</strong> · contato@institutontc.com.br · www.institutontc.com.br</div>`;
  return html;
}

// === Orquestrador principal ===
function renderTodasSecoes(p, c, pg){
  const ctx = { p, c, pg, usados: [] };

  // Se já há auditoria histórica gravada, NÃO sobrescreve — preserva versões usadas
  const temAuditoria = Array.isArray(p.blocos_textos_usados) && p.blocos_textos_usados.length > 0;

  const secoes = [
    { titulo:'Dados de Identificação da Proposta', body: secDadosIdentificacao(ctx) },
    { titulo:'Apresentação Executiva', body: secApresentacao(ctx) },
    { titulo:'Contexto e Justificativa', body: secContexto(ctx) },
    { titulo:'Objeto da Proposta', body: secObjeto(ctx) },
    { titulo:'Objetivos', body: secObjetivos(ctx) },
    { titulo:'Público-alvo', body: secPublico(ctx) },
    { titulo:'Arquitetura da Solução', body: secArquitetura(ctx) },
    { titulo:'Programação e Itens Contemplados', body: secProgramacao(ctx) },
    { titulo:'Metodologia', body: secMetodologia(ctx) },
    { titulo:'Corpo Docente e Curadoria', body: secDocencia(ctx) },
    { titulo:'Diferenciais NTC', body: secDiferenciais(ctx) },
    { titulo:'Resultados Esperados', body: secResultados(ctx) },
    { titulo:'Quadro Comercial', body: secQuadroComercial(ctx) },
    { titulo:'Condições Comerciais', body: secCondicoesComerciais(ctx) },
    { titulo:'Condições de Participação conforme Modalidade', body: secCondicoesParticipacao(ctx) },
    { titulo:'Certificação e Replay', body: secCertificacaoReplay(ctx) },
    { titulo:'Cancelamento, Substituição e Ausência', body: secCancelamentoSubAusencia(ctx) },
    { titulo:'Proteção de Conteúdo e Direitos Autorais', body: secProtecaoConteudo(ctx) },
    { titulo:'Forma de Contratação', body: secFormaContratacao(ctx) },
    { titulo:'Fundamentação Legal e Segurança Jurídica', body: secFundamentacaoLegal(ctx) },
    { titulo:'Próximos Passos', body: secProximosPassos(ctx) },
    { titulo:'Fechamento Institucional', body: secFechamento(ctx) },
    { titulo:'Dados Institucionais da NTC', body: secDadosInstitucionais(ctx) },
  ];

  // Auditoria — grava IDs dos blocos efetivamente usados (apenas se ainda não houver)
  if(!temAuditoria && p.id && ctx.usados.length > 0){
    const ids = [...new Set(ctx.usados)];
    p.blocos_textos_usados = ids;
    dbPut('propostas', p).then(()=>{
      const idx = (STATE.cache.propostas||[]).findIndex(x => x.id === p.id);
      if(idx >= 0) STATE.cache.propostas[idx] = p;
    }).catch(()=>{});
  }

  // Inicia em 2 — a Capa é a seção 1
  return buildSecoes(secoes, 2);
}

<body>

<div class="body-wrap">

</div>
</body></html>`;
}

async function novaVersaoBiblioteca(id){
  const base = (STATE.cache.biblioteca||[]).find(b=>b.id===id);
  if(!base) return;
  const sintese = prompt('Síntese da alteração (ex: atualização de programação, correção de diferenciais, etc.):', '');
  if(sintese===null) return;
  // Achar todas as versões do mesmo vínculo
  const irmas = (STATE.cache.biblioteca||[]).filter(b=> b.tipo_vinculo===base.tipo_vinculo && b.programa===base.programa && (b.modulo||'')===(base.modulo||'') && (b.produto||'')===(base.produto||''));
  const nv = Math.max(...irmas.map(b=>b.versao||1)) + 1;
  const nova = JSON.parse(JSON.stringify(base));
  nova.id = newId('BIB');
  nova.versao = nv;
  nova.status = 'Rascunho';
  nova.data_aprovacao = '';
  nova.substituiu = base.id;
  nova.observacoes_uso = (base.observacoes_uso||'') + '\n[v'+String(nv).padStart(2,'0')+'] '+sintese;
  await dbPut('biblioteca', nova);
  // Marcar a versão Publicada anterior como Substituída
  if(base.status==='Publicado'){ base.status = 'Substituído'; await dbPut('biblioteca', base); }
  await refreshCache('biblioteca');
  toast(`Versão v${String(nv).padStart(2,'0')} criada (Rascunho).`,'ok');
  openEntityForm('biblioteca', nova.id);
}

/* ---------- IMPORTAÇÃO de Folder HTML ou PDF ---------- */
function abrirImportadorFolder(tipo){
  const isHtml = tipo==='html';
  showModal({
    title: isHtml ? 'Importar Folder HTML' : 'Importar Folder PDF',
    crumb: 'BIBLIOTECA · IMPORTAÇÃO',
    body:`
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">
        ${isHtml?'Selecione um arquivo <strong>.html</strong> do folder do programa ou módulo. O sistema extrai título, descrição, programação, palestrantes, carga horária e imagens — depois abre uma tela de conferência humana antes de gravar.':'Selecione um arquivo <strong>.pdf</strong> do folder. O sistema extrai o texto puro e oferece tela de conferência para você organizar manualmente nos campos corretos da Biblioteca.'}
      </p>
      <div class="form">
        <div class="field"><label>Arquivo ${isHtml?'HTML':'PDF'}</label><input type="file" id="imp-file" accept="${isHtml?'.html,.htm':'.pdf'}"></div>
        <div class="field"><label>Tipo de vínculo</label><select id="imp-vinc">${LIST.TIPO_VINCULO_BIB.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
        <div class="field full"><label>Programa</label><select id="imp-prog">${(STATE.cache.programas||[]).map(p=>`<option value="${p.id}">${esc(p.sigla)} — ${esc(p.nome)}</option>`).join('')}</select></div>
      </div>
    `,
    actions:[
      {label:'Cancelar', cls:'btn-ghost', onclick:closeModal},
      {label:'Processar arquivo', cls:'btn-gold', onclick: ()=>{
        const f = $('#imp-file').files[0];
        if(!f){ toast('Selecione um arquivo.','danger'); return; }
        const vinc = $('#imp-vinc').value;
        const prog = $('#imp-prog').value;
        const reader = new FileReader();
        reader.onload = ()=>{
          if(isHtml){ processarFolderHTML(reader.result, vinc, prog, f.name); }
          else { processarFolderPDF(reader.result, vinc, prog, f.name); }
        };
        if(isHtml) reader.readAsText(f);
        else reader.readAsArrayBuffer(f);
      }}
    ]
  });
}

function processarFolderHTML(htmlStr, tipo_vinculo, programa, fileName){
  closeModal();
  // Parse via DOMParser
  const doc = new DOMParser().parseFromString(htmlStr, 'text/html');
  const txt = (el)=> el?(el.textContent||'').trim().replace(/\s+/g,' '):'';
  const titulo = txt(doc.querySelector('title')) || txt(doc.querySelector('h1')) || fileName.replace(/\.[^.]+$/,'');
  // Tenta capturar descrição
  const metaDesc = doc.querySelector('meta[name="description"]')?.content || '';
  const h1 = txt(doc.querySelector('h1'));
  const h2s = $$('h2', doc).map(h=>txt(h)).join('\n');
  // Parágrafos da página
  const paragrafos = $$('p', doc).map(p=>txt(p)).filter(t=>t.length>30);
  const apresentacao = paragrafos[0] || metaDesc || '';
  const contexto = paragrafos.slice(1,3).join('\n\n');
  // Programação — procura listas e tabelas
  const ulItems = $$('ul li, ol li', doc).map(li=>txt(li)).filter(t=>t.length>0 && t.length<400);
  const programacao = ulItems.slice(0,30).join('\n');
  // Palestrantes — heurística: textos curtos com nome (Prof./Dr./Profa.)
  const palestrantes = paragrafos.concat(ulItems).filter(t=>/(Prof\.|Profa\.|Dr\.|Dra\.|Mestre|Doutor)/i.test(t)).join('; ');
  // Imagens
  const imgs = $$('img', doc).map(i=>({src:i.getAttribute('src')||'',alt:i.getAttribute('alt')||''})).filter(i=>i.src);

  // Heurística para carga horária e formato
  const fullText = doc.body?doc.body.textContent:'';
  const chMatch = fullText.match(/(\d+\s*(?:horas?|h)\b)/i);
  const ch = chMatch ? chMatch[1] : '';
  const fmtMatch = fullText.match(/(presencial|online|h[íi]brido|ead|in company|eventon)/i);
  const formato = fmtMatch ? fmtMatch[1] : '';
  const certMatch = fullText.match(/(certifica[çc][ãa]o[^.]+\.)/i);
  const certificacao = certMatch ? certMatch[1] : '';
  const eventonMatch = fullText.match(/(EventON[^.]+\.)/i);
  const eventon = eventonMatch ? eventonMatch[1] : '';

  // Abrir tela de conferência humana
  abrirConferenciaImportacao({
    origem:'Importado de folder HTML',
    folder_origem: fileName,
    tipo_vinculo, programa,
    titulo, apresentacao, contexto, programacao,
    docentes: palestrantes,
    ch, formato, certificacao, eventon,
    eixos_tematicos: h2s,
    objetivo_geral: paragrafos.find(p=>/objetivo/i.test(p))||'',
    publico_alvo: paragrafos.find(p=>/p[úu]blico/i.test(p))||'',
    diferenciais: ulItems.filter(t=>/(NTC|institucional|certifica|EventON|replay)/i.test(t)).join('\n'),
    resultados: paragrafos.find(p=>/resultado/i.test(p))||'',
    metodologia: paragrafos.find(p=>/metodologi/i.test(p))||'',
    _imagens: imgs
  });
}

function processarFolderPDF(buffer, tipo_vinculo, programa, fileName){
  closeModal();
  // Extração simples de texto do PDF — busca por trechos de texto entre BT e ET
  const bytes = new Uint8Array(buffer);
  let raw = '';
  try{ raw = new TextDecoder('latin1').decode(bytes); }catch(e){ raw = ''; }
  // Captura tudo entre parênteses (texto em PDF)
  const matches = raw.match(/\(([^()]{2,200})\)/g) || [];
  const texto = matches.map(s=>s.slice(1,-1).replace(/\\(\d{3})/g,(_,o)=>String.fromCharCode(parseInt(o,8))).replace(/\\(.)/g,'$1')).join(' ').replace(/\s+/g,' ').trim();
  abrirConferenciaImportacao({
    origem:'Importado de folder PDF',
    folder_origem: fileName,
    tipo_vinculo, programa,
    titulo: fileName.replace(/\.pdf$/i,''),
    apresentacao: texto.slice(0,800),
    contexto: texto.slice(800,2000),
    programacao: '',
    docentes: '', ch:'', formato:'', certificacao:'', eventon:'',
    eixos_tematicos:'', objetivo_geral:'', publico_alvo:'',
    diferenciais:'', resultados:'', metodologia:'',
    _texto_completo: texto
  });
}

/* ============================================================
   TEXTOS-PADRÃO DE PROPOSTA · view com agrupamento por categoria
   + filtros (categoria, modalidade, tipo, status) + versionamento
   ============================================================ */
VIEW_HANDLERS.textos_padrao = function(){
  $('#crumb').textContent = 'BIBLIOTECA COMERCIAL';
  $('#page-title').textContent = 'Textos-Padrão de Proposta';
  $('#page-actions').innerHTML = podeEscrever('textos_padrao') ? `<button class="btn btn-gold" id="btn-newtxt">+ Novo Texto-Padrão</button>` : '';
  if(podeEscrever('textos_padrao')) $('#btn-newtxt').onclick = ()=> openEntityForm('textos_padrao');

  const todos = STATE.cache.textos_padrao || [];
  // Estado de filtros local da view
  if(!STATE.txpFilter) STATE.txpFilter = { cat:'', mod:'', tipo:'', status:'', search:'' };
  const f = STATE.txpFilter;

  const filtrados = todos.filter(t=>{
    if(f.cat && t.categoria !== f.cat) return false;
    if(f.mod && t.modalidade !== f.mod && t.modalidade !== 'Todas') return false;
    if(f.tipo && t.tipo_aplicavel !== f.tipo && t.tipo_aplicavel !== 'Todas') return false;
    if(f.status && t.status !== f.status) return false;
    if(f.search){
      const q = f.search.toLowerCase();
      const blob = `${t.titulo||''} ${t.categoria||''} ${t.texto||''} ${t.observacoes_uso||''}`.toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });

  // Agrupa por categoria
  const porCat = {};
  for(const t of filtrados){
    const k = t.categoria || '— Sem categoria —';
    if(!porCat[k]) porCat[k] = [];
    porCat[k].push(t);
  }
  // Ordena cada grupo por status (Publicado primeiro) e versão decrescente
  const statusOrder = { 'Publicado':0, 'Aprovado':1, 'Em revisão':2, 'Rascunho':3, 'Substituído':4, 'Arquivado':5 };
  for(const k of Object.keys(porCat)){
    porCat[k].sort((a,b)=>{
      const sa = statusOrder[a.status]??9, sb = statusOrder[b.status]??9;
      if(sa!==sb) return sa-sb;
      return (b.versao||0) - (a.versao||0);
    });
  }
  // Ordena categorias pela ordem oficial de LIST.CATEGORIA_TEXTO_PROP
  const catsOrdenadas = Object.keys(porCat).sort((a,b)=>{
    const ia = LIST.CATEGORIA_TEXTO_PROP.indexOf(a);
    const ib = LIST.CATEGORIA_TEXTO_PROP.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });

  // Indicadores no topo
