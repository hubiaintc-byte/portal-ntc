function openTextoPadraoView(id){
  const t = (STATE.cache.textos_padrao||[]).find(x=>x.id===id);
  if(!t) return;
  const u = byId('usuarios', t.aprovador)||{};
  // Encontrar outras versões do mesmo bloco (mesma categoria + título base)
  // Como o título inclui a versão, vou agrupar por título sem o sufixo "v1/v2/v3"
  const tituloBase = (t.titulo||'').replace(/·\s*v\d+\s*$/i,'').trim();
  const irmas = (STATE.cache.textos_padrao||[]).filter(x=>{
    const tb = (x.titulo||'').replace(/·\s*v\d+\s*$/i,'').trim();
    return tb===tituloBase && x.categoria===t.categoria;
  }).sort((a,b)=>(b.versao||0)-(a.versao||0));
  showModal({
    title: t.titulo,
    crumb: 'TEXTO-PADRÃO · '+t.categoria,
    body:`
      <div style="display:grid;gap:14px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="badge primary">${esc(t.categoria)}</span>
          <span class="badge gray">${esc(t.modalidade)}</span>
          <span class="badge gray">${esc(t.tipo_aplicavel)}</span>
          ${badgeFor(t.status)}
          <span class="badge accent">v${String(t.versao||1).padStart(2,'0')}</span>
        </div>
        <div style="background:#FBF9F2;border:1px solid var(--line);border-radius:8px;padding:18px 22px">
          <h4 style="font-family:var(--serif);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-d);margin-bottom:10px">Texto Completo</h4>
          <pre style="white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.65;color:var(--ink);margin:0">${esc(t.texto||'')}</pre>
        </div>
        ${t.observacoes_uso?`<div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:11px 14px"><strong style="font-size:11px;letter-spacing:1px;color:var(--gold-d);text-transform:uppercase">Observações de uso</strong><div style="font-size:12.5px;margin-top:4px;color:var(--ink-2)">${esc(t.observacoes_uso)}</div></div>`:''}
        <div style="font-size:11.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap">
          <span><strong>ID:</strong> ${esc(t.id)}</span>
          <span><strong>Aprovador:</strong> ${esc(u.nome||'—')}</span>
          <span><strong>Aprovação:</strong> ${fmt.date(t.data_aprovacao)}</span>
          ${t.substituiu?`<span><strong>Substituiu:</strong> ${esc(t.substituiu)}</span>`:''}
        </div>
        ${irmas.length>1?`<div><h4 style="font-family:var(--serif);font-size:14px;color:var(--navy);margin-bottom:6px">Histórico de versões (${irmas.length})</h4><table class="tbl"><thead><tr><th>Versão</th><th>Data</th><th>Status</th><th>Aprovador</th><th></th></tr></thead><tbody>${irmas.map(v=>{const vu=byId('usuarios',v.aprovador)||{};return `<tr><td><strong>v${String(v.versao||1).padStart(2,'0')}</strong></td><td>${fmt.date(v.data_aprovacao)}</td><td>${badgeFor(v.status)}</td><td>${esc(vu.nome||'—')}</td><td><button class="btn btn-sm btn-ghost" data-open-v="${esc(v.id)}">Abrir</button></td></tr>`}).join('')}</tbody></table></div>`:''}
      </div>
    `,
    actions:[
      {label:'Fechar', cls:'btn-ghost', onclick:closeModal},
      ...(podeEscrever('textos_padrao')?[
        {label:'+ Nova Versão', cls:'btn-ghost', onclick:()=>{ closeModal(); novaVersaoTextoPadrao(t.id); }},
        {label:'Editar', cls:'btn-gold', onclick:()=>{ closeModal(); openEntityForm('textos_padrao', t.id); }}
      ]:[])
    ],
    lg: true
  });
  $$('[data-open-v]').forEach(b=> b.onclick = ()=>{ closeModal(); openTextoPadraoView(b.dataset.openV); });
}

async function novaVersaoTextoPadrao(id){
  if(!podeEscrever('textos_padrao')){ toast('Sem permissão para criar versão.','danger'); return; }
  const base = (STATE.cache.textos_padrao||[]).find(x=>x.id===id);
  if(!base) return;
  const motivo = prompt('Motivo da nova versão (alteração de texto, atualização legal, ajuste editorial, etc.):', '');
  if(motivo===null) return;
  // Próxima versão dentro da mesma categoria + título base
  const tituloBase = (base.titulo||'').replace(/·\s*v\d+\s*$/i,'').trim();
  const irmas = (STATE.cache.textos_padrao||[]).filter(x=>{
    const tb = (x.titulo||'').replace(/·\s*v\d+\s*$/i,'').trim();
    return tb===tituloBase && x.categoria===base.categoria;
  });
  const nv = Math.max(...irmas.map(b=>b.versao||1)) + 1;
  const nova = JSON.parse(JSON.stringify(base));
  nova.id = newId('TXP');
  nova.versao = nv;
  nova.status = 'Rascunho';
  nova.data_aprovacao = '';
  nova.substituiu = base.id;
  nova.titulo = tituloBase + ' · v' + nv;
  nova.observacoes_uso = (base.observacoes_uso||'') + (base.observacoes_uso?'\n':'') + '[v'+String(nv).padStart(2,'0')+'] '+motivo;
  await dbPut('textos_padrao', nova);
  // Marcar base como Substituído apenas se ainda estiver Publicado
  if(base.status==='Publicado'){ base.status = 'Substituído'; await dbPut('textos_padrao', base); }
  await refreshCache('textos_padrao');
  toast(`Versão v${String(nv).padStart(2,'0')} criada como Rascunho. Edite o texto e altere o status para Publicado quando aprovada.`,'ok');
  openEntityForm('textos_padrao', nova.id);
}

async function boot(){
  STATE.db = await openDB();
  await seedIfEmpty();
  await seedBibliotecaSeVazia();
  await seedTextosOficiaisNTC();
  await loadAll();
  // Auto-login se sessão ativa
  const uid = sessionStorage.getItem('ntc_current_user');
  const u = uid ? (STATE.cache.usuarios||[]).find(x=>x.id===uid) : null;
  if(u){
    STATE.currentUser = u;
    $('#app').style.display = 'grid';
    renderUserBox();
    render();
  } else {
    showLoginGate();
  }
}
boot().catch(e=>{ console.error(e); document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif"><h2>Erro ao inicializar</h2><pre>${esc(e.message||e)}</pre></div>`; });
