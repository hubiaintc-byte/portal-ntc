/* ---------- ETAPAS DE RECONHECIMENTO ---------- */
function openEtapasDrawer(r) {
  const db = Repo.snapshot();
  const ev = r.eventoId ? db.eventos.find((e) => e.id === r.eventoId) : null;
  const total = Rules.valorReceita(r);
  const etapas = JSON.parse(JSON.stringify(r.etapas || []));
  const body = document.createElement('div'); body.className = 'ov-body';
  const render = () => {
    const somaEt = etapas.reduce((a, e) => a + (e.base === 'percentual' ? Math.round(total * (+e.percentual || 0) / 100) : (+e.valor || 0)), 0);
    const somaCon = etapas.filter((e) => e.concluida).reduce((a, e) => a + (e.base === 'percentual' ? Math.round(total * (+e.percentual || 0) / 100) : (+e.valor || 0)), 0);
    body.innerHTML = `
    <div class="ctx-note" style="margin-bottom:14px">${icon('info', 'sm')}<div>
      O reconhecimento econômico ocorre quando a etapa/módulo é <b>concluída</b> — não quando é contratada nem quando é faturada.
      <b>Os valores por etapa são informados, nunca presumidos iguais.</b> Critério provisório — ${VALIDAR('VALIDAR COM CONTABILIDADE')}.
    </div></div>
    <div class="summary-box" style="margin-bottom:14px">
      <div class="cline"><span class="cl">Receita contratada</span><span class="cv num">${fmtBRL(total)}</span></div>
      <div class="cline"><span class="cl">Soma das etapas</span><span class="cv num ${somaEt !== total ? 'neg' : ''}">${fmtBRL(somaEt, { dash: false })}${somaEt !== total ? ' · diverge do contratado' : ''}</span></div>
      <div class="cline total"><span class="cl">Reconhecido (etapas concluídas)</span><span class="cv num">${fmtBRL(somaCon, { dash: false })}</span></div>
    </div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Etapa / módulo</th><th>Base</th><th class="r">Valor</th><th>Concluída em</th><th></th></tr></thead>
      <tbody>${etapas.length ? etapas.map((e, i) => `<tr>
        <td><input data-e="${i}" data-k="nome" value="${esc(e.nome || '')}" placeholder="Ex.: Módulo 01" style="width:100%"></td>
        <td><select data-e="${i}" data-k="base"><option value="valor" ${e.base !== 'percentual' ? 'selected' : ''}>Valor</option><option value="percentual" ${e.base === 'percentual' ? 'selected' : ''}>%</option></select></td>
        <td class="r">${e.base === 'percentual'
          ? `<input data-e="${i}" data-k="percentual" type="number" min="0" max="100" step="0.01" value="${e.percentual || ''}" style="width:90px;text-align:right"> %<div class="sub num">${fmtBRL(Math.round(total * (+e.percentual || 0) / 100), { dash: false })}</div>`
          : `<input data-e="${i}" data-k="valor" data-money inputmode="decimal" value="${e.valor ? _num.format(reais(e.valor)) : ''}" style="width:120px;text-align:right">`}</td>
        <td><input data-e="${i}" data-k="dataConclusao" type="date" value="${esc(e.dataConclusao || '')}"><div class="sub">${e.concluida ? '<span class="badge b-verde">Concluída</span>' : '<span class="muted">Em aberto</span>'}</div></td>
        <td class="actions"><button class="btn btn-ghost btn-sm" data-toggle="${i}">${e.concluida ? 'Reabrir' : 'Concluir'}</button><button class="btn btn-ghost btn-icon sm" data-del="${i}" aria-label="Remover etapa">${icon('trash')}</button></td>
      </tr>`).join('') : `<tr><td colspan="5" class="muted">Nenhuma etapa registrada. Sem etapas, o reconhecimento segue o critério "${esc(r.criterioReconhecimento || Rules.CRIT_PROVISORIO)}".</td></tr>`}</tbody>
    </table></div>
    <div style="margin-top:12px"><button class="btn btn-secondary btn-sm" data-add>${icon('plus', 'xs')}Adicionar etapa</button></div>`;
  };
  render();
  const ctx = Overlay.open({
    kind: 'drawer', eyebrow: `${r.id} · Reconhecimento`, title: 'Etapas e reconhecimento econômico',
    sub: esc(ev ? ev.nome : r.cliente), body,
    foot: `<span class="spacer"></span><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-save>${icon('check', 'sm')}Salvar etapas</button>`,
  });
  body.addEventListener('input', (e) => {
    const t = e.target; const i = t.dataset.e; if (i == null) return;
    const k = t.dataset.k;
    etapas[i][k] = t.hasAttribute('data-money') ? Math.round(parseNum(t.value) * CENTS) : (k === 'percentual' ? Number(t.value) || 0 : t.value);
  });
  body.addEventListener('change', (e) => { if (e.target.dataset.k === 'base') { etapas[e.target.dataset.e].base = e.target.value; render(); } });
  body.addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]'); const del = e.target.closest('[data-del]'); const tg = e.target.closest('[data-toggle]');
    if (add) { etapas.push({ nome: '', base: 'valor', valor: 0, percentual: 0, concluida: false, dataConclusao: '' }); render(); }
    if (del) { etapas.splice(+del.dataset.del, 1); render(); }
    if (tg) { const i = +tg.dataset.toggle; etapas[i].concluida = !etapas[i].concluida; if (etapas[i].concluida && !etapas[i].dataConclusao) etapas[i].dataConclusao = Rules.todayISO(); render(); }
  });
  ctx.box.querySelector('[data-save]').onclick = async () => {
    const limpa = etapas.filter((e) => (e.nome || '').trim()).map((e) => ({
      nome: e.nome.trim(), base: e.base === 'percentual' ? 'percentual' : 'valor',
      valor: e.base === 'percentual' ? 0 : (+e.valor || 0), percentual: e.base === 'percentual' ? (+e.percentual || 0) : 0,
      concluida: !!e.concluida, dataConclusao: e.concluida ? (e.dataConclusao || Rules.todayISO()) : '',
    }));
    await Repo.update('receitas', r.id, { etapas: limpa, criterioReconhecimento: limpa.length ? 'Por etapa/módulo concluído' : (r.criterioReconhecimento || Rules.CRIT_PROVISORIO) });
    ctx.close();
    toast('Etapas atualizadas', `${limpa.length} etapa(s) · reconhecido ${fmtBRL(Rules.receitaReconhecida({ ...r, etapas: limpa, criterioReconhecimento: 'Por etapa/módulo concluído' }, Repo.snapshot()), { dash: false })}`);
    Router.refresh();
  };
}

/** Faixas de aging por vencimento */
function aging(itens, valorFn) {
  const hoje = Rules.todayISO();
  const d = (iso) => Math.round((new Date(iso + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 86400000);
  const f = { vencido: 0, d30: 0, d60: 0, d90: 0, mais: 0, semData: 0 };
  itens.forEach((x) => {
    const v = valorFn(x); if (!v) return;
    const venc = x.vencimento;
    if (!venc) { f.semData += v; return; }
    const dd = d(venc);
    if (dd < 0) f.vencido += v; else if (dd <= 30) f.d30 += v; else if (dd <= 60) f.d60 += v; else if (dd <= 90) f.d90 += v; else f.mais += v;
  });
  return f;
}
const agingStrip = (f, cor) => `<div class="aging">${[
  ['Vencido', f.vencido, 'neg'], ['Até 30 dias', f.d30, ''], ['31–60 dias', f.d60, ''], ['61–90 dias', f.d90, ''], ['Acima de 90', f.mais, ''],
].map(([l, v, c]) => `<div class="ag-cell"><div class="ag-l">${l}</div><div class="ag-v num ${c}">${fmtBRL(v, { dash: false })}</div><div class="ag-bar ${cor}"><i style="width:${Math.min(100, (v / Math.max(1, f.vencido + f.d30 + f.d60 + f.d90 + f.mais)) * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;

/** Abre o faturamento certo (evento ou corporativo) a partir do ID da parcela */
function abrirFatrec(id, mode) {
  const db = Repo.snapshot();
  const f = db.fatrec.find((x) => x.id === id); if (!f) return;
  const r = db.receitas.find((x) => x.id === f.receitaId);
  if (f.eventoId) {
    const ev = db.eventos.find((e) => e.id === f.eventoId);
    openFatrecDrawer(ev, f, mode ? { mode } : {});
  } else {
    openFatrecDrawer({ id: '', nome: 'Receita corporativa · ' + (r ? r.cliente : '') }, f,
      { mode, receitas: db.receitas.filter((x) => !x.eventoId && Rules.isContratada(x)) });
  }
}
/** Escolha de origem antes de faturar */
function openFaturamentoEscolha() {
  const db = Repo.snapshot();
  const corp = db.receitas.filter((r) => !r.eventoId && Rules.isContratada(r));
  const ctx = Overlay.open({
    size: 'sm', eyebrow: 'Novo faturamento', title: 'Qual é a origem da receita?',
    body: `<div class="ov-body"><div class="choice-grid">
      <button class="choice" data-op="evento">${icon('calendar')}<b>Evento ou projeto</b><span>Faturar uma receita vinculada a um evento da carteira</span></button>
      <button class="choice" data-op="corp" ${corp.length ? '' : 'disabled'}>${icon('home')}<b>Receita corporativa</b><span>${corp.length ? 'Faturar uma receita institucional sem evento' : 'Nenhuma receita corporativa contratada'}</span></button>
    </div></div>`, foot: `<span class="spacer"></span><button class="btn btn-secondary" data-close>Cancelar</button>`,
  });
  ctx.box.querySelector('[data-op="evento"]').onclick = () => { ctx.close(); location.hash = '#/eventos'; toast('Selecione o evento', 'Abra o evento e use a aba Faturamento e recebimentos.'); };

  if (corp.length) bc.onclick = () => { ctx.close(); openFatrecDrawer({ id: '', nome: 'Receita corporativa' }, null, { receitas: corp }); };

  setCrumbs([['Visão Executiva', '#/visao-geral'], ['Pagar', '']]);
  const S = UI.pag;
  const db = Repo.snapshot();
  const sc = Rules.escopo(S);
  const cusIds = new Set(sc.custos.map((c) => c.id));
  let linhas = db.pagamentos.filter((p) => cusIds.has(p.custoId))
    .map((p) => ({ p, x: Rules.pagamentoFin(p), c: db.custos.find((c) => c.id === p.custoId) })).filter((l) => l.c);
  if (S.periodo !== 'all') linhas = linhas.filter((l) => Rules.inPeriod(l.p.vencimento, S.periodo));
  if (S.situacao !== 'all') {
    linhas = linhas.filter(({ x }) => ({ aberto: x.saldo > 0, vencido: x.vencido, parcial: x.status === 'Pago parcialmente', quitado: x.status === 'Pago', retencao: false }[S.situacao]));
  }
  if (S.q) { const q = norm(S.q); linhas = linhas.filter(({ p, c }) => norm([p.id, p.documento, c.descricao, c.fornecedor, c.categoria, p.eventoId].join(' ')).includes(q)); }

  const incorrido = Rules.sum(sc.custos, (c) => c.valorRealizado);
  const orcadoT = Rules.sum(sc.custos, Rules.custoPrevisto);
  const obrig = Rules.sum(linhas, (l) => l.p.valor);
  const pagoT = Rules.sum(linhas, (l) => l.p.valorPago);
  const saldoT = Rules.sum(linhas, (l) => l.x.saldo);
  const semTitulo = Rules.sum(sc.custos, (c) => {
    const prog = Rules.sum(db.pagamentos.filter((p) => p.custoId === c.id), (p) => p.valor);
    return Math.max(0, Rules.n(c.valorRealizado) - prog);
  });
  const ag = aging(linhas.map((l) => ({ vencimento: l.p.vencimento, v: l.x.saldo })), (x) => x.v);
  const porMes = {};
  linhas.forEach(({ p, x }) => { if (x.saldo > 0 && p.vencimento) { const m = p.vencimento.slice(0, 7); porMes[m] = (porMes[m] || 0) + x.saldo; } });
  const meses = Object.keys(porMes).sort();
  const compart = sc.custos.filter((c) => c.compartilhada);

  view.innerHTML = `
  <div class="page-head">
    <div class="ph-text"><div class="eyebrow">Ambiente 04 · Ciclo de pagamento</div><h1 class="page-title">Pagar</h1>
    <div class="page-sub">Obrigações assumidas, baixas parciais e saldo devedor — de eventos e da estrutura corporativa.</div></div>
    <div class="ph-actions"><button class="btn btn-secondary" id="pNovaDesp">${icon('plus', 'sm')}Despesa corporativa</button><button class="btn btn-primary" id="pNovoTit">${icon('receipt', 'sm')}Registrar título</button></div>
  </div>
  ${finFilterBar(S, PAG_KEYS, searchBox('pBusca', 'Buscar título, fornecedor, descrição…', S.q))}

  <div class="ctx-note" style="margin-bottom:16px">${icon('info', 'sm')}<div>
    <b>A obrigação existe antes do pagamento.</b> A despesa é reconhecida pela competência em que foi incorrida; o título registra a obrigação a vencer; o pagamento é a saída de caixa.
    Os três momentos são distintos e nenhum deles é derivado automaticamente do outro.
  </div></div>

  <div class="card kpi-group">
    <div class="kg-title"><div class="kg-name" style="color:var(--vermelho)">Despesa e obrigação</div><div class="kg-desc">${sc.custos.length} lançamento(s) · ${linhas.length} título(s)</div></div>
    <div class="kg-cells">
      ${kpiSm('Despesa incorrida', incorrido, `<span class="muted">${orcadoT ? fmtPct(incorrido / orcadoT, 0) + ' do orçado' : 'competência econômica'}</span>`, '', 'Custo/despesa reconhecido por competência. Não é saída de caixa.')}
      ${kpiSm('Obrigações registradas', obrig, semTitulo > 0 ? `<span class="badge b-dourado">${fmtBRL(semTitulo)} sem título</span>` : '<span class="muted">títulos emitidos</span>', '', 'Soma dos títulos a pagar registrados. Despesa incorrida sem título é obrigação ainda não formalizada.')}
      ${kpiSm('Pago', pagoT, barFoot(obrig ? pagoT / obrig : null, 'das obrigações', 'verde'), '', 'Saída de caixa efetiva.')}
      ${kpiSm('Valor a pagar', saldoT, ag.vencido > 0 ? `<span class="badge b-vermelho">${icon('alert', 'xs')}${fmtBRL(ag.vencido)} vencido</span>` : '<span class="muted">títulos em aberto</span>', 'accent-vermelho', 'Soma dos saldos dos títulos (valor do título − valor pago).')}
    </div>
  </div>

  <div class="section-title"><h2>Composição por vencimento</h2><span class="st-line"></span><span class="st-note">sobre o valor a pagar</span></div>
  <div class="card" style="padding:18px 22px;margin-bottom:16px">${agingStrip(ag, 'vermelho')}</div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div><h3>Obrigações por mês de vencimento</h3><div class="ch-sub">Saldo devedor dos títulos em aberto</div></div></div>
    <div class="card-body"><div class="chart-box short" id="pagChart"></div></div>
  </div>

  <div class="card">
    <div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Títulos a pagar</h3><div class="ch-sub">${linhas.length} título(s) · origem única dos pagamentos</div></div>
    <div class="ch-right"><button class="btn btn-secondary btn-sm" id="pCsv">${icon('download', 'sm')}Exportar CSV</button></div></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Título / despesa</th><th>Origem</th><th>Competência</th><th>Vencimento</th><th class="r">Valor do título</th><th class="r">Pago</th><th class="r">Saldo</th><th>Conta</th><th>Status</th><th></th></tr></thead>
      <tbody>${linhas.length ? linhas.sort((a, b) => (a.p.vencimento || '') < (b.p.vencimento || '') ? -1 : 1).map(({ p, x, c }) => `<tr>
        <td><div class="strong">${esc(p.documento || p.id)}</div><div class="sub">${esc(c.descricao)}${c.fornecedor ? ' · ' + esc(c.fornecedor) : ''}</div></td>
        <td>${origemLabel(p, db)}<div class="sub">${esc(Rules.centroNome(c.centroCusto))}${c.compartilhada ? ' · <b style="color:#7A5E0F">compartilhada</b>' : ''}</div></td>
        <td class="num">${c.competencia ? monthLabel(Rules.custoCompetencia(c) + '-01') : '—'}</td>
        <td class="num ${x.vencido ? 'neg' : ''}">${fmtDate(p.vencimento)}</td>
        <td class="r num">${fmtBRL(p.valor)}</td>
        <td class="r num">${p.valorPago ? `${fmtBRL(p.valorPago)}<div class="sub">${fmtDate(p.dataPagamento)}</div>` : '<span class="muted">—</span>'}</td>
        <td class="r num strong">${fmtBRL(x.saldo)}</td>
        <td class="sub">${p.valorPago ? esc(contaNome(p.contaId)) : '<span class="muted">—</span>'}</td>
        <td>${x.vencido ? badgeFin('Vencida') : badgeFin(x.status)}</td>
        <td class="actions">${x.saldo > 0 ? `<button class="btn btn-ghost btn-sm" data-bx="${p.id}" style="opacity:1">${icon('out', 'xs')}Baixar</button>` : ''}<button class="btn btn-ghost btn-icon sm" data-ped="${p.id}" aria-label="Editar ${p.id}">${icon('edit')}</button></td>
      </tr>`).join('') : `<tr><td colspan="10"><div class="empty" style="padding:26px"><p>Nenhum título neste recorte.</p></div></td></tr>`}</tbody>
      ${linhas.length ? `<tfoot><tr><td colspan="4">Total do recorte</td><td class="r num">${fmtBRL(obrig)}</td><td class="r num">${fmtBRL(pagoT)}</td><td class="r num">${fmtBRL(saldoT)}</td><td colspan="3"></td></tr></tfoot>` : ''}
    </table></div>
  </div>

  ${compart.length ? `<div class="card" style="margin-top:16px">
    <div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Estrutura compartilhada</h3><div class="ch-sub">Identificada separadamente · sem rateio automático</div></div>
    <div class="ch-right muted" style="font-size:12.5px">${compart.length} lançamento(s)</div></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Despesa</th><th>Centro</th><th>Competência</th><th class="r">Previsto</th><th class="r">Incorrido</th></tr></thead>
      <tbody>${compart.sort((a, b) => (a.competencia < b.competencia ? 1 : -1)).slice(0, 12).map((c) => `<tr>
        <td><div class="strong">${esc(c.descricao)}</div><div class="sub">${esc(c.categoria)}</div></td>
        <td>${esc(Rules.centroNome(c.centroCusto))}</td>
        <td class="num">${monthLabel(Rules.custoCompetencia(c) + '-01')}</td>
        <td class="r num">${fmtBRL(Rules.custoPrevisto(c))}</td><td class="r num strong">${fmtBRL(c.valorRealizado)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">Total de estrutura compartilhada (${compart.length} lançamento(s))</td><td class="r num">${fmtBRL(Rules.sum(compart, (c) => c.valorRealizado))}</td></tr></tfoot>
    </table></div>
    <div class="ctx-note gold" style="margin:0 18px 18px">${icon('scale', 'sm')}<div><b>Nenhum rateio é aplicado.</b> Estas despesas sustentam mais de uma área e não são distribuídas entre eventos, programas ou centros, porque não há critério institucional aprovado. Elas aparecem integralmente no resultado corporativo e nunca são somadas ao custo de um evento. Critério de apropriação: ${VALIDAR('A VALIDAR · DIRETORIA')}.</div></div>
  </div>` : ''}`;

  bindFilters(view, S, PAG_KEYS, () => Router.refresh());
  const bs = $('#pBusca'); let tq;
  bs.oninput = () => { clearTimeout(tq); tq = setTimeout(() => { S.q = bs.value; Router.refresh(); }, 220); };
  $('#pNovaDesp').onclick = () => openCustoCorpDrawer();
  $('#pNovoTit').onclick = () => openTituloEscolha();
  $$('[data-bx]', view).forEach((b) => (b.onclick = () => abrirPagamento(b.dataset.bx, 'baixar')));
  $$('[data-ped]', view).forEach((b) => (b.onclick = () => abrirPagamento(b.dataset.ped)));
  $('#pCsv').onclick = () => csvDownload('contas_a_pagar', [
    { l: 'ID', v: (l) => l.p.id }, { l: 'Título', v: (l) => l.p.documento }, { l: 'Despesa', v: (l) => l.c.descricao },
    { l: 'Fornecedor', v: (l) => l.c.fornecedor }, { l: 'Origem', v: (l) => l.p.eventoId || 'CORPORATIVO' },
    { l: 'Centro de custo', v: (l) => l.c.centroCusto }, { l: 'Compartilhada', v: (l) => (l.c.compartilhada ? 'Sim' : 'Não') },
    { l: 'Competência', v: (l) => Rules.custoCompetencia(l.c) }, { l: 'Vencimento', v: (l) => fmtDate(l.p.vencimento) },
    { l: 'Valor do título', v: (l) => l.p.valor, money: true }, { l: 'Pago', v: (l) => l.p.valorPago, money: true },
    { l: 'Saldo', v: (l) => l.x.saldo, money: true }, { l: 'Status', v: (l) => l.x.status },
  ], linhas);
  if (meses.length) Charts.bars($('#pagChart'), { labels: meses.map((m) => monthLabel(m + '-01')), datasets: [{ label: 'A pagar', data: meses.map((m) => porMes[m]), color: C.vermelho }] });
  else $('#pagChart').innerHTML = '<div class="empty" style="padding:26px"><p>Nenhum saldo a pagar no recorte.</p></div>';
};

function abrirPagamento(id, mode) {
  const db = Repo.snapshot();
  const p = db.pagamentos.find((x) => x.id === id); if (!p) return;
  if (p.eventoId) openPagamentoDrawer(db.eventos.find((e) => e.id === p.eventoId), p, mode ? { mode } : {});
  else openPagamentoDrawer({ id: '', nome: 'Despesa corporativa' }, p, { mode, custos: db.custos.filter((c) => !c.eventoId) });
}
function openTituloEscolha() {
  const db = Repo.snapshot();
  const corp = db.custos.filter((c) => !c.eventoId);
  const ctx = Overlay.open({
    size: 'sm', eyebrow: 'Novo título a pagar', title: 'Qual é a origem da despesa?',
    body: `<div class="ov-body"><div class="choice-grid">
      <button class="choice" data-op="evento">${icon('calendar')}<b>Evento ou projeto</b><span>Programar pagamento de um custo da carteira</span></button>
      <button class="choice" data-op="corp" ${corp.length ? '' : 'disabled'}>${icon('home')}<b>Despesa corporativa</b><span>${corp.length ? 'Programar pagamento de despesa sem evento' : 'Nenhuma despesa corporativa registrada'}</span></button>
    </div></div>`, foot: `<span class="spacer"></span><button class="btn btn-secondary" data-close>Cancelar</button>`,
  });
  ctx.box.querySelector('[data-op="evento"]').onclick = () => { ctx.close(); location.hash = '#/eventos'; toast('Selecione o evento', 'Abra o evento e use a aba Pagamentos.'); };
  const bc = ctx.box.querySelector('[data-op="corp"]');
  if (corp.length) bc.onclick = () => { ctx.close(); openPagamentoDrawer({ id: '', nome: 'Despesa corporativa' }, null, { custos: corp }); };
}

/* =====================================================================
   v0.2 · AMBIENTE 05 · CAIXA
   Contas financeiras, saldos, extrato unificado e projeção 30/60/90.
   Transferência interna não gera receita nem despesa.
   Faturar não altera o caixa; incorrer despesa não altera o caixa.
   ===================================================================== */
const CAIXA_KEYS = ['conta', 'periodo', 'tipoMov'];

Views.caixa = async function (view) {
  setCrumbs([['Visão Executiva', '#/visao-geral'], ['Caixa', '']]);
  const S = UI.caixa;
  const db = Repo.snapshot();
  const contas = Rules.saldosPorConta(db);
  const saldoTotal = Rules.saldoGeral(db);
  const iniTotal = Rules.sum(db.contas, (c) => c.saldoInicial);

  let ext = Rules.extrato(db);
  if (S.conta !== 'all') ext = ext.filter((m) => m.contaId === S.conta);
  if (S.periodo !== 'all') ext = ext.filter((m) => Rules.inPeriod(m.data, S.periodo));
  if (S.tipoMov !== 'all') ext = ext.filter((m) => (S.tipoMov === 'avulso' ? m.origem === 'movimento' && !m.transferencia : m.tipo === S.tipoMov));
  if (S.q) { const q = norm(S.q); ext = ext.filter((m) => norm([m.id, m.descricao, m.tipo, m.eventoId].join(' ')).includes(q)); }

  const entradas = Rules.sum(ext.filter((m) => m.valor > 0 && !m.transferencia), (m) => m.valor);
  const saidas = -Rules.sum(ext.filter((m) => m.valor < 0 && !m.transferencia), (m) => m.valor);
  const transf = ext.filter((m) => m.transferencia);
  const efeitoTransf = Rules.sum(transf, (m) => m.valor);
  const naoClass = db.movimentos.filter((m) => m.classificado === false);

  // saldo inicial do recorte = saldo inicial das contas + movimentações anteriores ao período
  const inicioPeriodo = (pid) => {
    if (!pid || pid === 'all') return '0000-01-01';
    const [y, q] = pid.split('-');
    return q ? `${y}-${String((+q.slice(1) - 1) * 3 + 1).padStart(2, '0')}-01` : `${y}-01-01`;
  };
  const ini0 = inicioPeriodo(S.periodo);
  const base = S.conta === 'all' ? iniTotal : Rules.n((db.contas.find((c) => c.id === S.conta) || {}).saldoInicial);
  const saldoIni = base + Rules.sum(Rules.extrato(db).filter((m) => (S.conta === 'all' || m.contaId === S.conta) && m.data < ini0), (m) => m.valor);

  // série mensal de saldo acumulado
  const serie = {};
  Rules.extrato(db).forEach((m) => { const k = m.data.slice(0, 7); serie[k] = (serie[k] || 0) + m.valor; });
  const mesesS = Object.keys(serie).sort();
  let acc = iniTotal;
  const saldoSerie = mesesS.map((m) => (acc += serie[m]));

  const proj = [30, 60, 90].map((d) => Rules.projecaoCaixa(db, d));

  view.innerHTML = `
  <div class="page-head">
    <div class="ph-text"><div class="eyebrow">Ambiente 05 · Disponibilidade financeira</div><h1 class="page-title">Caixa</h1>
    <div class="page-sub">Contas, saldos, extrato unificado e projeção de disponibilidade. Lucro não é caixa.</div></div>
    <div class="ph-actions"><button class="btn btn-secondary" id="cNovaConta">${icon('plus', 'sm')}Nova conta</button><button class="btn btn-primary" id="cTransf">${icon('flow', 'sm')}Transferência / avulso</button></div>
  </div>

  <div class="section-title"><h2>Contas financeiras</h2><span class="st-line"></span><span class="st-note">saldo = saldo inicial + movimentações</span></div>
  <div class="acc-grid" style="margin-bottom:16px">
    ${contas.map((a) => `<div class="acc ${a.conta.ativa === false ? 'off' : ''}">
      <div class="acc-h">${icon('wallet', 'sm')}<b>${esc(a.conta.nome)}</b></div>
      <div class="acc-v ${a.saldo < 0 ? 'neg' : ''}">${fmtBRL(a.saldo, { dash: false })}</div>
      <div class="acc-l"><span>Saldo inicial</span><span class="num">${fmtBRL(a.conta.saldoInicial, { dash: false })}</span></div>
      <div class="acc-l"><span>Entradas</span><span class="num">${fmtBRL(a.entradas, { dash: false })}</span></div>
      <div class="acc-l"><span>Saídas</span><span class="num">${fmtBRL(-a.saidas, { dash: false })}</span></div>
      <div class="acc-l" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--hairline)"><span>${esc(a.conta.tipo)}${a.conta.banco ? ' · ' + esc(a.conta.banco) : ''}</span><button class="btn btn-ghost btn-sm" data-conta="${a.conta.id}">Editar</button></div>
    </div>`).join('')}
    <div class="acc" style="background:var(--azul-50);border-color:var(--azul)">
      <div class="acc-h">${icon('scale', 'sm')}<b>Saldo consolidado</b></div>
      <div class="acc-v ${saldoTotal < 0 ? 'neg' : ''}">${fmtBRL(saldoTotal, { dash: false })}</div>
      <div class="acc-l"><span>Saldo inicial consolidado</span><span class="num">${fmtBRL(iniTotal, { dash: false })}</span></div>
      <div class="acc-l"><span>Movimentação acumulada</span><span class="num">${fmtBRL(saldoTotal - iniTotal, { dash: false })}</span></div>
      <div class="acc-l"><span>Contas ativas</span><span class="num">${fmtNum(db.contas.filter((c) => c.ativa !== false).length)}</span></div>
    </div>
  </div>

  <div class="section-title"><h2>Projeção de disponibilidade</h2><span class="st-line"></span><span class="st-note">saldo atual + exigível a vencer − obrigações a vencer</span></div>
  <div class="card kpi-group" style="margin-bottom:16px">
    <div class="kg-title"><div class="kg-name" style="color:var(--azul)">Projeção</div><div class="kg-desc">Projeção aritmética sobre vencimentos futuros registrados.<br>Vencidos ficam de fora: ${fmtBRL(proj[0].entraVencido, { dash: false })} a receber e ${fmtBRL(proj[0].saiVencido, { dash: false })} a pagar.<br>Não considera atrasos históricos nem sazonalidade.</div></div>
    <div class="kg-cells">
      ${kpiSm('Saldo atual', saldoTotal, `<span class="muted">todas as contas</span>`, '', 'Soma dos saldos de todas as contas financeiras.')}
      ${proj.map((p) => kpiSm(`Projeção ${p.dias} dias`, p.projetado, `<span class="muted">+${fmtBRL(p.entra, { dash: false })} a receber / −${fmtBRL(p.sai, { dash: false })} a pagar</span>`, p.projetado < 0 ? 'accent-vermelho' : '', `Até ${fmtDate(p.limite)}. Considera apenas vencimentos futuros dentro da janela. Valores já vencidos (${fmtBRL(p.entraVencido, { dash: false })} a receber e ${fmtBRL(p.saiVencido, { dash: false })} a pagar) ficam de fora porque não têm data prevista de realização.`)).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div><h3>Evolução do saldo consolidado</h3><div class="ch-sub">Saldo acumulado ao fim de cada mês · todas as contas</div></div></div>
    <div class="card-body"><div class="chart-box short" id="caixaChart"></div></div>
  </div>

  ${naoClass.length ? `<div class="ctx-note gold" style="margin-bottom:16px">${icon('alert', 'sm')}<div><b>${naoClass.length} movimentação(ões) de caixa sem classificação econômica.</b> São entradas ou saídas confirmadas no extrato que ainda não foram associadas a uma receita ou despesa. Elas afetam o saldo, mas <b>não</b> o resultado econômico, até serem identificadas.</div></div>` : ''}

  ${finFilterBar(S, CAIXA_KEYS, searchBox('cBusca', 'Buscar no extrato…', S.q))}

  <div class="card">
    <div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Extrato unificado</h3>
      <div class="ch-sub">Recebimentos, pagamentos, transferências e avulsos — cada movimentação registrada uma única vez</div></div>
      <div class="ch-right"><button class="btn btn-secondary btn-sm" id="cCsv">${icon('download', 'sm')}Exportar CSV</button></div></div>
    <div class="card-body" style="padding-top:0">
      <div class="summary-box" style="margin-bottom:0">
        <div class="cline"><span class="cl">Saldo inicial do recorte</span><span class="cv num">${fmtBRL(saldoIni, { dash: false })}</span></div>
        <div class="cline"><span class="cl">Entradas</span><span class="cv num">${fmtBRL(entradas, { dash: false })}</span></div>
        <div class="cline"><span class="cl">Saídas</span><span class="cv num">${fmtBRL(-saidas, { dash: false })}</span></div>
        <div class="cline"><span class="cl">Transferências internas <span class="muted">(efeito líquido)</span></span><span class="cv num">${fmtBRL(efeitoTransf, { dash: false })}</span></div>
        <div class="cline"><span class="cl"><b>Movimentação líquida</b></span><span class="cv num ${entradas - saidas < 0 ? 'neg' : ''}"><b>${fmtBRL(entradas - saidas, { dash: false })}</b></span></div>
        <div class="cline total"><span class="cl">Saldo final do recorte</span><span class="cv num">${fmtBRL(saldoIni + entradas - saidas, { dash: false })}</span></div>
      </div>
    </div>
    <div class="table-wrap"><table class="t">

};

/* =====================================================================
   v0.2 · AMBIENTE 06 · RESULTADO E ORÇAMENTO

     1) Projetado (compromissos)  2) Econômico por competência  3) Caixa

const RES_TABS = [

const RES_KEYS = ['periodo', 'escopo', 'centro'];

Views.resultado = async function (view, tab) {
  if (!RES_TABS.some((t) => t[0] === tab)) tab = 'perspectivas';

/* ---------------- 1 · Três perspectivas ---------------- */

  const provis = [];
  db.receitas.forEach((r) => Rules.reconhecimentoReceita(r, db).forEach((x) => { if (x.provisorio) provis.push(x); }));

/* ---------------- 2 · Competência mensal ---------------- */
function resCompetencia(el, S) {
  const c = Rules.consolidado(S);
  const db = Repo.snapshot();
  const meses = Rules.MES_SERIE(S.exercicio).filter((m) => S.periodo === 'all' || Rules.inPeriod(m + '-01', S.periodo));
  const ext = c.extrato;
  const caixaMes = {};
  ext.forEach((m) => { if (!m.transferencia) { const k = m.data.slice(0, 7); caixaMes[k] = (caixaMes[k] || 0) + m.valor; } });
  const rec = meses.map((m) => c.recMes[m] || 0);
  const inc = meses.map((m) => c.cusMes[m] || 0);
  const eco = meses.map((_, i) => rec[i] - inc[i]);
  const cx = meses.map((m) => caixaMes[m] || 0);
  const fech = (m) => { const f = Rules.fechamentoDe(db, m); return f ? f.status : 'Aberto'; };

  el.innerHTML = `
  <div class="filterbar">
    <span class="fb-label">${icon('filter', 'xs')} Recorte</span>
    <div class="fsel"><span class="fcap">Exercício</span><select data-ex2><option value="2026" ${S.exercicio === '2026' ? 'selected' : ''}>2026</option><option value="2027" ${S.exercicio === '2027' ? 'selected' : ''}>2027</option></select></div>
    ${filterSelects(S, RES_KEYS)}
    ${anyFilter(S, RES_KEYS) ? `<button class="btn btn-ghost btn-sm" data-clear-filters>${icon('x', 'xs')}Limpar</button>` : ''}

  <div class="card" style="margin-bottom:16px">

    <div class="ch-right">${legend([['Receita reconhecida', C.azul], ['Despesa incorrida', C.vermelho2], ['Movimentação de caixa', C.verde, true]])}</div></div>
    <div class="card-body"><div class="chart-box" id="compChart" style="height:280px"></div></div>
  </div>
  <div class="card">
    <div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Apuração mensal</h3><div class="ch-sub">Resultado econômico ≠ movimentação de caixa</div></div>
    <div class="ch-right"><button class="btn btn-secondary btn-sm" id="mCsv">${icon('download', 'sm')}Exportar CSV</button></div></div>
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Competência</th><th class="r">Receita reconhecida</th><th class="r">Despesa incorrida</th><th class="r">Resultado econômico</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Movimentação líquida</th><th>Fechamento</th></tr></thead>
      <tbody>${meses.map((m, i) => {
        const ent = Rules.sum(ext.filter((x) => !x.transferencia && x.valor > 0 && x.data.slice(0, 7) === m), (x) => x.valor);
        const sai = -Rules.sum(ext.filter((x) => !x.transferencia && x.valor < 0 && x.data.slice(0, 7) === m), (x) => x.valor);
        return `<tr><td class="strong">${monthLabel(m + '-01')}</td>
        <td class="r num">${fmtBRL(rec[i], { dash: false })}</td><td class="r num">${fmtBRL(inc[i], { dash: false })}</td>
        <td class="r num strong ${eco[i] < 0 ? 'neg' : eco[i] > 0 ? 'pos' : ''}">${fmtBRL(eco[i], { dash: false })}</td>
        <td class="r num">${fmtBRL(ent, { dash: false })}</td><td class="r num">${fmtBRL(-sai, { dash: false })}</td>
        <td class="r num strong ${cx[i] < 0 ? 'neg' : ''}">${fmtBRL(cx[i], { dash: false })}</td>
        <td><span class="badge ${bfech[fech(m)]}">${fech(m)}</span></td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td>Total do recorte</td><td class="r num">${fmtBRL(rec.reduce((a, b) => a + b, 0), { dash: false })}</td>
        <td class="r num">${fmtBRL(inc.reduce((a, b) => a + b, 0), { dash: false })}</td>
        <td class="r num">${fmtBRL(eco.reduce((a, b) => a + b, 0), { dash: false })}</td><td></td><td></td>
        <td class="r num">${fmtBRL(cx.reduce((a, b) => a + b, 0), { dash: false })}</td><td></td></tr></tfoot>
    </table></div>
  </div>`;
  bindFilters(el, S, RES_KEYS, () => Router.refresh());

  $('#mCsv').onclick = () => csvDownload('apuracao_mensal', [
    { l: 'Competência', v: (r) => r.m }, { l: 'Receita reconhecida', v: (r) => r.rec, money: true },

  });
}

/* ---------------- 3 · Consolidação por programa ---------------- */
function resConsolidacao(el, S) {
  const db = Repo.snapshot();
  const P = Rules.portfolio({ periodo: S.periodo });
  const grupos = {};
  P.rows.forEach(({ ev, m }) => {
    const k = ev.programa || '(sem programa)';
    grupos[k] = grupos[k] || { prog: k, verticais: new Set(), itens: [], contratada: 0, reconhecida: 0, incorrido: 0, faturada: 0, recebida: 0, orcado: 0, realizado: 0 };
    const g = grupos[k];
    g.verticais.add(ev.vertical);
    const reconh = Rules.sum(db.receitas.filter((r) => r.eventoId === ev.id), (r) => Rules.receitaReconhecida(r, db));
    const inc = Rules.sum(db.custos.filter((c) => c.eventoId === ev.id), (c) => c.valorRealizado);
    g.itens.push({ ev, m, reconh, inc });
    g.contratada += m.contratada; g.faturada += m.faturada; g.recebida += m.recebida;

/* ---------------- 4 · Orçamento ---------------- */
function resOrcamento(el, S) {

  let linhas = Rules.orcamentoLinhas(db, { exercicio: S.exercicio, mes: S.mes, centro: S.centro, tipo: S.tipoOrc });
  const orc = Rules.sum(linhas, (l) => l.valorOrcado);
  const real = Rules.sum(linhas, (l) => l.realizado);
  const desv = real - orc;
  const desp = linhas.filter((l) => l.tipo === 'Despesa');
  const receita = linhas.filter((l) => l.tipo === 'Receita');
  const execBar = (l) => {
    const p = l.execucao == null ? 0 : Math.min(140, l.execucao * 100);

      ${kpiSm('Realizado', real, barFoot(orc ? real / orc : null, 'de execução'))}
      ${kpiSm('Desvio', desv, `<span class="${desv > 0 ? 'neg' : 'pos'}">${desv > 0 ? 'acima' : desv < 0 ? 'abaixo' : 'em linha com'} do orçado</span>`, desv > 0 ? 'accent-vermelho' : '')}

        <td class="r num">${fmtBRL(l.valorOrcado, { dash: false })}</td>

      ${linhas.length ? `<tfoot><tr><td colspan="5">Total do recorte</td><td class="r num">${fmtBRL(orc, { dash: false })}</td><td class="r num">${fmtBRL(real, { dash: false })}</td><td class="r num">${fmtBRL(desv, { dash: false })}</td><td colspan="2"></td></tr></tfoot>` : ''}
    </table></div>
  </div>`;
  bindFilters(el, S, keys, () => Router.refresh());
  $('[data-ex]', el).onchange = (e) => { S.exercicio = e.target.value; Router.refresh(); };

  $$('[data-orc]', el).forEach((b) => (b.onclick = () => openOrcamentoDrawer(db.orcamentos.find((o) => o.id === b.dataset.orc))));
  $('#oCsv').onclick = () => csvDownload('orcamento', [
    { l: 'Exercício', v: (l) => l.exercicio }, { l: 'Mês', v: (l) => l.mes }, { l: 'Centro de custo', v: (l) => l.centroCusto },
    { l: 'Categoria', v: (l) => l.categoria }, { l: 'Projeto', v: (l) => l.eventoId || '' }, { l: 'Natureza', v: (l) => l.tipo },
    { l: 'Orçado', v: (l) => l.valorOrcado, money: true }, { l: 'Realizado', v: (l) => l.realizado, money: true },
    { l: 'Desvio', v: (l) => l.desvio, money: true }, { l: '% execução', v: (l) => (l.execucao == null ? '' : fmtPct(l.execucao, 1)) },
  ], linhas);
  if (mesesO.length) Charts.bars($('#orcChart'), {
    labels: mesesO.map((m) => monthLabel(m + '-01')),
    datasets: [{ label: 'Orçado', data: mesesO.map((m) => porMes[m].o), color: C.azul3 }, { label: 'Realizado', data: mesesO.map((m) => porMes[m].r), color: C.azul }],
  });
}

/* =====================================================================
   v0.2.1 · COMISSÕES COMERCIAIS
   Ambiente próprio + aba na área de trabalho do evento.
   A comissão é UM lançamento de custo do evento: as telas de Custos,
   Comissões, Contas a Pagar e Resultado mostram o MESMO registro.
   Por isso não há como somá-la duas vezes.
   ===================================================================== */
const COM_KEYS = ['periodo', 'vertical', 'situacaoCom'];

const comStatusBadge = (st) => {
  const map = { 'Prevista': ['b-outline', 'clock'], 'Devida': ['b-dourado', 'alert'], 'Paga parcialmente': ['b-azul', 'half'], 'Paga': ['b-verde', 'check'] };
  const [c, i] = map[st] || ['b-neutral', 'dot'];
  return `<span class="badge ${c}">${icon(i, 'xs')}${esc(st)}</span>`;
};
const baseResumo = (c) => (c.modalidadeComissao === 'Percentual'
  ? `${fmtPct((Number(c.percentual) || 0) / 100, 2)} sobre ${esc(String(c.baseComissao || '').toLowerCase())} de ${fmtBRL(c.baseValor)}`
  : 'valor fixo negociado');

/* ---------------- Formulário ---------------- */
function openComissaoDrawer(ev, c) {
  const db = Repo.snapshot();
  const evs = db.eventos;
  const v = c ? { ...c } : {
    eventoId: ev ? ev.id : '', vendedor: '', referenciaComercial: '', subcategoria: 'Comissão de venda',
    modalidadeComissao: 'Valor fixo', baseComissao: 'Valor informado', baseValor: 0, percentual: 0,
    valorUnitPrev: 0, ajuste: 0, ajusteMotivo: '', condicaoAquisicao: '', devida: false,
    competencia: Rules.todayISO(), dataPrevista: '', fase: 'Pré-evento', centroCusto: 'COM', observacao: '',
  };
  const evDe = (x) => evs.find((e) => e.id === x.eventoId);
  const isPct = (x) => x.modalidadeComissao === 'Percentual';
  const baseDe = (x) => (!isPct(x) ? 0
    : (x.baseComissao === 'Valor informado' || !x.baseComissao ? (+x.baseValor || 0) : Rules.baseComissao(x.baseComissao, evDe(x), db, x.baseValor)));
  const previstoDe = (x) => (isPct(x) ? Math.round((baseDe(x) * (+x.percentual || 0)) / 100) : (+x.valorUnitPrev || 0));
  const apuradoDe = (x) => previstoDe(x) + (+x.ajuste || 0);
  const isDevida = (x) => x.devida === true || x.devida === 'true';

  const schema = [
    { note: () => 'A comissão é registrada em <b>valor</b>, por vendedor e por evento. Ela é lançada como um custo do evento e aparece em Custos, em Contas a Pagar e no resultado — sempre o mesmo registro, somado uma única vez.' },
    { key: 'eventoId', label: 'Evento', type: 'select', required: true, show: () => !ev,
      options: evs.map((e) => ({ value: e.id, label: `${e.id} · ${e.nome}` })) },
    { key: 'vendedor', label: 'Vendedor ou beneficiário', type: 'datalist', required: true, options: PARAMS.vendedores, placeholder: 'Nome do vendedor, parceiro ou equipe' },

    { group: 'Valor da comissão' },
    { key: 'valorUnitPrev', label: 'Valor da comissão (R$)', type: 'money', span: 3, required: (x) => !isPct(x), show: (x) => !isPct(x),
      tip: 'Valor acordado com o vendedor. Não depende dos custos do evento nem do valor recebido do cliente.' },
    { key: 'modalidadeComissao', label: 'Forma de cálculo', type: 'chips', span: 3, required: true, options: PARAMS.modalidadesComissao,
      tip: 'O padrão é informar o valor diretamente. O cálculo por percentual é uma alternativa opcional.' },
    { key: 'baseComissao', label: 'Base de cálculo', type: 'select', span: 3, required: isPct, show: isPct, options: PARAMS.basesComissao,
      tip: 'Nenhuma base é escolhida automaticamente. Use "Valor informado" para digitar a base, ou selecione uma receita do evento.' },
    { key: 'baseValor', label: 'Valor da base (R$)', type: 'money', span: 3, required: (x) => isPct(x) && (x.baseComissao === 'Valor informado' || !x.baseComissao),
      show: (x) => isPct(x) && (x.baseComissao === 'Valor informado' || !x.baseComissao) },
    { key: 'baseCalc', label: 'Base apurada no evento', type: 'computed', span: 3,
      show: (x) => isPct(x) && x.baseComissao && x.baseComissao !== 'Valor informado',
      compute: (x) => `<span class="num">${fmtBRL(baseDe(x), { dash: false })}</span>` },
    { key: 'percentual', label: 'Percentual (%)', type: 'number', span: 3, step: 0.01, min: 0, required: isPct, show: isPct,
      tip: 'Não há percentual padrão. O valor é sempre o que foi negociado nesta operação.' },
    { key: 'prevCalc', label: 'Valor registrado', type: 'computed', span: 3, show: isPct,
      compute: (x) => `<b class="num">${fmtBRL(previstoDe(x), { dash: false })}</b>` },

    { group: 'Datas e situação' },
    { key: 'competencia', label: 'Data de referência', type: 'date', span: 3, required: true,
      tip: 'Mês a que a comissão pertence no resultado do evento.' },
    { key: 'dataPrevista', label: 'Pagamento previsto para', type: 'date', span: 3, optional: true },
    { key: 'devida', label: 'Situação', type: 'chips', span: 6, options: [
      { value: false, label: 'Prevista' }, { value: true, label: 'Devida' }],
      tip: 'Prevista: valor registrado, ainda sem obrigação de pagamento. Devida: passa a integrar o custo do evento e as contas a pagar.' },
    { note: (x) => (isDevida(x)
      ? `<b>Devida.</b> ${fmtBRL(apuradoDe(x), { dash: false })} integram o custo do evento e podem ser programados em contas a pagar. O reconhecimento é decisão do responsável e não depende do recebimento da receita do evento.`
      : '<b>Prevista.</b> O valor aparece no resultado previsto do evento, mas não entra no custo realizado nem nas contas a pagar. O responsável decide quando reconhecê-la como devida.'),
      kind: 'gold', icon: 'scale' },
    { key: 'dataAquisicao', label: 'Data do reconhecimento', type: 'date', span: 3, show: isDevida, optional: true },

    { key: 'observacao', label: 'Observações', type: 'textarea', optional: true },

    { details: 'Mais opções', hint: 'referência comercial · ajuste · condição acordada', open: !!(c && (Number(c.ajuste) || c.condicaoAquisicao)), items: [
      { key: 'referenciaComercial', label: 'Referência comercial', span: 3, optional: true, placeholder: 'Contrato, proposta ou origem da venda' },
      { key: 'subcategoria', label: 'Tipo', type: 'select', span: 3, options: ['Comissão de venda', 'Comissão de intermediação', 'Bonificação comercial'] },
      { key: 'condicaoAquisicao', label: 'Condição acordada para o direito', type: 'select', span: 6, optional: true, options: PARAMS.condicoesAquisicao,
        tip: 'Registro do que foi acordado, quando houver. O sistema não impõe condição alguma e nunca reconhece o direito sozinho.' },
      { key: 'ajuste', label: 'Ajuste (+ ou −)', type: 'money', span: 3, optional: true },
      { key: 'apurCalc', label: 'Valor final', type: 'computed', span: 3, compute: (x) => `<b class="num">${fmtBRL(apuradoDe(x), { dash: false })}</b>` },
      { key: 'ajusteMotivo', label: 'Justificativa do ajuste', type: 'textarea', required: (x) => (+x.ajuste || 0) !== 0 },
    ] },
  ];

  openFormDrawer({
    eyebrow: `Comissões${c ? ' · ' + c.id : ''}`,
    title: c ? 'Editar comissão' : 'Nova comissão comercial',
    sub: ev ? esc(ev.nome) : 'Vinculada a um evento',
    schema, values: v, submitLabel: c ? 'Salvar alterações' : 'Registrar comissão',
    save: (x) => { const d = { ...x }; ['baseCalc', 'prevCalc', 'apurCalc'].forEach((k) => delete d[k]); return Service.saveComissao(d, c && c.id); },
    okTitle: c ? 'Comissão atualizada' : 'Comissão registrada',
    okDesc: (sv) => `${sv.vendedor} · ${fmtBRL(sv.devida ? sv.valorRealizado : sv.valorUnitPrev)} ${sv.devida ? 'devida' : 'prevista'}`,
  });
}

/* ---------------- Ações da linha ---------------- */
function comissaoMenu(btn, c) {
  const db = Repo.snapshot();
  const ev = db.eventos.find((e) => e.id === c.eventoId);
  const x = Rules.comissaoFin(c, db);
  const itens = [
    { label: 'Editar comissão', icon: 'edit', action: () => openComissaoDrawer(ev, c) },
  ];
  if (!c.devida) itens.push({ label: 'Reconhecer como devida', icon: 'check', action: async () => {
    try { await Service.saveComissao({ ...c, devida: true }, c.id); toast('Comissão reconhecida', `${c.vendedor} · ${fmtBRL(x.apurado)} passam a integrar o custo do evento.`); Router.refresh(); }
    catch (e) { toast('Não foi possível reconhecer', e.message, 'err'); }
  } });
  if (c.devida) itens.push({ label: x.programado > 0 ? 'Registrar pagamento' : 'Programar pagamento', icon: 'out',
    action: () => openPagamentoDrawer(ev, x.titulos.find((p) => Rules.pagamentoFin(p).saldo > 0) || null,
      x.titulos.some((p) => Rules.pagamentoFin(p).saldo > 0) ? { mode: 'baixar' } : { custoId: c.id }) });
  itens.push('-');
  itens.push({ label: 'Excluir comissão', icon: 'trash', danger: true, action: async () => {
    if (!(await confirmDialog({ title: 'Excluir comissão?', message: `A comissão de <b>${esc(c.vendedor)}</b> (${fmtBRL(x.apurado)}) será removida do custo do evento e dos consolidados.`, confirmLabel: 'Excluir', danger: true }))) return;
    try { await Service.deleteComissao(c.id); toast('Comissão excluída', `${c.vendedor}`); Router.refresh(); }
    catch (e) { toast('Não foi possível excluir', e.message, 'err'); }
  } });
  openMenu(btn, itens);
}

/* ---------------- Tabela reutilizável ---------------- */
function comissoesTable(linhas, { showEvento = true } = {}) {
  const db = Repo.snapshot();
  if (!linhas.length) return `<div class="empty" style="padding:30px"><div class="e-icon">${icon('coins')}</div><h4>Nenhuma comissão registrada</h4><p>Nem toda venda gera comissão. Registre apenas quando houver acordo comercial.</p></div>`;
  const T = (f) => Rules.sum(linhas, (l) => l.x[f]);
  return `<div class="table-wrap"><table class="t">
    <thead><tr>${showEvento ? '<th>Evento</th>' : ''}<th>Vendedor</th><th>Cálculo</th><th>Competência</th><th class="r">Previsto</th><th class="r">Devido</th><th class="r">Pago</th><th class="r">A pagar</th><th>Situação</th><th></th></tr></thead>
    <tbody>${linhas.map(({ c, x, ev }) => `<tr>
      ${showEvento ? `<td><a href="#/eventos/${c.eventoId}/comissoes" class="lnk">${esc(c.eventoId)}</a><div class="sub">${esc(ev ? ev.nome : '')}</div></td>` : ''}
      <td><div class="strong">${esc(c.vendedor)}</div><div class="sub">${esc(c.referenciaComercial || c.subcategoria)}</div></td>
      <td><div>${c.modalidadeComissao === 'Percentual' ? `<span class="num">${fmtPct((Number(c.percentual) || 0) / 100, 2)}</span>` : 'Valor fixo'}</div><div class="sub">${c.modalidadeComissao === 'Percentual' ? `sobre ${esc(String(c.baseComissao).toLowerCase())} de ${fmtBRL(c.baseValor)}` : 'negociado por operação'}</div>${Number(c.ajuste) ? `<div class="sub" style="color:#7A5E0F">ajuste ${fmtBRL(c.ajuste, { dash: false })}</div>` : ''}</td>
      <td class="num">${monthLabel(Rules.custoCompetencia(c) + '-01')}${c.dataPrevista ? `<div class="sub">pagar até ${fmtDate(c.dataPrevista)}</div>` : ''}</td>
      <td class="r num">${fmtBRL(x.previsto)}</td>
      <td class="r num strong">${c.devida ? fmtBRL(x.devido) : '<span class="muted">—</span>'}</td>
      <td class="r num">${fmtBRL(x.pago)}</td>
      <td class="r num strong ${x.vencido ? 'neg' : ''}">${fmtBRL(x.saldo)}${x.vencido ? '<div class="sub neg">vencida</div>' : ''}</td>
      <td>${comStatusBadge(x.status)}<div class="sub">${c.devida && c.dataAquisicao ? 'reconhecida em ' + fmtDate(c.dataAquisicao) : esc(c.condicaoAquisicao || '')}</div></td>
      <td class="actions"><button class="btn btn-ghost btn-icon sm" data-com="${c.id}" aria-label="Ações da comissão de ${esc(c.vendedor)}">${icon('more')}</button></td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="${showEvento ? 4 : 3}">Total (${linhas.length} comissão(ões))</td>
      <td class="r num">${fmtBRL(T('previsto'))}</td><td class="r num">${fmtBRL(T('devido'))}</td>
      <td class="r num">${fmtBRL(T('pago'))}</td><td class="r num">${fmtBRL(T('saldo'))}</td><td colspan="2"></td></tr></tfoot>
  </table></div>`;
}
function bindComissoes(root) {
  const db = Repo.snapshot();
  $$('[data-com]', root).forEach((b) => (b.onclick = () => {
    const c = db.custos.find((x) => x.id === b.dataset.com);
    if (c) comissaoMenu(b, c);
  }));
}

/* ---------------- Ambiente: Comissões ---------------- */
Views.comissoes = async function (view) {
  setCrumbs([['Visão Executiva', '#/visao-geral'], ['Comissões', '']]);
  const S = UI.com;
  const db = Repo.snapshot();
  let linhas = Rules.comissoesDe(db).map((c) => ({ c, x: Rules.comissaoFin(c, db), ev: db.eventos.find((e) => e.id === c.eventoId) }))
    .filter((l) => l.ev);
  if (S.vertical !== 'all') linhas = linhas.filter((l) => l.ev.vertical === S.vertical);
  if (S.periodo !== 'all') linhas = linhas.filter((l) => Rules.inPeriod(l.c.competencia, S.periodo));
  if (S.situacaoCom !== 'all') linhas = linhas.filter((l) => ({
    prevista: !l.c.devida, devida: l.c.devida && l.x.pago === 0, parcial: l.x.status === 'Paga parcialmente',
    paga: l.x.status === 'Paga', vencida: l.x.vencido,
  }[S.situacaoCom]));
  if (S.q) { const q = norm(S.q); linhas = linhas.filter(({ c, ev }) => norm([c.id, c.vendedor, c.referenciaComercial, c.eventoId, ev.nome].join(' ')).includes(q)); }
  linhas.sort((a, b) => (a.c.competencia < b.c.competencia ? 1 : -1));

  const T = (f) => Rules.sum(linhas, (l) => l.x[f]);
  const previsto = T('previsto'), devido = T('devido'), pago = T('pago'), saldo = T('saldo');
  const naoDevida = Rules.sum(linhas.filter((l) => !l.c.devida), (l) => l.x.previsto);
  const vencido = Rules.sum(linhas.filter((l) => l.x.vencido), (l) => l.x.saldoVencido);

  // por vendedor
  const porV = {};
  linhas.forEach(({ c, x }) => {
    const k = c.vendedor || '—';
    porV[k] = porV[k] || { v: k, n: 0, previsto: 0, devido: 0, pago: 0, saldo: 0 };
    porV[k].n++; porV[k].previsto += x.previsto; porV[k].devido += x.devido; porV[k].pago += x.pago; porV[k].saldo += x.saldo;
  });
  const vendas = Object.values(porV).sort((a, b) => b.devido - a.devido);

  view.innerHTML = `
  <div class="page-head">
    <div class="ph-text"><div class="eyebrow">Comissionamento comercial</div><h1 class="page-title">Comissões</h1>
    <div class="page-sub">Comissões de vendedores por evento: o que está previsto, o que já é devido e o que falta pagar.</div></div>
    <div class="ph-actions"><button class="btn btn-primary" id="comNovo">${icon('plus', 'sm')}Nova comissão</button></div>
  </div>
  <div class="filterbar">
    <span class="fb-label">${icon('filter', 'xs')} Recorte</span>
    ${filterSelects(S, COM_KEYS)}
    ${anyFilter(S, COM_KEYS) ? `<button class="btn btn-ghost btn-sm" data-clear-filters>${icon('x', 'xs')}Limpar</button>` : ''}
    <span class="fb-spacer"></span>${searchBox('comBusca', 'Buscar vendedor, evento, referência…', S.q)}
  </div>

  <div class="ctx-note" style="margin-bottom:16px">${icon('info', 'sm')}<div>
    Cada comissão é lançada como um <b>custo do evento</b>. É o mesmo registro que aparece em Custos, em Contas a Pagar e no resultado — por isso nunca é contado duas vezes.
    Uma comissão só vira obrigação quando o direito é reconhecido; antes disso, fica apenas como valor previsto.
  </div></div>

  <div class="card kpi-group">
    <div class="kg-title"><div class="kg-name">Comissões</div><div class="kg-desc">${linhas.length} comissão(ões) · ${vendas.length} vendedor(es)</div></div>
    <div class="kg-cells">
      ${kpiSm('Previsto', previsto, naoDevida > 0 ? `<span class="badge b-outline">${fmtBRL(naoDevida)} ainda não devido</span>` : '<span class="muted">valor calculado ou negociado</span>', '', 'Valor calculado pela regra de cada comissão, antes do reconhecimento do direito.')}
      ${kpiSm('Devido', devido, barFoot(previsto ? devido / previsto : null, 'do previsto'), '', 'Comissões cujo direito já foi reconhecido. Integram o custo do evento.')}
      ${kpiSm('Pago', pago, barFoot(devido ? pago / devido : null, 'do devido', 'verde'), '', 'Saída de caixa efetiva das comissões.')}
      ${kpiSm('A pagar', saldo, vencido > 0 ? `<span class="badge b-vermelho">${icon('alert', 'xs')}${fmtBRL(vencido)} vencido</span>` : '<span class="muted">devido − pago</span>', 'accent-vermelho', 'Comissões devidas e ainda não quitadas.')}
    </div>
  </div>

  <div class="grid g-2" style="margin:16px 0">
    <div class="card"><div class="card-head"><div><h3>Comissões por vendedor</h3><div class="ch-sub">Devido × pago</div></div>
      <div class="ch-right">${legend([['Devido', C.azul], ['Pago', C.verde]])}</div></div>
      <div class="card-body"><div class="chart-box short" id="comChart"></div></div></div>
    <div class="card"><div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Resumo por vendedor</h3></div></div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Vendedor</th><th class="c">Comissões</th><th class="r">Devido</th><th class="r">Pago</th><th class="r">A pagar</th></tr></thead>
        <tbody>${vendas.map((v) => `<tr><td class="strong">${esc(v.v)}</td><td class="c num">${fmtNum(v.n)}</td>
          <td class="r num">${fmtBRL(v.devido)}</td><td class="r num">${fmtBRL(v.pago)}</td><td class="r num strong">${fmtBRL(v.saldo)}</td></tr>`).join('')
          || '<tr><td colspan="5" class="muted">Sem comissões no recorte.</td></tr>'}</tbody>
      </table></div></div>
  </div>

  <div class="card">
    <div class="card-head" style="padding-bottom:12px"><div><h3 style="font-size:18px">Comissões registradas</h3>
      <div class="ch-sub">Mesmo registro exibido em Custos e em Contas a Pagar</div></div>
      <div class="ch-right"><button class="btn btn-secondary btn-sm" id="comCsv">${icon('download', 'sm')}Exportar CSV</button></div></div>
    ${comissoesTable(linhas)}
  </div>`;

  bindFilters(view, S, COM_KEYS, () => Router.refresh());
  const bs = $('#comBusca'); let tq;
  bs.oninput = () => { clearTimeout(tq); tq = setTimeout(() => { S.q = bs.value; Router.refresh(); }, 220); };
  $('#comNovo').onclick = () => openComissaoDrawer(null, null);
  bindComissoes(view);
  $('#comCsv').onclick = () => csvDownload('comissoes', [
    { l: 'ID', v: (l) => l.c.id }, { l: 'Evento', v: (l) => l.c.eventoId }, { l: 'Nome do evento', v: (l) => l.ev.nome },
    { l: 'Vendedor', v: (l) => l.c.vendedor }, { l: 'Referência', v: (l) => l.c.referenciaComercial },
    { l: 'Forma de cálculo', v: (l) => l.c.modalidadeComissao }, { l: 'Base', v: (l) => l.c.baseComissao },
    { l: 'Valor da base', v: (l) => l.c.baseValor, money: true }, { l: 'Percentual', v: (l) => l.c.percentual },
    { l: 'Previsto', v: (l) => l.x.previsto, money: true }, { l: 'Ajuste', v: (l) => l.c.ajuste, money: true },
    { l: 'Devido', v: (l) => l.x.devido, money: true }, { l: 'Pago', v: (l) => l.x.pago, money: true },
    { l: 'A pagar', v: (l) => l.x.saldo, money: true }, { l: 'Direito adquirido', v: (l) => l.c.condicaoAquisicao },
    { l: 'Situação', v: (l) => l.x.status }, { l: 'Competência', v: (l) => Rules.custoCompetencia(l.c) },
  ], linhas);
  if (vendas.length) Charts.bars($('#comChart'), { horizontal: true, maxBar: 16, labels: vendas.map((v) => v.v),
    datasets: [{ label: 'Devido', data: vendas.map((v) => v.devido), color: C.azul }, { label: 'Pago', data: vendas.map((v) => v.pago), color: C.verde }] });
  else $('#comChart').innerHTML = '<div class="empty" style="padding:26px"><p>Sem comissões no recorte.</p></div>';
};

/* ---------------- Aba do evento ---------------- */
function wsComissoes(el, ev, m, alerts, db) {
  const linhas = Rules.comissoesDe(db, ev.id).map((c) => ({ c, x: Rules.comissaoFin(c, db), ev }));
  const T = (f) => Rules.sum(linhas, (l) => l.x[f]);
  const naoDevida = Rules.sum(linhas.filter((l) => !l.c.devida), (l) => l.x.previsto);
  el.innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="card-body" style="padding-bottom:18px">
    <div class="grid g-4">
      ${miniKpi('Comissões previstas', fmtBRL(T('previsto'), { dash: false }), `${linhas.length} comissão(ões) · ${m.vendedores.length} vendedor(es)`)}
      ${miniKpi('Comissões devidas', fmtBRL(T('devido'), { dash: false }), naoDevida > 0 ? `${fmtBRL(naoDevida)} ainda não devido` : 'direito reconhecido')}
      ${miniKpi('Pago', fmtBRL(T('pago'), { dash: false }), `${pct(T('pago'), T('devido'))} do devido`)}
      ${miniKpi('A pagar', fmtBRL(T('saldo'), { dash: false }), 'devido − pago', T('saldo') > 0 ? 'neg' : '')}
    </div>
  </div></div>

  <div class="ctx-note" style="margin-bottom:16px">${icon('info', 'sm')}<div>
    As comissões deste evento são <b>custos do evento</b>: já estão incluídas no custo previsto, no custo realizado e no resultado.
    Elas também aparecem na aba Custos e em Contas a Pagar — é sempre o mesmo lançamento, nunca somado duas vezes.
  </div></div>

  <div class="card">
    <div class="toolbar">
      <span class="muted" style="font-size:12.5px">Nem toda venda gera comissão. Nenhum percentual é aplicado automaticamente.</span>
      <span style="flex:1"></span>
      <button class="btn btn-primary btn-sm" id="addCom">${icon('plus', 'sm')}Adicionar comissão</button>
    </div>
    ${comissoesTable(linhas, { showEvento: false })}
  </div>`;
  $('#addCom').onclick = () => openComissaoDrawer(ev, null);
  bindComissoes(el);
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
/** Congela a apuração das competências já marcadas como fechadas na base fictícia,
    para que a comparação "congelado × atual" seja demonstrável na homologação. */
function congelarFechamentosIniciais() {
  const db = Repo.snapshot();
  db.fechamentos.forEach((f) => { if (f.status === 'Fechado' && !f.congelado) f.congelado = Rules.apuracaoMes(db, f.competencia); });
}
const _reset = Repo.reset;
Repo.reset = () => _reset().then((r) => { congelarFechamentosIniciais(); return r; });

document.addEventListener('DOMContentLoaded', () => {
  congelarFechamentosIniciais();
  renderShell();
  if (!location.hash) history.replaceState(null, '', '#/visao-geral');
  Router.render();
  window.NTC_FIN05 = { Repo, Rules, Service, UI, PARAMS, version: 'v0.2.2' }; // exposto para inspeção/QA
});

</script>
