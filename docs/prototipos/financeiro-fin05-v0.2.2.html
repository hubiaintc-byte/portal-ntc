    },
    remove(entity, id) {
      state.db[entity] = state.db[entity].filter((r) => r.id !== id);
      return ok(true);
    },
    reset() { state = buildSeed(); return ok(true); },
  };
})();

/* =====================================================================
   CAMADA DE REGRAS DE NEGÓCIO · FIN-05 v1.0
   Somente fórmulas determináveis (§13.1). Metodologias não validadas → [A VALIDAR].
   CONTRATADO ≠ FATURADO · FATURADO ≠ RECEBIDO · CUSTO REALIZADO ≠ PAGO
   RECEITA ≠ ENTRADA DE CAIXA · CUSTO/DESPESA ≠ SAÍDA DE CAIXA
   ===================================================================== */
const Rules = (() => {
  const n = (v) => Number(v) || 0;
  const sum = (arr, f) => arr.reduce((a, x) => a + n(f(x)), 0);
  const pad = (x) => String(x).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  /* ---------- Receita (03) ---------- */
  const valorBruto = (r) => n(r.qtde) * n(r.valorUnit);
  const valorReceita = (r) => Math.max(0, valorBruto(r) - n(r.desconto));      // planilha v0.9.1: MAX(0, Qtde×Unit − Desconto)
  const isContratada = (r) => r.statusEconomico !== 'Prevista';

  function receitaFin(r, db) {
    const frs = db.fatrec.filter((f) => f.receitaId === r.id);
    const valor = valorReceita(r);
    const faturado = sum(frs, (f) => f.valorFaturado);
    const recebido = sum(frs, (f) => f.valorRecebido);
    const retTributaria = sum(frs, retTrib);
    const retContratual = sum(frs, retContr);
    const exigivel = sum(frs, (f) => fatrecFin(f).exigivel);
    const aLiberar = sum(frs, (f) => fatrecFin(f).aLiberar);
    let status;
    if (!isContratada(r)) status = 'Prevista';
    else if (faturado === 0) status = 'Contratada';
    else if (recebido === 0) status = faturado < valor ? 'Faturada parcialmente' : 'Faturada';
    else if (recebido >= faturado && faturado >= valor) status = 'Recebida';
    else status = 'Recebida parcialmente';
    return {
      valor, contratado: isContratada(r) ? valor : 0, faturado, recebido,
      aFaturar: isContratada(r) ? Math.max(0, valor - faturado) : 0,
      aReceber: faturado - recebido, retTributaria, retContratual, exigivel, aLiberar,
      liquidoEsperado: faturado - retTributaria - retContratual,
      status, parcelas: frs,
    };
  }

  /* ---------- Faturamento/Recebimento (04) — fonte única ----------
     v0.2 · sete grandezas distintas do recebível (Consolidação Pré-v0.2, D3):
       bruto · retenção tributária · retenção contratual · líquido esperado ·
       recebido · saldo exigível · retenção contratual a liberar · diferença de conciliação
     Retenção NÃO é inadimplência e NÃO é despesa por si. ---------------- */
  const retTrib = (f) => n(f.retencaoTributaria != null ? f.retencaoTributaria : f.retencao);
  const retContr = (f) => n(f.retencaoContratual);
  function fatrecFin(f) {
    const bruto = n(f.valorFaturado);
    const rt = retTrib(f), rc = retContr(f), rcLib = n(f.retencaoContratualLiberada);
    const recebido = n(f.valorRecebido);
    const liquido = bruto - rt - rc;                               // LÍQUIDO ESPERADO
    const exigivel = Math.max(0, liquido - recebido);              // SALDO EXIGÍVEL (cobrável hoje)
    const aLiberar = Math.max(0, rc - rcLib);                      // retenção contratual a liberar
    const diferenca = f.quitado ? recebido - liquido : 0;          // diferença de conciliação
    const saldo = bruto - recebido;                                // SALDO A RECEBER = FATURADO − RECEBIDO (FIN-05 §13.1)
    let status;
    if (f.quitado) status = 'Liquidada';
    else if (liquido > 0 && recebido >= liquido) status = 'Recebida';
    else if (recebido > 0) status = 'Recebida parcialmente';
    else status = 'Faturada';
    const vencido = exigivel > 0 && f.vencimento && f.vencimento < todayISO() && recebido === 0;
    return { bruto, retTrib: rt, retContr: rc, liquido, recebido, exigivel, aLiberar, diferenca, saldo, status, vencido };
  }

  /* ---------- Custo (02) ---------- */
  const custoPrevisto = (c) => n(c.qtde) * n(c.valorUnitPrev);            // Valor total previsto = Qtde × Unit. previsto
  function custoFin(c, db) {
    const pays = db.pagamentos.filter((p) => p.custoId === c.id);
    const previsto = custoPrevisto(c);
    const realizado = n(c.valorRealizado);
    const pago = sum(pays, (p) => p.valorPago);
    const programado = sum(pays, (p) => p.valor);
    let status;
    if (realizado === 0) status = 'Previsto';
    else if (pago === 0) status = 'Realizado';
    else if (pago < realizado) status = 'Pago parcialmente';
    else status = 'Pago';
    return {
      previsto, realizado, pago, programado,
      aPagar: realizado - pago,                                          // SALDO A PAGAR = REALIZADO − PAGO
      desvio: realizado > 0 ? realizado - previsto : 0,                   // DESVIO = REALIZADO − PREVISTO (itens realizados)
      acima: realizado > previsto, status, pagamentos: pays,
    };
  }

  /* ---------- Pagamento (05) ---------- */
  function pagamentoFin(p) {
    const saldo = n(p.valor) - n(p.valorPago);
    let status;
    if (n(p.valorPago) >= n(p.valor)) status = 'Pago';
    else if (n(p.valorPago) > 0) status = 'Pago parcialmente';
    else status = 'Programado';
    const vencido = saldo > 0 && p.vencimento && p.vencimento < todayISO();
    return { saldo, status, vencido };
  }

  /* ---------- Comissões comerciais (v0.2.1) ----------
     A comissão é um lançamento de custo com atributos comerciais.
     Previsto  = base × percentual, ou valor fixo negociado.
     Apurado   = previsto + ajuste justificado.
     Devido    = apurado, SOMENTE quando o direito foi reconhecido (devida).
     Pago      = baixas do título. Saldo = devido − pago.
     Nenhum percentual padrão é presumido e nenhuma receita gera comissão
     automaticamente. --------------------------------------------------- */
  const isComissao = (c) => c.origemLancamento === 'Comissão' || c.categoria === PARAMS.CAT_COMISSAO;
  const comissoesDe = (db, eventoId) => db.custos.filter((c) => isComissao(c) && (!eventoId || c.eventoId === eventoId));
  /** Valor da base de cálculo, recalculado a partir do evento */
  function baseComissao(tipo, ev, db, informado) {
    if (!ev || tipo === 'Valor informado') return n(informado);
    const recs = db.receitas.filter((r) => r.eventoId === ev.id);
    const frs = db.fatrec.filter((f) => f.eventoId === ev.id);
    if (tipo === 'Receita contratada') return sum(recs.filter(isContratada), valorReceita);
    if (tipo === 'Receita reconhecida') return sum(recs, (r) => receitaReconhecida(r, db));
    if (tipo === 'Receita faturada') return sum(frs, (f) => f.valorFaturado);
    if (tipo === 'Receita recebida') return sum(frs, (f) => f.valorRecebido);
    return n(informado);
  }
  function comissaoFin(c, db) {
    const previsto = custoPrevisto(c);
    const apurado = previsto + n(c.ajuste);
    const devido = c.devida ? n(c.valorRealizado) : 0;
    const pays = db.pagamentos.filter((p) => p.custoId === c.id);
    const pago = sum(pays, (p) => p.valorPago);
    const programado = sum(pays, (p) => p.valor);
    const saldo = devido - pago;
    let status;
    if (!c.devida) status = 'Prevista';
    else if (pago === 0) status = 'Devida';
    else if (pago < devido) status = 'Paga parcialmente';
    else status = 'Paga';
    const venc = pays.filter((p) => pagamentoFin(p).vencido);
    return { previsto, apurado, devido, pago, programado, saldo, status, titulos: pays,
      vencido: venc.length > 0, saldoVencido: sum(venc, (p) => pagamentoFin(p).saldo) };
  }

  /** v0.2.2 · Demonstrativo em três colunas:
        Receitas − Custos e despesas operacionais − Comissões comerciais = Resultado.
      As comissões saem do total de custos e ganham linha própria; a soma das duas
      linhas é sempre igual ao custo total, o que impede dedução em duplicidade. */
  function demonstrativo(receita, custoTotal, comissao) {
    const oper = custoTotal.map((v, i) => n(v) - n(comissao[i]));
    const resultado = receita.map((v, i) => n(v) - oper[i] - n(comissao[i]));
    return {
      receita: receita.map(n), operacional: oper, comissao: comissao.map(n),
      custoTotal: custoTotal.map(n), resultado,
      confere: custoTotal.every((v, i) => n(v) === oper[i] + n(comissao[i])),
    };
  }

  /* ---------- Resultado do evento (06) ---------- */
  function eventMetrics(ev, db) {
    const recs = db.receitas.filter((r) => r.eventoId === ev.id);
    const custos = db.custos.filter((c) => c.eventoId === ev.id);
    const rf = recs.map((r) => ({ r, f: receitaFin(r, db) }));
    const cf = custos.map((c) => ({ c, f: custoFin(c, db) }));
    const contratada = sum(rf, (x) => x.f.contratado);
    const prevista = sum(rf.filter((x) => x.r.statusEconomico === 'Prevista'), (x) => x.f.valor);
    const faturada = sum(rf, (x) => x.f.faturado);
    const recebida = sum(rf, (x) => x.f.recebido);
    const orcado = sum(cf, (x) => x.f.previsto);
    const realizado = sum(cf, (x) => x.f.realizado);
    const pago = sum(cf, (x) => x.f.pago);
    const direto = sum(cf.filter((x) => x.c.natureza === 'Direto'), (x) => x.f.realizado);
    const indireto = sum(cf.filter((x) => x.c.natureza === 'Indireto'), (x) => x.f.realizado);
    const recContr = rf.filter((x) => isContratada(x.r));
    const pagantes = sum(recContr, (x) => x.r.pagantes);
    const cortesias = sum(recContr, (x) => x.r.cortesias);
    const participantes = pagantes + cortesias;                          // PARTICIP. TOTAL = PAGANTES + CORTESIAS
    const orcadoRealizados = sum(cf.filter((x) => x.f.realizado > 0), (x) => x.f.previsto);
    // v0.2.1 · comissões comerciais (subconjunto identificado dos custos, nunca somado duas vezes)
    const coms = cf.filter((x) => isComissao(x.c));
    const comFin = coms.map((x) => comissaoFin(x.c, db));
    const comissaoPrevista = sum(comFin, (x) => x.previsto);
    const comissaoDevida = sum(comFin, (x) => x.devido);
    const comissaoPaga = sum(comFin, (x) => x.pago);
    const reconhecida = sum(recs, (r) => receitaReconhecida(r, db));
    const baseUnit = participantes > 0 ? participantes : n(ev.efetivos);
    return {
      contratada, prevista, faturada, recebida,
      aFaturar: contratada - faturada,
      aReceber: faturada - recebida,
      orcado, realizado, pago, aPagar: realizado - pago,
      direto, indireto,
      resultado: faturada - realizado,          // leitura histórica (faturada − realizado), mantida para compatibilidade interna
      resultadoPrevisto: contratada - orcado,   // previsto: contratado − custos previstos (inclui comissões previstas)
      resultadoRealizado: reconhecida - realizado, // v0.2.1 · reconhecida − incorrido (inclui comissões devidas)
      reconhecida,
      comissaoPrevista, comissaoDevida, comissaoPaga, comissaoSaldo: comissaoDevida - comissaoPaga,
      nComissoes: coms.length,
      vendedores: [...new Set(coms.map((x) => x.c.vendedor).filter(Boolean))],
      custoOperacionalPrevisto: orcado - comissaoPrevista,
      custoOperacionalRealizado: realizado - comissaoDevida,
      custoOperacionalPago: pago - comissaoPaga,
      demo: demonstrativo([contratada, reconhecida, recebida], [orcado, realizado, pago], [comissaoPrevista, comissaoDevida, comissaoPaga]),
      movimentacao: recebida - pago,            // entradas − saídas do evento
      caixa: recebida - pago,                   // (nome anterior, mantido para compatibilidade interna)
      desvio: realizado - orcadoRealizados,     // desvio dos itens já realizados
      desvioTotal: realizado - orcado,
      execucaoOrcamento: orcado > 0 ? realizado / orcado : null,
      pagantes, cortesias, participantes, baseUnit,
      baseUnitLabel: participantes > 0 ? 'pagantes + cortesias' : 'participantes efetivos (cadastro)',
      custoPorParticipante: baseUnit > 0 && realizado > 0 ? realizado / baseUnit : null,
      receitaPorPagante: pagantes > 0 ? contratada / pagantes : null,
      receitaPorParticipante: participantes > 0 ? contratada / participantes : null,
      nReceitas: recs.length, nCustos: custos.length,
      rf, cf,
    };
  }

  /* ---------- Alertas (FIN-05 §17) — sem thresholds financeiros ---------- */
  const SEV_ORDER = { 'Vencido': 0, 'Pendente': 1, 'Atenção': 2, 'A validar': 3 };
  function eventAlerts(ev, db, m) {
    m = m || eventMetrics(ev, db);
    const out = [];
    const add = (sev, titulo, detalhe, tab, valor) => out.push({ sev, titulo, detalhe, tab, valor, eventoId: ev.id, eventoNome: ev.nome });
    const ativo = ['Em execução', 'Realizado', 'Encerrado'].includes(ev.status);
    db.fatrec.filter((f) => f.eventoId === ev.id).forEach((f) => {
      const x = fatrecFin(f);
      if (x.vencido) add('Vencido', 'Recebimento vencido', `${f.nf || f.parcela} · venc. ${fmtDate(f.vencimento)}`, 'faturamento', x.saldo);
      else if (x.status === 'Recebida parcialmente') add('Atenção', 'Faturamento parcialmente recebido', `${f.nf || f.parcela} · saldo em aberto`, 'faturamento', x.saldo);
      if (retTrib(f) > 0) add('A validar', 'Retenção tributária — tratamento não confirmado', `${f.nf || f.parcela} · não é inadimplência · [VALIDAR COM CONTABILIDADE]`, 'faturamento', retTrib(f));
      if (x.aLiberar > 0) add('Pendente', 'Retenção contratual a liberar', `${f.nf || f.parcela} · garantia contratual — não é inadimplência`, 'faturamento', x.aLiberar);
      if (x.diferenca !== 0) add('Atenção', 'Diferença de conciliação no recebimento', `${f.nf || f.parcela} · recebido difere do líquido esperado`, 'faturamento', x.diferenca);
    });
    m.rf.forEach(({ r, f }) => {
      if (ativo && isContratada(r) && f.aFaturar > 0) add('Pendente', 'Receita contratada ainda não faturada', r.cliente, 'faturamento', f.aFaturar);
    });
    let vencPag = 0, nVenc = 0;
    db.pagamentos.filter((p) => p.eventoId === ev.id).forEach((p) => { const x = pagamentoFin(p); if (x.vencido) { vencPag += x.saldo; nVenc++; } });
    if (nVenc) add('Vencido', 'Pagamento vencido', `${nVenc} título(s) com vencimento ultrapassado sem baixa`, 'pagamentos', vencPag);
    const pend = m.cf.filter((x) => x.f.aPagar > 0);
    if (pend.length) add('Pendente', 'Pagamentos pendentes', `${pend.length} custo(s) realizado(s) com saldo a pagar`, 'pagamentos', sum(pend, (x) => x.f.aPagar));
    const acima = m.cf.filter((x) => x.f.acima);
    if (acima.length) add('Atenção', 'Custo realizado acima do previsto', `${acima.length} lançamento(s) · ${acima.map((x) => x.c.categoria).slice(0, 2).join(', ')}${acima.length > 2 ? '…' : ''}`, 'custos', sum(acima, (x) => x.f.realizado - x.f.previsto));
    comissoesDe(db, ev.id).forEach((c) => {
      const x = comissaoFin(c, db);
      if (x.vencido) add('Vencido', 'Comissão vencida sem pagamento', `${esc(c.vendedor)} · saldo em aberto`, 'comissoes', x.saldoVencido);
      else if (x.status === 'Devida') add('Pendente', 'Comissão devida ainda não paga', `${esc(c.vendedor)}`, 'comissoes', x.devido);
      else if (x.status === 'Paga parcialmente') add('Atenção', 'Comissão paga parcialmente', `${esc(c.vendedor)} · saldo em aberto`, 'comissoes', x.saldo);
      if (!c.devida && x.previsto > 0) add('Atenção', 'Comissão prevista, direito ainda não reconhecido', `${esc(c.vendedor)} · ${esc(c.condicaoAquisicao || 'condição a definir')}`, 'comissoes', x.previsto);
    });
    const semForn = m.cf.filter((x) => !x.c.fornecedor || !x.c.categoria);
    if (semForn.length) add('Atenção', 'Custo sem fornecedor/categoria', `${semForn.length} lançamento(s) incompleto(s)`, 'custos', null);
    if (m.nCustos === 0 && ev.status !== 'Encerrado') add('Pendente', 'Evento sem orçamento de custos', 'Nenhum custo previsto registrado', 'custos', null);
    if (m.nReceitas === 0 && ev.status !== 'Planejado') add('Pendente', 'Evento sem receita registrada', 'Nenhuma receita vinculada', 'receitas', null);
    return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
  }

  /* ---------- Períodos ---------- */
  const PERIODOS = [
    { id: 'all', label: 'Todo o período' },
    { id: '2026', label: 'Ano 2026' },
    { id: '2026-Q1', label: '1º trimestre 2026' },
    { id: '2026-Q2', label: '2º trimestre 2026' },
    { id: '2026-Q3', label: '3º trimestre 2026' },
    { id: '2026-Q4', label: '4º trimestre 2026' },
    { id: '2027', label: 'Ano 2027' },
  ];
  function inPeriod(dateISO, pid) {
    if (!pid || pid === 'all') return true;
    if (!dateISO) return false;
    const y = dateISO.slice(0, 4), mth = +dateISO.slice(5, 7);
    const [py, q] = pid.split('-');
    if (y !== py) return false;
    if (!q) return true;
    return Math.ceil(mth / 3) === +q.slice(1);
  }

  function matchEvent(ev, f) {
    if (!f) return true;
    if (f.vertical && f.vertical !== 'all' && ev.vertical !== f.vertical) return false;
    if (f.modalidade && f.modalidade !== 'all' && ev.modalidade !== f.modalidade) return false;
    if (f.status && f.status !== 'all' && ev.status !== f.status) return false;
    if (f.tipo && f.tipo !== 'all' && ev.tipo !== f.tipo) return false;
    if (f.periodo && !inPeriod(ev.dataInicio, f.periodo)) return false;
    if (f.q) {
      const q = norm(f.q);
      const hay = norm([ev.id, ev.nome, ev.programa, ev.modulo, ev.cliente, ev.cidade, ev.uf, ev.vertical, ev.tipo].join(' '));
      if (!q.split(/\s+/).every((t) => hay.includes(t))) return false;
    }
    return true;
  }

  /** Consolidação da carteira (08_VISAO_CONSOLIDADA — derivada, somente leitura) */
  function portfolio(filter) {
    const db = Repo.snapshot();
    const evs = db.eventos.filter((e) => matchEvent(e, filter));
    const rows = evs.map((ev) => ({ ev, m: eventMetrics(ev, db) }));
    const keys = ['contratada', 'prevista', 'faturada', 'recebida', 'aFaturar', 'aReceber', 'orcado', 'realizado', 'pago', 'aPagar', 'resultado', 'resultadoPrevisto', 'resultadoRealizado', 'reconhecida', 'comissaoPrevista', 'comissaoDevida', 'comissaoPaga', 'comissaoSaldo', 'caixa', 'movimentacao', 'desvio', 'desvioTotal', 'pagantes', 'cortesias', 'participantes'];
    const tot = {};
    keys.forEach((k) => { tot[k] = sum(rows, (x) => x.m[k]); });
    const alerts = rows.flatMap((x) => eventAlerts(x.ev, db, x.m)).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
    return { db, rows, tot, alerts, evIds: new Set(evs.map((e) => e.id)) };
  }


  /* ===================================================================
     v0.2 · LIVRO FINANCEIRO ÚNICO
     Corporativo (sem evento) · competência · caixa · orçamento · fechamento
     Cada fato econômico e cada movimentação financeira entram UMA ÚNICA VEZ.
     =================================================================== */
  const mesDe = (iso) => (iso ? String(iso).slice(0, 7) : '');
  const MES_SERIE = (ano) => Array.from({ length: 12 }, (_, i) => `${ano}-${String(i + 1).padStart(2, '0')}`);
  const MES_SERIE_2026 = MES_SERIE('2026');
  const isCorp = (row) => !row.eventoId;
  const centroNome = (cod) => { const c = PARAMS.centrosCusto.find((x) => x.cod === cod); return c ? c.nome : (cod || '—'); };
  const CRIT_PROVISORIO = 'Execução declarada (provisório)';

  /* ---------- Reconhecimento econômico (PROVISÓRIO — pendente de validação contábil) ----------
     Receita contratada NÃO equivale a receita reconhecida.
     1) Receita com etapas/módulos: reconhece o valor da etapa concluída, na competência
        da conclusão. Valores por etapa são informados — nunca presumidos iguais.
     2) Sem etapas, critério "Execução declarada (provisório)": reconhece integralmente na
        competência do término da execução, quando o evento já foi executado.
     3) Critério "Integral no encerramento": somente com o evento encerrado.
     Lançamento corporativo: reconhece na competência declarada. */
  function reconhecimentoReceita(r, db) {
    const total = isContratada(r) ? valorReceita(r) : 0;
    if (!total) return [];
    const ev = r.eventoId ? db.eventos.find((e) => e.id === r.eventoId) : null;
    const etapas = (r.etapas || []).filter((e) => n(e.valor) > 0 || n(e.percentual) > 0);
    if (etapas.length) {
      return etapas.filter((e) => e.concluida).map((e) => ({
        mes: mesDe(e.dataConclusao || (ev ? ev.dataFim : r.competencia)),
        valor: e.base === 'percentual' ? Math.round(total * n(e.percentual) / 100) : n(e.valor),
        rotulo: e.nome, criterio: 'Etapa/módulo concluído', provisorio: false,
      })).filter((x) => x.mes && x.valor);
    }
    const crit = r.criterioReconhecimento || CRIT_PROVISORIO;
    if (!ev) {
      const mes = mesDe(r.competencia);
      return mes ? [{ mes, valor: total, rotulo: 'Competência declarada', criterio: crit, provisorio: crit === CRIT_PROVISORIO }] : [];
    }
    const fim = ev.dataFim || ev.dataInicio;
    if (!fim) return [];
    if (crit === 'Integral no encerramento') {
      return ev.status === 'Encerrado' ? [{ mes: mesDe(fim), valor: total, rotulo: 'Encerramento', criterio: crit, provisorio: false }] : [];
    }
    const executado = ['Realizado', 'Encerrado'].includes(ev.status) || fim <= todayISO();
    return executado ? [{ mes: mesDe(fim), valor: total, rotulo: 'Execução declarada', criterio: CRIT_PROVISORIO, provisorio: true }] : [];
  }
  const receitaReconhecida = (r, db) => sum(reconhecimentoReceita(r, db), (x) => x.valor);
  /** Competência do custo/despesa (fato econômico incorrido) */
  const custoCompetencia = (c) => mesDe(c.competencia || c.dataPrevista);

  /* ---------- Recorte (escopo + centro de custo + filtros de evento) ---------- */
  function escopo(filter) {
    const db = Repo.snapshot();
    const f = filter || {};
    const evs = db.eventos.filter((e) => matchEvent(e, f));
    const evIds = new Set(evs.map((e) => e.id));
    const es = f.escopo || 'all';
    const cc = f.centro || 'all';
    const okCentro = (row) => cc === 'all' || row.centroCusto === cc;
    const vis = (row) => (row.eventoId ? (es !== 'corporativo' && evIds.has(row.eventoId)) : es !== 'eventos') && okCentro(row);
    const receitas = db.receitas.filter(vis);
    const custos = db.custos.filter(vis);
    const recIds = new Set(receitas.map((r) => r.id));
    const cusIds = new Set(custos.map((c) => c.id));
    const fatrec = db.fatrec.filter((x) => recIds.has(x.receitaId));
    const pagamentos = db.pagamentos.filter((x) => cusIds.has(x.custoId));
    return { db, evs, evIds, receitas, custos, fatrec, pagamentos };
  }

  /* ---------- Três perspectivas de resultado (Consolidação Pré-v0.2, D1) ---------- */
  function consolidado(filter) {
    const f = filter || {};
    const sc = escopo(f);
    const per = f.periodo || 'all';
    const noPer = (iso) => inPeriod(iso, per);
    const noPerMes = (mes) => (mes ? inPeriod(mes + '-01', per) : false);

    const recContr = sc.receitas.filter(isContratada);
    const contratada = sum(recContr, valorReceita);
    const prevista = sum(sc.receitas.filter((r) => !isContratada(r)), valorReceita);
    const faturada = sum(sc.fatrec, (x) => x.valorFaturado);
    const recebida = sum(sc.fatrec, (x) => x.valorRecebido);
    const retTributaria = sum(sc.fatrec, retTrib);
    const retContratual = sum(sc.fatrec, retContr);
    const exigivel = sum(sc.fatrec, (x) => fatrecFin(x).exigivel);
    const aLiberar = sum(sc.fatrec, (x) => fatrecFin(x).aLiberar);
    const orcado = sum(sc.custos, custoPrevisto);
    const realizado = sum(sc.custos, (c) => c.valorRealizado);
    const comissoes = sc.custos.filter(isComissao);
    const comIds = new Set(comissoes.map((c) => c.id));
    const comissaoPrevista = sum(comissoes, custoPrevisto);
    const comissaoDevida = sum(comissoes.filter((c) => c.devida), (c) => c.valorRealizado);
    const comissaoPaga = sum(sc.pagamentos.filter((p) => comIds.has(p.custoId)), (p) => p.valorPago);
    const pago = sum(sc.pagamentos, (p) => p.valorPago);
    const obrigacoes = sum(sc.pagamentos, (p) => p.valor);

    // 1) PROJETADO — compromissos assumidos (não é resultado apurado)
    const projetado = contratada - orcado;

    // 2) ECONÔMICO POR COMPETÊNCIA — reconhecido − incorrido
    const recMes = {}, cusMes = {};
    sc.receitas.forEach((r) => reconhecimentoReceita(r, sc.db).forEach((x) => { recMes[x.mes] = (recMes[x.mes] || 0) + x.valor; }));
    sc.custos.forEach((c) => { const m = custoCompetencia(c); const v = n(c.valorRealizado); if (m && v) cusMes[m] = (cusMes[m] || 0) + v; });
    const reconhecida = Object.keys(recMes).filter(noPerMes).reduce((a, m) => a + recMes[m], 0);
    const incorrido = Object.keys(cusMes).filter(noPerMes).reduce((a, m) => a + cusMes[m], 0);
    const economico = reconhecida - incorrido;

    // 3) MOVIMENTAÇÃO LÍQUIDA DE CAIXA — entradas − saídas (lucro ≠ disponibilidade)
    const ext = extrato(sc.db, { receitas: sc.receitas, custos: sc.custos, escopoAtivo: !!f.escopo && f.escopo !== 'all' });
    const noPeriodo = ext.filter((m) => noPer(m.data));
    const entradas = sum(noPeriodo.filter((m) => m.valor > 0 && m.tipo !== 'Transferência'), (m) => m.valor);
    const saidas = -sum(noPeriodo.filter((m) => m.valor < 0 && m.tipo !== 'Transferência'), (m) => m.valor);
    // comissões no mesmo recorte de competência / caixa usado acima
    const comissaoIncorrida = sum(comissoes.filter((c) => c.devida && noPerMes(custoCompetencia(c))), (c) => c.valorRealizado);
    const comissaoPagaPeriodo = sum(sc.pagamentos.filter((p) => comIds.has(p.custoId) && n(p.valorPago) > 0 && noPer(p.dataPagamento)), (p) => p.valorPago);
    const saldoFinalGeral = saldoGeral(sc.db);
    const saldoInicialPer = saldoGeral(sc.db, (m) => !noPer(m.data));
    const movimentacaoLiquida = entradas - saidas;

    return {
      sc, contratada, prevista, faturada, recebida, retTributaria, retContratual, exigivel, aLiberar,
      aFaturar: Math.max(0, contratada - faturada), aReceber: faturada - recebida,
      orcado, realizado, pago, obrigacoes, aPagar: realizado - pago,
      comissaoPrevista, comissaoDevida, comissaoPaga, comissaoSaldo: comissaoDevida - comissaoPaga, nComissoes: comissoes.length,
      projetado, reconhecida, incorrido, economico,
      entradas, saidas, movimentacaoLiquida,
      comissaoIncorrida, comissaoPagaPeriodo,
      custoOperacionalPrevisto: orcado - comissaoPrevista,
      custoOperacionalIncorrido: incorrido - comissaoIncorrida,
      demo: demonstrativo([contratada, reconhecida, entradas], [orcado, incorrido, saidas], [comissaoPrevista, comissaoIncorrida, comissaoPagaPeriodo]),
      saldoInicial: saldoInicialPer, saldoFinal: saldoInicialPer + movimentacaoLiquida,
      saldoAtual: saldoFinalGeral,
      recMes, cusMes, extrato: ext,
      caixa: recebida - pago,
      desvioOrcamento: realizado - orcado,
      execucaoOrcamento: orcado > 0 ? realizado / orcado : null,
    };
  }

  /* ---------- Caixa: extrato unificado (cada movimentação uma única vez) ----------
     Fontes: recebimentos (04) · pagamentos (05) · movimentos avulsos e transferências.
     Transferências internas NÃO geram receita nem despesa: saem de uma conta e
     entram em outra, com efeito líquido zero sobre o caixa consolidado. */
  function extrato(db, opts) {
    const o = opts || {};
    const recSet = o.receitas ? new Set(o.receitas.map((r) => r.id)) : null;
    const cusSet = o.custos ? new Set(o.custos.map((c) => c.id)) : null;
    const out = [];
    db.fatrec.forEach((f) => {
      if (recSet && !recSet.has(f.receitaId)) return;
      if (!(n(f.valorRecebido) > 0 && f.dataRecebimento)) return;
      out.push({ id: f.id, data: f.dataRecebimento, tipo: 'Recebimento', contaId: f.contaId || 'CT-0001',
        valor: n(f.valorRecebido), descricao: `${f.nf || f.parcela || 'Recebimento'}`, origem: 'fatrec',
        eventoId: f.eventoId || '', ref: f.id });
    });
    db.pagamentos.forEach((p) => {
      if (cusSet && !cusSet.has(p.custoId)) return;
      if (!(n(p.valorPago) > 0 && p.dataPagamento)) return;
      out.push({ id: p.id, data: p.dataPagamento, tipo: 'Pagamento', contaId: p.contaId || 'CT-0001',
        valor: -n(p.valorPago), descricao: p.documento || 'Pagamento', origem: 'pagamento',
        eventoId: p.eventoId || '', ref: p.id });
    });
    if (!o.escopoAtivo) {
      db.movimentos.forEach((m) => {
        if (m.tipo === 'Transferência') {
          out.push({ id: m.id + '-S', data: m.data, tipo: 'Transferência', contaId: m.contaId, valor: -n(m.valor),
            descricao: m.descricao + ' · saída', origem: 'movimento', transferencia: true, ref: m.id, eventoId: '' });
          out.push({ id: m.id + '-E', data: m.data, tipo: 'Transferência', contaId: m.contaDestinoId, valor: n(m.valor),
            descricao: m.descricao + ' · entrada', origem: 'movimento', transferencia: true, ref: m.id, eventoId: '' });
        } else {
          out.push({ id: m.id, data: m.data, tipo: n(m.valor) >= 0 ? 'Entrada avulsa' : 'Saída avulsa', contaId: m.contaId,
            valor: n(m.valor), descricao: m.descricao, origem: 'movimento', classificado: m.classificado !== false,
            ref: m.id, eventoId: '' });
        }
      });
    }
    return out.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
  }
  function saldoGeral(db, filtro) {
    const ini = sum(db.contas, (c) => c.saldoInicial);
    const ext = extrato(db).filter((m) => (filtro ? filtro(m) : true));
    return ini + sum(ext, (m) => m.valor);
  }
  function saldosPorConta(db, ate) {
    const ext = extrato(db);
    return db.contas.map((c) => {
      const movs = ext.filter((m) => m.contaId === c.id && (!ate || m.data <= ate));
      return { conta: c, movimentos: movs, entradas: sum(movs.filter((m) => m.valor > 0), (m) => m.valor),
        saidas: -sum(movs.filter((m) => m.valor < 0), (m) => m.valor), saldo: n(c.saldoInicial) + sum(movs, (m) => m.valor) };
    });
  }
  /** Projeção 30/60/90 dias: saldo atual + exigível A VENCER − obrigações A VENCER.
      Valores já vencidos são informados à parte: não têm data prevista de realização. */
  function projecaoCaixa(db, dias) {
    const hoje = todayISO();
    const lim = addDias(hoje, dias);
    const recAberto = db.fatrec.map((f) => ({ f, x: fatrecFin(f) })).filter(({ x }) => x.exigivel > 0);
    const pagAberto = db.pagamentos.map((p) => ({ p, x: pagamentoFin(p) })).filter(({ x }) => x.saldo > 0);
    const entra = sum(recAberto.filter(({ f }) => f.vencimento && f.vencimento >= hoje && f.vencimento <= lim), (r) => r.x.exigivel);
    const sai = sum(pagAberto.filter(({ p }) => p.vencimento && p.vencimento >= hoje && p.vencimento <= lim), (r) => r.x.saldo);
    const entraVencido = sum(recAberto.filter(({ f }) => f.vencimento && f.vencimento < hoje), (r) => r.x.exigivel);
    const saiVencido = sum(pagAberto.filter(({ p }) => p.vencimento && p.vencimento < hoje), (r) => r.x.saldo);
    const atual = saldoGeral(db);
    return { dias, limite: lim, atual, entra, sai, entraVencido, saiVencido, projetado: atual + entra - sai };
  }
  function addDias(iso, d) {
    const dt = new Date(iso + 'T12:00:00');
    dt.setDate(dt.getDate() + d);
    return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  }

  /* ---------- Orçamento corporativo (exercício · mês · centro · categoria · projeto) ---------- */
  function orcamentoLinhas(db, opts) {
    const o = opts || {};
    const ex = o.exercicio || '2026';
    let linhas = db.orcamentos.filter((r) => r.exercicio === ex);
    if (o.mes && o.mes !== 'all') linhas = linhas.filter((r) => r.mes === o.mes);
    if (o.centro && o.centro !== 'all') linhas = linhas.filter((r) => r.centroCusto === o.centro);
    if (o.tipo && o.tipo !== 'all') linhas = linhas.filter((r) => r.tipo === o.tipo);
    return linhas.map((l) => {
      let realizado = 0;
      if (l.tipo === 'Despesa') {
        realizado = sum(db.custos.filter((c) => custoCompetencia(c) === l.mes
          && (l.eventoId ? c.eventoId === l.eventoId : (!c.eventoId && c.centroCusto === l.centroCusto && c.categoria === l.categoria))), (c) => c.valorRealizado);
      } else {
        db.receitas.filter((r) => (l.eventoId ? r.eventoId === l.eventoId : (!r.eventoId && r.centroCusto === l.centroCusto)))
          .forEach((r) => reconhecimentoReceita(r, db).forEach((x) => { if (x.mes === l.mes) realizado += x.valor; }));
      }
      const desvio = realizado - n(l.valorOrcado);
      return { ...l, realizado, desvio, execucao: n(l.valorOrcado) > 0 ? realizado / n(l.valorOrcado) : null };
    });
  }

  /* ---------- Fechamento mensal simulado (não é encerramento contábil) ---------- */
  const fechamentoDe = (db, mes) => db.fechamentos.find((f) => f.competencia === mes) || null;
  const competenciaFechada = (db, mes) => { const f = fechamentoDe(db, mes); return !!f && f.status === 'Fechado'; };
  /** Apuração congelável de um mês: reconhecido, incorrido, caixa */
  function apuracaoMes(db, mes) {
    let reconhecida = 0, incorrido = 0;
    db.receitas.forEach((r) => reconhecimentoReceita(r, db).forEach((x) => { if (x.mes === mes) reconhecida += x.valor; }));
    db.custos.forEach((c) => { if (custoCompetencia(c) === mes) incorrido += n(c.valorRealizado); });
    const ext = extrato(db).filter((m) => mesDe(m.data) === mes);
    const entradas = sum(ext.filter((m) => m.valor > 0 && m.tipo !== 'Transferência'), (m) => m.valor);
    const saidas = -sum(ext.filter((m) => m.valor < 0 && m.tipo !== 'Transferência'), (m) => m.valor);
    const saldoIni = saldoGeral(db, (m) => m.data < mes + '-01');
    return { mes, reconhecida, incorrido, economico: reconhecida - incorrido, entradas, saidas,
      movimentacaoLiquida: entradas - saidas, saldoInicial: saldoIni, saldoFinal: saldoIni + entradas - saidas,
      lancamentos: ext.length };
  }

  /* ---------- Integridade e ausência de duplicidade ---------- */
  function integridade(db) {
    const out = [];
    const add = (nivel, titulo, detalhe, qtd) => out.push({ nivel, titulo, detalhe, qtd });
    const ids = {};
    ['eventos', 'receitas', 'fatrec', 'custos', 'pagamentos', 'contas', 'movimentos', 'orcamentos', 'fechamentos'].forEach((e) => {
      const seen = new Set(); let dup = 0;
      db[e].forEach((r) => { if (seen.has(r.id)) dup++; else seen.add(r.id); });
      ids[e] = dup;
      if (dup) add('Erro', `Identificadores duplicados em ${e}`, `${dup} registro(s) com ID repetido`, dup);
    });
    const evIds = new Set(db.eventos.map((e) => e.id));
    const recIds = new Set(db.receitas.map((r) => r.id));
    const cusIds = new Set(db.custos.map((c) => c.id));
    const ctIds = new Set(db.contas.map((c) => c.id));
    const orf = (arr, f) => arr.filter(f).length;
    const o1 = orf(db.receitas, (r) => r.eventoId && !evIds.has(r.eventoId));
    const o2 = orf(db.custos, (c) => c.eventoId && !evIds.has(c.eventoId));
    const o3 = orf(db.fatrec, (f) => !recIds.has(f.receitaId));
    const o4 = orf(db.pagamentos, (p) => !cusIds.has(p.custoId));
    const o5 = orf(db.fatrec, (f) => f.contaId && !ctIds.has(f.contaId)) + orf(db.pagamentos, (p) => p.contaId && !ctIds.has(p.contaId));
    const o6 = orf(db.movimentos, (m) => !ctIds.has(m.contaId) || (m.tipo === 'Transferência' && !ctIds.has(m.contaDestinoId)));
    if (o1) add('Erro', 'Receita vinculada a evento inexistente', `${o1} registro(s)`, o1);
    if (o2) add('Erro', 'Custo vinculado a evento inexistente', `${o2} registro(s)`, o2);
    if (o3) add('Erro', 'Faturamento sem receita de origem', `${o3} registro(s)`, o3);
    if (o4) add('Erro', 'Pagamento sem custo de origem', `${o4} registro(s)`, o4);
    if (o5) add('Erro', 'Movimentação com conta financeira inexistente', `${o5} registro(s)`, o5);
    if (o6) add('Erro', 'Transferência com conta inexistente', `${o6} registro(s)`, o6);
    // Sem centro de custo
    const semCC = orf(db.receitas, (r) => !r.centroCusto) + orf(db.custos, (c) => !c.centroCusto);
    if (semCC) add('Atenção', 'Lançamento sem centro de custo', `${semCC} registro(s)`, semCC);
    // Duplicidade econômica: mesmo documento fiscal com mesmo valor
    const nfMap = {};
    db.fatrec.forEach((f) => { if (!f.nf) return; const k = f.nf + '|' + f.valorFaturado; nfMap[k] = (nfMap[k] || 0) + 1; });
    const nfDup = Object.values(nfMap).filter((x) => x > 1).length;
    if (nfDup) add('Erro', 'Possível duplicidade de documento fiscal', `${nfDup} chave(s) NF+valor repetida(s)`, nfDup);
    // Duplicidade de caixa: mesma conta, data, valor e origem
    const mv = {};
    extrato(db).forEach((m) => { const k = [m.contaId, m.data, m.valor, m.ref].join('|'); mv[k] = (mv[k] || 0) + 1; });
    const mvDup = Object.values(mv).filter((x) => x > 1).length;
    if (mvDup) add('Erro', 'Movimentação de caixa registrada mais de uma vez', `${mvDup} ocorrência(s)`, mvDup);
    // v0.2.2 · integridade das comissões comerciais
    const coms = comissoesDe(db);
    const comSemVend = coms.filter((c) => !c.vendedor || !String(c.vendedor).trim()).length;
    if (comSemVend) add('Atenção', 'Comissão sem vendedor identificado', `${comSemVend} lançamento(s)`, comSemVend);
    const comPagoAcima = coms.filter((c) => { const x = comissaoFin(c, db); return x.pago > x.devido; }).length;
    add(comPagoAcima === 0 ? 'OK' : 'Erro', 'Comissão paga acima do valor devido',
      comPagoAcima === 0 ? 'Nenhuma comissão com pagamento acima do devido' : `${comPagoAcima} comissão(ões)`, comPagoAcima);
    const comTitAcima = coms.filter((c) => {
      const x = comissaoFin(c, db);
      const limite = c.devida ? x.apurado : x.previsto;
      return x.programado > limite;
    }).length;
    add(comTitAcima === 0 ? 'OK' : 'Erro', 'Título de comissão acima do valor da comissão',
      comTitAcima === 0 ? 'Nenhum título inconsistente em contas a pagar' : `${comTitAcima} comissão(ões)`, comTitAcima);
    const comPrevistaComPgto = coms.filter((c) => !c.devida && comissaoFin(c, db).pago > 0).length;
    add(comPrevistaComPgto === 0 ? 'OK' : 'Erro', 'Comissão apenas prevista com pagamento registrado',
      comPrevistaComPgto === 0 ? 'Nenhum pagamento sobre comissão não reconhecida' : `${comPrevistaComPgto} comissão(ões)`, comPrevistaComPgto);
    const comCatFora = db.custos.filter((c) => (c.origemLancamento === 'Comissão') !== (c.categoria === PARAMS.CAT_COMISSAO)).length;
    add(comCatFora === 0 ? 'OK' : 'Erro', 'Comissão e categoria “Comissões comerciais” coerentes',
      comCatFora === 0 ? 'Todo lançamento de comissão está na categoria própria, e vice-versa' : `${comCatFora} divergência(s)`, comCatFora);
    const comDevidaSemValor = coms.filter((c) => c.devida && n(c.valorRealizado) <= 0).length;
    if (comDevidaSemValor) add('Atenção', 'Comissão marcada como devida sem valor', `${comDevidaSemValor} lançamento(s)`, comDevidaSemValor);
    // soma das comissões = parcela correspondente do custo total (impossibilidade de dupla dedução)
    const comDevidaTot = sum(coms.filter((c) => c.devida), (c) => c.valorRealizado);
    const custoComCat = sum(db.custos.filter((c) => c.categoria === PARAMS.CAT_COMISSAO && c.devida), (c) => c.valorRealizado);
    add(comDevidaTot === custoComCat ? 'OK' : 'Erro', 'Comissões somadas uma única vez nos custos',
      comDevidaTot === custoComCat
        ? `${coms.length} comissão(ões) · o total devido coincide exatamente com a parcela de comissões dentro dos custos`
        : 'Divergência entre o total das comissões e a parcela correspondente nos custos', coms.length);

    // Excessos
    const exc1 = db.receitas.filter((r) => { const f = receitaFin(r, db); return f.faturado > f.valor && isContratada(r); }).length;
    const exc2 = db.custos.filter((c) => custoFin(c, db).pago > n(c.valorRealizado)).length;
    if (exc1) add('Erro', 'Faturamento acima do contratado', `${exc1} receita(s)`, exc1);
    if (exc2) add('Erro', 'Pagamento acima do custo realizado', `${exc2} custo(s)`, exc2);
    // Transferências: efeito líquido zero
    const transf = db.movimentos.filter((m) => m.tipo === 'Transferência');
    const efeito = sum(extrato(db).filter((m) => m.transferencia), (m) => m.valor);
    add(efeito === 0 ? 'OK' : 'Erro', 'Transferências internas com efeito líquido zero',
      `${transf.length} transferência(s) · efeito no caixa consolidado: ${efeito}`, transf.length);
    // Precisão monetária: todos os valores devem ser inteiros (centavos)
    let naoInteiro = 0;
    const MF = { receitas: ['valorUnit', 'desconto'], fatrec: ['valorFaturado', 'retencaoTributaria', 'retencaoContratual', 'valorRecebido'],
      custos: ['valorUnitPrev', 'valorRealizado'], pagamentos: ['valor', 'valorPago'], contas: ['saldoInicial'],
      movimentos: ['valor'], orcamentos: ['valorOrcado'] };
    Object.keys(MF).forEach((e) => db[e].forEach((r) => MF[e].forEach((k) => { if (r[k] != null && !Number.isInteger(Number(r[k]))) naoInteiro++; })));
    add(naoInteiro === 0 ? 'OK' : 'Erro', 'Precisão monetária (centavos inteiros)',
      naoInteiro === 0 ? 'Nenhum valor fracionário armazenado' : `${naoInteiro} valor(es) não inteiros`, naoInteiro);
    return out;
  }

  /* ---------- Alertas corporativos (fora do escopo de evento) ---------- */
  function corpAlerts(db) {
    const out = [];
    const add = (sev, titulo, detalhe, valor, go) => out.push({ sev, titulo, detalhe, valor, go, corporativo: true });
    const hoje = todayISO();
    const fatCorp = db.fatrec.filter((f) => !f.eventoId);
    fatCorp.forEach((f) => {
      const x = fatrecFin(f);
      if (x.vencido) add('Vencido', 'Recebimento corporativo vencido', `${f.nf || f.parcela}`, x.exigivel, '#/receber');
      if (x.aLiberar > 0) add('Pendente', 'Retenção contratual a liberar', `${f.nf || f.parcela} · garantia — não é inadimplência`, x.aLiberar, '#/receber');
      if (x.diferenca !== 0) add('Atenção', 'Diferença de conciliação', `${f.nf || f.parcela}`, x.diferenca, '#/receber');
    });
    const pagCorp = db.pagamentos.filter((p) => !p.eventoId);
    const venc = pagCorp.filter((p) => pagamentoFin(p).vencido);
    if (venc.length) add('Vencido', 'Obrigação corporativa vencida', `${venc.length} título(s) sem baixa`, sum(venc, (p) => pagamentoFin(p).saldo), '#/pagar');
    const aberto = pagCorp.filter((p) => pagamentoFin(p).saldo > 0 && !pagamentoFin(p).vencido);
    if (aberto.length) add('Pendente', 'Obrigações corporativas em aberto', `${aberto.length} título(s) a vencer`, sum(aberto, (p) => pagamentoFin(p).saldo), '#/pagar');
    const naoClass = db.movimentos.filter((m) => m.classificado === false);
    if (naoClass.length) add('Atenção', 'Movimentação de caixa sem classificação econômica', `${naoClass.length} lançamento(s) a identificar`, sum(naoClass, (m) => Math.abs(n(m.valor))), '#/caixa');
    const compart = db.custos.filter((c) => c.compartilhada);
    if (compart.length) add('A validar', 'Despesas de estrutura compartilhada sem critério de rateio', `${compart.length} lançamento(s) · rateio não aplicado por ausência de critério institucional aprovado`, sum(compart, (c) => c.valorRealizado), '#/resultado');
    const emFech = db.fechamentos.filter((f) => f.status === 'Em fechamento');
    if (emFech.length) add('Pendente', 'Competências em fechamento', emFech.map((f) => f.competencia).join(', '), null, '#/resultado/fechamento');
    return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
  }

  return {
    n, sum, todayISO, pad, valorBruto, valorReceita, isContratada, receitaFin, fatrecFin, retTrib, retContr,
    custoPrevisto, custoFin, pagamentoFin, isComissao, comissoesDe, comissaoFin, baseComissao, eventMetrics, eventAlerts, PERIODOS, inPeriod, matchEvent, portfolio, SEV_ORDER,
    // v0.2
    mesDe, MES_SERIE, MES_SERIE_2026, isCorp, demonstrativo, centroNome, CRIT_PROVISORIO, reconhecimentoReceita, receitaReconhecida,
    custoCompetencia, escopo, consolidado, extrato, saldoGeral, saldosPorConta, projecaoCaixa, addDias,
    orcamentoLinhas, fechamentoDe, competenciaFechada, apuracaoMes, integridade, corpAlerts,
  };
})();

/* =====================================================================
   SERVIÇO DE APLICAÇÃO · validação + persistência (via Repo)
   Ponto único a ser adaptado quando houver API/banco.
   ===================================================================== */
class ValidationError extends Error { constructor(msg, field) { super(msg); this.field = field; } }

const Service = (() => {
  const n = Rules.n;
  const req = (cond, msg, field) => { if (!cond) throw new ValidationError(msg, field); };
  const db = () => Repo.snapshot();

  function validateEvento(d) {
    req(d.nome && d.nome.trim(), 'Informe o nome do evento.', 'nome');
    req(d.vertical, 'Selecione a vertical.', 'vertical');
    req(d.tipo, 'Selecione o tipo de operação.', 'tipo');
    req(d.modalidade, 'Selecione a modalidade.', 'modalidade');
    if (d.tipo === 'Programa' || d.tipo === 'Módulo') req(d.programa, 'Informe o programa.', 'programa');
    if (d.tipo === 'Módulo') req(d.modulo, 'Informe o módulo.', 'modulo');
    if (d.tipo === 'In Company / Projeto B2G') req(d.cliente, 'Em In Company/B2G o cliente/órgão principal é obrigatório.', 'cliente');
    req(d.dataInicio, 'Informe a data inicial.', 'dataInicio');
    req(d.dataFim, 'Informe a data final.', 'dataFim');
    req(d.dataFim >= d.dataInicio, 'A data final não pode ser anterior à inicial.', 'dataFim');
    req(n(d.cargaHoraria) > 0, 'Informe a carga horária.', 'cargaHoraria');
    if (d.modalidade !== 'Online ao vivo') req(d.local, 'Informe o local (presencial/híbrido).', 'local');
    req(d.responsavel, 'Informe o responsável.', 'responsavel');
    req(d.status, 'Informe o status operacional.', 'status');
    if (n(d.capacidade) > 0) req(n(d.qtdPrevista) <= n(d.capacidade), 'Participantes previstos excedem a capacidade.', 'qtdPrevista');
    ['qtdPrevista', 'capacidade', 'efetivos', 'pagantesPrev', 'cortesiasPrev'].forEach((k) => req(n(d[k]) >= 0, 'Valor não pode ser negativo.', k));
  }
  async function saveEvento(d, id) {
    validateEvento(d);
    return id ? Repo.update('eventos', id, d) : Repo.create('eventos', d);
  }
  async function deleteEvento(id) {
    const s = db();
    for (const [ent, key] of [['pagamentos', 'eventoId'], ['custos', 'eventoId'], ['fatrec', 'eventoId'], ['receitas', 'eventoId']]) {
      for (const r of s[ent].filter((x) => x[key] === id)) await Repo.remove(ent, r.id);
    }
    return Repo.remove('eventos', id);
  }
  function dependents(eventoId) {
    const s = db();
    const c = (e) => s[e].filter((x) => x.eventoId === eventoId).length;
    return { receitas: c('receitas'), fatrec: c('fatrec'), custos: c('custos'), pagamentos: c('pagamentos') };
  }

  async function saveReceita(d, id) {
    const corp = !d.eventoId;
    req(d.eventoId || d.tipoLancamento === 'Corporativa', 'Lançamento sem evento: marque-o como receita corporativa.', 'eventoId');
    req(d.centroCusto, 'Informe o centro de custo (obrigatório em todo lançamento).', 'centroCusto');
    if (corp) {
      req(d.origem, 'Selecione a origem da receita corporativa.', 'origem');
      req(d.competencia, 'Informe a competência econômica da receita corporativa.', 'competencia');
    }
    req(d.cliente && d.cliente.trim(), 'Informe o cliente/órgão.', 'cliente');
    req(d.segmento, 'Selecione o segmento.', 'segmento');
    req(d.tipoReceita, 'Selecione o tipo de receita.', 'tipoReceita');
    req(n(d.qtde) > 0, 'Quantidade deve ser maior que zero.', 'qtde');
    req(n(d.valorUnit) > 0, 'Informe o valor.', 'valorUnit');
    req(n(d.desconto) >= 0 && n(d.desconto) <= Rules.valorBruto(d), 'Desconto inválido (entre zero e o valor bruto).', 'desconto');
    req(n(d.pagantes) >= 0 && n(d.cortesias) >= 0, 'Pagantes e cortesias não podem ser negativos.', 'pagantes');
    if (id) {
      const frs = db().fatrec.filter((f) => f.receitaId === id);
      const fat = Rules.sum(frs, (f) => f.valorFaturado);
      req(!(d.statusEconomico === 'Prevista' && frs.length), 'Receita com faturamento não pode voltar para "Prevista".', 'statusEconomico');
      req(Rules.valorReceita(d) >= fat, `Valor contratado não pode ser inferior ao já faturado (${fmtBRL(fat)}).`, 'valorUnit');
    }
    return id ? Repo.update('receitas', id, d) : Repo.create('receitas', d);
  }
  async function deleteReceita(id) {
    const k = db().fatrec.filter((f) => f.receitaId === id).length;
    req(k === 0, `Esta receita possui ${k} faturamento(s) vinculado(s). Exclua-os antes para preservar a rastreabilidade.`);
    return Repo.remove('receitas', id);
  }

  async function saveFatrec(d, id) {
    const r = db().receitas.find((x) => x.id === d.receitaId);
    req(r, 'Selecione a receita vinculada.', 'receitaId');
    req(Rules.isContratada(r), 'Apenas receitas contratadas podem ser faturadas.', 'receitaId');
    req(d.parcela && d.parcela.trim(), 'Informe a parcela/etapa.', 'parcela');
    req(d.dataFaturamento, 'Informe a data de faturamento.', 'dataFaturamento');
    req(n(d.valorFaturado) > 0, 'Informe o valor faturado.', 'valorFaturado');
    req(d.vencimento, 'Informe o vencimento.', 'vencimento');
    req(d.vencimento >= d.dataFaturamento, 'O vencimento não pode ser anterior ao faturamento.', 'vencimento');
    const outros = Rules.sum(db().fatrec.filter((f) => f.receitaId === r.id && f.id !== id), (f) => f.valorFaturado);
    const limite = Rules.valorReceita(r) - outros;
    req(n(d.valorFaturado) <= limite, `Faturamento excede o saldo a faturar da receita (${fmtBRL(limite)}).`, 'valorFaturado');
    const rt = n(d.retencaoTributaria), rc = n(d.retencaoContratual);
    req(rt >= 0 && rc >= 0, 'Retenção não pode ser negativa.', 'retencaoTributaria');
    req(rt + rc <= n(d.valorFaturado), 'A soma das retenções não pode exceder o valor faturado.', 'retencaoTributaria');
    req(n(d.retencaoContratualLiberada) >= 0 && n(d.retencaoContratualLiberada) <= rc, 'Retenção contratual liberada não pode exceder a retida.', 'retencaoContratualLiberada');
    req(n(d.valorRecebido) >= 0 && n(d.valorRecebido) <= n(d.valorFaturado), 'Valor recebido não pode exceder o faturado.', 'valorRecebido');
    if (n(d.valorRecebido) > 0) {
      req(d.dataRecebimento, 'Informe a data de recebimento.', 'dataRecebimento');
      req(d.contaId, 'Informe a conta financeira creditada (toda entrada de caixa tem conta).', 'contaId');
      req(db().contas.some((c) => c.id === d.contaId), 'Conta financeira inexistente.', 'contaId');
    }
    if (d.dataRecebimento) req(n(d.valorRecebido) > 0, 'Informe o valor recebido.', 'valorRecebido');
    const row = Object.assign({}, d, { eventoId: r.eventoId });
    return id ? Repo.update('fatrec', id, row) : Repo.create('fatrec', row);
  }
  const deleteFatrec = (id) => Repo.remove('fatrec', id);

  async function saveCusto(d, id) {
    const corp = !d.eventoId;
    req(d.eventoId || d.tipoLancamento === 'Corporativa', 'Lançamento sem evento: marque-o como despesa corporativa.', 'eventoId');
    req(d.centroCusto, 'Informe o centro de custo (obrigatório em todo lançamento).', 'centroCusto');
    if (corp) req(d.competencia, 'Informe a competência econômica da despesa corporativa.', 'competencia');
    if (!corp) req(d.fase, 'Selecione a fase.', 'fase');
    req(d.categoria, 'Selecione a categoria.', 'categoria');
    req(d.descricao && d.descricao.trim(), 'Informe a descrição.', 'descricao');
    req(n(d.qtde) > 0, 'Quantidade deve ser maior que zero.', 'qtde');
    req(n(d.valorUnitPrev) >= 0, 'Valor unitário inválido.', 'valorUnitPrev');
    req(n(d.valorRealizado) >= 0, 'Valor realizado inválido.', 'valorRealizado');
    if (id) {
      const pago = Rules.sum(db().pagamentos.filter((p) => p.custoId === id), (p) => p.valorPago);
      req(n(d.valorRealizado) >= pago, `Valor realizado não pode ser inferior ao já pago (${fmtBRL(pago)}).`, 'valorRealizado');
    }
    return id ? Repo.update('custos', id, d) : Repo.create('custos', d);
  }
  async function deleteCusto(id) {
    const k = db().pagamentos.filter((p) => p.custoId === id).length;
    req(k === 0, `Este custo possui ${k} pagamento(s) vinculado(s). Exclua-os antes para preservar a rastreabilidade.`);
    return Repo.remove('custos', id);
  }

  async function savePagamento(d, id) {
    const c = db().custos.find((x) => x.id === d.custoId);
    req(c, 'Selecione o custo vinculado.', 'custoId');
    req(d.vencimento, 'Informe o vencimento.', 'vencimento');
    req(n(d.valor) > 0, 'Informe o valor do título.', 'valor');
    const outros = db().pagamentos.filter((p) => p.custoId === c.id && p.id !== id);
    const realizado = n(c.valorRealizado);
    const base = realizado > 0 ? realizado : Rules.custoPrevisto(c);
    const progOutros = Rules.sum(outros, (p) => p.valor);
    req(n(d.valor) <= base - progOutros, `Valor programado excede o saldo do custo (${fmtBRL(base - progOutros)}).`, 'valor');
    req(n(d.valorPago) >= 0 && n(d.valorPago) <= n(d.valor), 'Valor pago não pode exceder o valor do título.', 'valorPago');
    if (n(d.valorPago) > 0) {
      req(realizado > 0, 'Registre o valor realizado do custo antes da baixa (CUSTO REALIZADO ≠ PAGO).', 'valorPago');
      req(n(d.valorPago) + Rules.sum(outros, (p) => p.valorPago) <= realizado, 'Total pago excederia o custo realizado.', 'valorPago');
      req(d.dataPagamento, 'Informe a data de pagamento.', 'dataPagamento');
      req(d.contaId, 'Informe a conta financeira debitada (toda saída de caixa tem conta).', 'contaId');
      req(db().contas.some((c) => c.id === d.contaId), 'Conta financeira inexistente.', 'contaId');
    }
    if (d.dataPagamento) req(n(d.valorPago) > 0, 'Informe o valor pago.', 'valorPago');
    const row = Object.assign({}, d, { eventoId: c.eventoId });
    return id ? Repo.update('pagamentos', id, row) : Repo.create('pagamentos', row);
  }
  const deletePagamento = (id) => Repo.remove('pagamentos', id);

  /* ============ v0.2.1 · comissões comerciais ============
     A comissão é gravada como UM lançamento de custo do evento, categoria
     "Comissões comerciais". Não há registro financeiro paralelo: Custos,
     Comissões, Contas a Pagar e Resultado leem o mesmo lançamento.
     Nenhum percentual padrão é presumido; nenhuma receita gera comissão
     automaticamente; o direito só é reconhecido quando declarado. */
  async function saveComissao(d, id) {
    const s = db();
    req(d.eventoId, 'Selecione o evento vinculado.', 'eventoId');
    const ev = s.eventos.find((e) => e.id === d.eventoId);
    req(ev, 'Evento vinculado inexistente.', 'eventoId');
    req(d.vendedor && String(d.vendedor).trim(), 'Informe o vendedor ou beneficiário.', 'vendedor');
    req(d.modalidadeComissao, 'Selecione a forma de cálculo.', 'modalidadeComissao');
    req(d.competencia, 'Informe a data de referência da comissão.', 'competencia');
    // v0.2.2 · a condição de aquisição é opcional: sem definição da Diretoria, nenhuma é imposta

    let previsto;
    if (d.modalidadeComissao === 'Percentual') {
      req(d.baseComissao, 'Selecione a base de cálculo.', 'baseComissao');
      req(n(d.percentual) > 0 && n(d.percentual) <= 100, 'Informe um percentual maior que zero e até 100.', 'percentual');
      const base = d.baseComissao === 'Valor informado'
        ? n(d.baseValor)
        : Rules.baseComissao(d.baseComissao, ev, s, d.baseValor);
      req(base > 0, 'A base de cálculo escolhida está zerada neste evento. Escolha outra base ou use valor fixo.', 'baseComissao');
      d.baseValor = base;
      previsto = Math.round((base * n(d.percentual)) / 100);
    } else {
      req(n(d.valorUnitPrev) > 0, 'Informe o valor da comissão.', 'valorUnitPrev');
      previsto = n(d.valorUnitPrev);
      d.baseValor = 0; d.percentual = 0; d.baseComissao = 'Valor informado';
    }
    const apurado = previsto + n(d.ajuste);
    req(apurado >= 0, 'O ajuste não pode tornar a comissão negativa.', 'ajuste');
    if (n(d.ajuste) !== 0) req(d.ajusteMotivo && String(d.ajusteMotivo).trim(), 'Justifique o ajuste da comissão.', 'ajusteMotivo');

    const devida = d.devida === true || d.devida === 'true';
    // v0.2.2 · integridade financeira após alterações
    if (id) {
      const titulos = s.pagamentos.filter((p) => p.custoId === id);
      const pago = Rules.sum(titulos, (p) => p.valorPago);
      const programado = Rules.sum(titulos, (p) => p.valor);
      if (pago > 0) {
        req(devida, 'Esta comissão já teve pagamento registrado: não é possível voltar a situação para "prevista". Estorne o pagamento antes.', 'devida');
        req(apurado >= pago, `O valor da comissão não pode ficar abaixo do que já foi pago (${fmtBRL(pago)}). Ajuste ou estorne o pagamento antes.`, d.modalidadeComissao === 'Percentual' ? 'percentual' : 'valorUnitPrev');
      }
      const limite = devida ? apurado : previsto;
      req(programado <= limite, `Esta comissão possui ${fmtBRL(programado)} já programados em contas a pagar, acima do novo valor (${fmtBRL(limite)}). Ajuste ou exclua os títulos antes de reduzir a comissão.`, d.modalidadeComissao === 'Percentual' ? 'percentual' : 'valorUnitPrev');
    }
    const row = Object.assign({}, d, {
      tipoLancamento: 'Evento', origemLancamento: 'Comissão', categoria: PARAMS.CAT_COMISSAO,
      centroCusto: d.centroCusto || 'COM', compartilhada: false, qtde: 1,
      subcategoria: d.subcategoria || 'Comissão de venda',
      descricao: 'Comissão · ' + String(d.vendedor).trim(),
      fornecedor: String(d.vendedor).trim(),
      natureza: 'Direto', comportamento: 'Variável', driver: 'Receita', unidade: 'serviço',
      fase: d.fase || 'Pré-evento',
      valorUnitPrev: previsto,
      valorRealizado: devida ? apurado : 0,
      devida,
      dataAquisicao: devida ? (d.dataAquisicao || Rules.todayISO()) : '',
      dataPrevista: d.dataPrevista || d.competencia,
    });
    return id ? Repo.update('custos', id, row) : Repo.create('custos', row);
  }
  async function deleteComissao(id) {
    const titulos = db().pagamentos.filter((p) => p.custoId === id);
    const pago = Rules.sum(titulos, (p) => p.valorPago);
    req(titulos.length === 0,
      pago > 0
        ? `Esta comissão possui ${titulos.length} título(s) em contas a pagar, com ${fmtBRL(pago)} já pago(s). Estorne o pagamento e exclua os títulos antes, para não deixar lançamento órfão.`
        : `Esta comissão possui ${titulos.length} título(s) em contas a pagar. Exclua os títulos antes, para não deixar lançamento órfão.`);
    return Repo.remove('custos', id);
  }

  /* ============ v0.2 · contas, movimentos, orçamento, fechamento ============ */
  async function saveConta(d, id) {
    req(d.nome && d.nome.trim(), 'Informe o nome da conta.', 'nome');
    req(d.tipo, 'Selecione o tipo de conta.', 'tipo');
    req(Number.isInteger(n(d.saldoInicial)), 'Saldo inicial inválido.', 'saldoInicial');
    req(d.dataSaldoInicial, 'Informe a data do saldo inicial.', 'dataSaldoInicial');
    return id ? Repo.update('contas', id, d) : Repo.create('contas', d);
  }
  async function deleteConta(id) {
    const s = db();
    const k = s.fatrec.filter((f) => f.contaId === id).length + s.pagamentos.filter((p) => p.contaId === id).length
      + s.movimentos.filter((m) => m.contaId === id || m.contaDestinoId === id).length;
    req(k === 0, `Esta conta possui ${k} movimentação(ões) vinculada(s). Inative-a em vez de excluí-la.`);
    return Repo.remove('contas', id);
  }
  /** Movimento avulso ou transferência interna.
      Transferência NÃO gera receita nem despesa — apenas desloca saldo entre contas. */
  async function saveMovimento(d, id) {
    req(d.data, 'Informe a data da movimentação.', 'data');
    req(d.tipo, 'Selecione o tipo de movimentação.', 'tipo');
    req(d.contaId, 'Selecione a conta de origem.', 'contaId');
    req(db().contas.some((c) => c.id === d.contaId), 'Conta de origem inexistente.', 'contaId');
    req(d.descricao && d.descricao.trim(), 'Informe a descrição.', 'descricao');
    if (d.tipo === 'Transferência') {
      req(n(d.valor) > 0, 'Informe um valor positivo para a transferência.', 'valor');
      req(d.contaDestinoId, 'Selecione a conta de destino.', 'contaDestinoId');
      req(d.contaDestinoId !== d.contaId, 'A conta de destino deve ser diferente da origem.', 'contaDestinoId');
      req(db().contas.some((c) => c.id === d.contaDestinoId), 'Conta de destino inexistente.', 'contaDestinoId');
      const saldo = Rules.saldosPorConta(db()).find((x) => x.conta.id === d.contaId);
      req(!saldo || saldo.saldo - n(d.valor) >= 0 || d.permitirNegativo, 'A transferência deixaria a conta de origem com saldo negativo.', 'valor');
    } else {
      req(n(d.valor) !== 0, 'Informe o valor (positivo para entrada, negativo para saída).', 'valor');
      req(!d.contaDestinoId, 'Conta de destino só se aplica a transferências.', 'contaDestinoId');
    }
    const row = Object.assign({}, d);
    if (row.tipo !== 'Transferência') row.contaDestinoId = '';
    return id ? Repo.update('movimentos', id, row) : Repo.create('movimentos', row);
  }
  const deleteMovimento = (id) => Repo.remove('movimentos', id);

  async function saveOrcamento(d, id) {
    req(d.exercicio, 'Informe o exercício.', 'exercicio');
    req(d.mes, 'Informe o mês de competência.', 'mes');
    req(d.centroCusto, 'Selecione o centro de custo.', 'centroCusto');
    req(d.categoria && d.categoria.trim(), 'Informe a categoria orçamentária.', 'categoria');
    req(d.tipo, 'Selecione o tipo (receita ou despesa).', 'tipo');
    req(n(d.valorOrcado) > 0, 'Informe o valor orçado.', 'valorOrcado');

/* ---------- Tooltip (delegado) ---------- */
(() => {
  let tip;
  const show = (t) => {
    const txt = t.getAttribute('data-tip'); if (!txt) return;
    tip = tip || Object.assign(document.createElement('div'), { className: 'tip' });
    document.body.appendChild(tip);
    tip.textContent = txt;
    const r = t.getBoundingClientRect();
    const w = Math.min(280, tip.offsetWidth);
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    let top = r.top - tip.offsetHeight - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
    requestAnimationFrame(() => tip.classList.add('show'));
  };
  const hide = () => tip && tip.classList.remove('show');
  document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) show(t); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hide(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest('[data-tip]'); if (t) show(t); });
  document.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

/* ---------- Menu contextual ---------- */
let _menu = null;

function openMenu(anchor, items) {
  closeMenu();

  items.forEach((it) => {
    if (it === '-') { m.appendChild(document.createElement('hr')); return; }
    if (it.header) { const h = document.createElement('div'); h.className = 'mh'; h.textContent = it.header; m.appendChild(h); return; }
    const b = document.createElement('button');

    b.innerHTML = `${icon(it.icon || 'dot', 'sm')}<span>${esc(it.label)}</span>`;
    b.onclick = (e) => { e.stopPropagation(); closeMenu(); it.action(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  let left = r.right - m.offsetWidth; if (left < 8) left = r.left;
  let top = r.bottom + 6; if (top + m.offsetHeight > window.innerHeight - 8) top = r.top - m.offsetHeight - 6;
  m.style.left = Math.max(8, left) + 'px'; m.style.top = Math.max(8, top) + 'px';
  _menu = m;
  setTimeout(() => { const f = m.querySelector('button'); f && f.focus(); }, 0);
}
document.addEventListener('click', (e) => { if (_menu && !e.target.closest('.menu')) closeMenu(); });

/* ---------- Overlay (modal / drawer) ---------- */
const Overlay = (() => {
  const stack = [];

    box.innerHTML = `
      <div class="ov-head"><div>${eyebrow ? `<div class="oh-eyebrow">${eyebrow}</div>` : ''}<h3>${esc(title)}</h3>${sub ? `<div class="oh-sub">${sub}</div>` : ''}</div>
      <button class="btn btn-ghost btn-icon" data-close aria-label="Fechar">${icon('x')}</button></div>
      <div class="ov-slot"></div>
      ${foot !== null ? `<div class="ov-foot">${foot}</div>` : ''}`;
    const slot = box.querySelector('.ov-slot');
    if (typeof body === 'string') { slot.outerHTML = `<div class="ov-body">${body}</div>`; } else { slot.replaceWith(body); }

      const i = stack.indexOf(ctx); if (i >= 0) stack.splice(i, 1);
      prevFocus && prevFocus.focus && prevFocus.focus();

    }
    ov.onclick = () => close();
    box.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => close()));
    stack.push(ctx);
    requestAnimationFrame(() => { ov.classList.add('show'); box.classList.add('show'); });
    setTimeout(() => { const f = box.querySelector('.ov-body input, .ov-body select, .wpanel input, .wpanel select, [data-autofocus]'); f && f.focus(); }, 280);
    return ctx;
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && stack.length && !_menu) stack[stack.length - 1].close();
    if (e.key === 'Tab' && stack.length) {
      const box = stack[stack.length - 1].box;
      const f = $$('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])', box).filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  return { open, get depth() { return stack.length; } };
})();

function confirmDialog({ title, message, confirmLabel = 'Confirmar', danger = false }) {

      onClose: () => resolve(done),
    });
    ctx.box.querySelector('[data-ok]').onclick = () => { done = true; ctx.close(); };
  });
}

/* ---------- Motor de formulários contextuais ---------- */
class FormEngine {
  /** schema: [{key,label,type,span,required,show,options,help,compute,placeholder}|{group}|{note}|{details,items}] */
  constructor(el, schema, values, opts = {}) {
    this.el = el; this.schema = schema; this.v = values; this.opts = opts; this.errors = {};
    el.addEventListener('input', (e) => this._onInput(e));
    el.addEventListener('change', (e) => this._onChange(e));
    el.addEventListener('click', (e) => { const sm = e.target.closest('summary'); if (sm) { const d = sm.parentElement; this._open[d.dataset.d] = !d.open; } this._onClick(e); });
    el.addEventListener('toggle', (e) => { if (e.target.matches('details')) this._open[e.target.dataset.d] = e.target.open; }, true);
    this._open = {};
    this.render();
  }
  _vis(f) { return !f.show || f.show(this.v); }
  _req(f) { return typeof f.required === 'function' ? f.required(this.v) : !!f.required; }
  _opts(f) { return typeof f.options === 'function' ? f.options(this.v) : f.options || []; }
  _field(f) {
    const val = this.v[f.key];
    const id = 'f_' + f.key;
    const lab = `<label for="${id}">${esc(f.label)}${this._req(f) ? ' <span class="req" aria-hidden="true">*</span>' : (f.optional ? ' <span class="opt">(opcional)</span>' : '')}${f.tip ? ' ' + info(f.tip) : ''}</label>`;
    let ctl = '';
    const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
    switch (f.type) {
      case 'select': {
        const ops = this._opts(f);
        const groups = ops.length && ops[0] && ops[0].group !== undefined;
        const optHtml = (o) => { const vv = typeof o === 'object' ? o.value : o; const ll = typeof o === 'object' ? o.label : o; return `<option value="${esc(vv)}" ${String(vv) === String(val ?? '') ? 'selected' : ''}>${esc(ll)}</option>`; };
        let inner = `<option value="">${esc(f.placeholder || 'Selecione…')}</option>`;
        if (groups) inner += ops.map((g) => `<optgroup label="${esc(g.group)}">${g.items.map(optHtml).join('')}</optgroup>`).join('');
        else inner += ops.map(optHtml).join('');
        ctl = `<select id="${id}" data-k="${f.key}">${inner}</select>`;
        break;
      }
      case 'chips': {
        ctl = `<div class="chips-choice" role="radiogroup" aria-label="${esc(f.label)}">${this._opts(f).map((o) => {
          const vv = typeof o === 'object' ? o.value : o; const ll = typeof o === 'object' ? o.label : o;
          const dot = o.vc ? `<span class="dot ${o.vc}"></span>` : (o.icon ? icon(o.icon, 'sm') : '');
          return `<button type="button" role="radio" aria-checked="${vv === val}" class="${vv === val ? 'on' : ''}" data-chip="${f.key}" data-val="${esc(vv)}">${dot}${esc(ll)}</button>`;
        }).join('')}</div>`;
        break;
      }
      case 'textarea': ctl = `<textarea id="${id}" data-k="${f.key}"${ph}>${esc(val || '')}</textarea>`; break;
      case 'money': ctl = `<div class="money"><input id="${id}" data-k="${f.key}" data-money inputmode="decimal" autocomplete="off" value="${val ? esc(_num.format(reais(val))) : ''}" placeholder="0,00"></div>`; break;
      case 'number': ctl = `<input id="${id}" data-k="${f.key}" data-num type="number" inputmode="numeric" min="${f.min ?? 0}" step="${f.step || 1}" value="${val ?? ''}"${ph}>`; break;
      case 'date': ctl = `<input id="${id}" data-k="${f.key}" type="date" value="${esc(val || '')}">`; break;
      case 'computed': ctl = `<div class="computed ${f.align === 'left' ? 'left' : ''}" data-computed="${f.key}" aria-live="polite">${f.compute(this.v)}</div>`; break;
      case 'datalist': ctl = `<input id="${id}" data-k="${f.key}" list="${id}_dl" value="${esc(val || '')}" autocomplete="off"${ph}><datalist id="${id}_dl">${this._opts(f).map((o) => `<option value="${esc(o)}">`).join('')}</datalist>`; break;
      default: ctl = `<input id="${id}" data-k="${f.key}" type="text" value="${esc(val || '')}" autocomplete="off"${ph}>`;
    }
    const inv = this.errors[f.key];
    return `<div class="fld ${f.span ? 's' + f.span : ''} ${inv ? 'invalid' : ''}" data-f="${f.key}">${lab}${ctl}${f.help ? `<div class="help">${typeof f.help === 'function' ? f.help(this.v) : f.help}</div>` : ''}<div class="err" role="alert">${esc(inv || '')}</div></div>`;
  }
  _items(items) {
    return items.map((f, i) => {
      if (f.group) return (!f.show || f.show(this.v)) ? `<div class="fgroup"><span>${esc(f.group)}</span></div>` : '';
      if (f.note) { const h = f.note(this.v); return h ? `<div class="ctx-note ${f.kind || ''}">${icon(f.icon || 'info', 'sm')}<div>${h}</div></div>` : ''; }
      if (f.html) { const h = f.html(this.v); return h || ''; }
      if (f.details) {
        if (f.show && !f.show(this.v)) return '';
        const k = 'd' + i; const open = this._open[k] ?? !!f.open;
        return `<details class="details" data-d="${k}" ${open ? 'open' : ''}><summary>${icon('chevR', 'sm').replace('class="i sm"', 'class="i sm chev"')}${esc(f.details)}<span class="opt">${esc(f.hint || '')}</span></summary><div class="form">${this._items(f.items)}</div></details>`;
      }
      return this._vis(f) ? this._field(f) : '';
    }).join('');
  }
  render() {
    const active = document.activeElement && this.el.contains(document.activeElement) ? document.activeElement.getAttribute('data-k') || document.activeElement.getAttribute('data-chip') : null;
    this.el.innerHTML = `<div class="form">${this.formError ? `<div class="form-error">${icon('alert', 'sm')}${esc(this.formError)}</div>` : ''}${this._items(this.schema)}</div>`;
    if (active) { const a = this.el.querySelector(`[data-k="${active}"]`) || this.el.querySelector(`[data-chip="${active}"].on`); a && a.focus(); }
  }
  refreshComputed() {
    const walk = (items) => items.forEach((f) => { if (f.items) walk(f.items); if (f.type === 'computed') { const c = this.el.querySelector(`[data-computed="${f.key}"]`); if (c) c.innerHTML = f.compute(this.v); } });
    walk(this.schema);
    $$('.help', this.el).forEach(() => {});
  }
  _set(k, val) {
    this.v[k] = val;
    if (this.errors[k]) { delete this.errors[k]; const fl = this.el.querySelector(`[data-f="${k}"]`); fl && fl.classList.remove('invalid'); }
    this.opts.onChange && this.opts.onChange(k, this.v, this);
  }
  _onInput(e) {
    const t = e.target; const k = t.getAttribute('data-k'); if (!k) return;
    let val = t.value;
    if (t.hasAttribute('data-money')) val = Math.round(parseNum(val) * CENTS);
    else if (t.hasAttribute('data-num')) val = t.value === '' ? '' : Number(t.value);
    this._set(k, val);
    this.refreshComputed();
  }
  _onChange(e) {
    const t = e.target; const k = t.getAttribute('data-k'); if (!k) return;
    if (t.hasAttribute('data-money')) { const v = parseNum(t.value); t.value = v ? _num.format(v) : ''; return; }  // exibição em reais
    if (t.tagName === 'SELECT' || t.type === 'date') { this._set(k, t.value); this.render(); }
  }
  _onClick(e) {
    const b = e.target.closest('[data-chip]'); if (!b) return;
    this._set(b.dataset.chip, b.dataset.val); this.render();
    const nb = this.el.querySelector(`[data-chip="${b.dataset.chip}"].on`); nb && nb.focus();
  }
  showError(err) {
    this.errors = {}; this.formError = '';
    if (err && err.field) this.errors[err.field] = err.message; else if (err) this.formError = err.message;
    this.render();
    const fl = this.el.querySelector('.fld.invalid');
    if (fl) {
      const d = fl.closest('details'); if (d) { d.open = true; this._open[d.dataset.d] = true; }
      const inv = fl.querySelector('input, select, textarea, button'); inv && inv.focus();
      fl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else if (err && err.field) {
      // campo oculto em "Mais detalhes" ou não visível → exibe no topo
      this.formError = err.message; this.render();
    }
  }
}

/* =====================================================================
   CAMADA DE VISUALIZAÇÃO · Chart.js com tokens NTC
   ===================================================================== */
const C = {
  azul: '#1A4372', azul2: '#6F8DB3', azul3: '#B7C7DC', azul4: '#DCE4EE',
  verde: '#37661C', verde2: '#8FAE7B', vermelho: '#8E2A1C', vermelho2: '#C98A80',
  grafite: '#3A4050', prata: '#A8ACB6', dourado: '#B8952E', tinta: '#14202E',
};
const Charts = (() => {
  const live = new Set();
  const available = () => typeof window.Chart !== 'undefined';
  if (available()) {
    Chart.defaults.font.family = "'Barlow', 'Segoe UI', system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#3A4050';
    Chart.defaults.borderColor = 'rgba(168,172,182,.28)';
    Chart.defaults.animation.duration = 500;
    Chart.defaults.plugins.legend.display = false;
    Object.assign(Chart.defaults.plugins.tooltip, {
      backgroundColor: '#0B1726', titleColor: '#F2F0EA', bodyColor: '#F2F0EA', padding: 10, cornerRadius: 3,
      titleFont: { weight: '600' }, boxPadding: 4, usePointStyle: true,
    });
  }
  const compact = (cts) => {
    const v = Number(cts || 0) / 100;   // valores chegam em centavos
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
    if (a >= 1e3) return (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
    return v.toLocaleString('pt-BR');
  };
  const moneyTip = { callbacks: { label: (c) => ` ${c.dataset.label || c.label}: ${fmtBRL(c.parsed.y ?? c.parsed.x ?? c.parsed, { dash: false })}` } };

  function mount(el, cfg) {
    if (!el) return null;
    if (!available()) { el.innerHTML = '<div class="empty" style="padding:24px"><p>Biblioteca de gráficos indisponível neste ambiente.</p></div>'; return null; }
    el.innerHTML = '<canvas role="img"></canvas>';
    const cv = el.querySelector('canvas');
    if (cfg.aria) cv.setAttribute('aria-label', cfg.aria);
    const ch = new Chart(cv, cfg);
    live.add(ch);
    return ch;
  }
  function destroyAll() { live.forEach((c) => c.destroy()); live.clear(); }

  function bars(el, { labels, datasets, horizontal = false, stacked = false, aria, money = true, maxBar = 34 }) {
    const idx = horizontal ? 'y' : 'x';
    return mount(el, {
      type: 'bar', aria,
      data: { labels, datasets: datasets.map((d) => ({ borderRadius: 2, maxBarThickness: maxBar, categoryPercentage: .72, barPercentage: .86, ...d, backgroundColor: d.color, borderColor: d.color })) },
      options: {
        indexAxis: idx, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          tooltip: money ? { callbacks: { label: (c) => ` ${c.dataset.label}: ${fmtBRL(horizontal ? c.parsed.x : c.parsed.y, { dash: false })}` } } : {},
        },
        scales: {
          [horizontal ? 'y' : 'x']: { stacked, grid: { display: false }, border: { color: 'rgba(168,172,182,.5)' }, ticks: { autoSkip: false, maxRotation: 0, font: { size: 11.5 } } },
          [horizontal ? 'x' : 'y']: { stacked, beginAtZero: true, grid: { color: 'rgba(168,172,182,.2)' }, border: { display: false }, ticks: { callback: (v) => (money ? compact(v) : v), maxTicksLimit: 6 } },
        },
      },
    });
  }
  function combo(el, { labels, bars: bs, lines, aria }) {
    return mount(el, {
      type: 'bar', aria,
      data: {
        labels,
        datasets: [
          ...bs.map((d) => ({ type: 'bar', borderRadius: 2, maxBarThickness: 22, categoryPercentage: .7, barPercentage: .9, ...d, backgroundColor: d.color, order: 2 })),
          ...lines.map((d) => ({ type: 'line', tension: .3, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2, ...d, borderColor: d.color, backgroundColor: d.color, order: 1, borderDash: d.dash || [] })),
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${fmtBRL(c.parsed.y, { dash: false })}` } } },
        scales: {
          x: { grid: { display: false }, border: { color: 'rgba(168,172,182,.5)' } },
          y: { beginAtZero: true, grid: { color: 'rgba(168,172,182,.2)' }, border: { display: false }, ticks: { callback: compact, maxTicksLimit: 6 } },
        },
      },
    });
  }
  function doughnut(el, { labels, data, colors, aria }) {
    const total = data.reduce((a, b) => a + b, 0);
    return mount(el, {
      type: 'doughnut', aria,
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: { tooltip: { callbacks: { label: (c) => ` ${c.label}: ${fmtBRL(c.parsed, { dash: false })} · ${fmtPct(total ? c.parsed / total : 0)}` } } },
      },
    });
  }
  return { bars, combo, doughnut, destroyAll, compact, available };
})();
