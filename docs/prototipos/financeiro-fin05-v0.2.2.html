function bindGlobalSearch() {
  const inp = $('#gsearch'), box = $('#gresults');
  let hl = 0, items = [];
  const draw = () => {
    const q = inp.value.trim();
    if (!q) { box.classList.remove('open'); return; }
    items = Repo.snapshot().eventos.filter((e) => Rules.matchEvent(e, { q })).slice(0, 7);
    box.innerHTML = items.length
      ? items.map((e, i) => `<a href="#/eventos/${e.id}" class="${i === hl ? 'hl' : ''}" role="option"><span class="gid">${e.id}</span><span style="min-width:0"><div class="gname">${esc(e.nome)}</div><div style="font-size:12px;color:var(--prata)">${esc(e.vertical)} · ${esc(tipoShort(e.tipo))} · ${fmtDate(e.dataInicio)}</div></span></a>`).join('')
        + `<a href="#/eventos" data-all style="border-top:1px solid var(--line-soft);margin-top:4px;color:var(--azul);font-weight:600;font-size:13px">${icon('search', 'xs')} Ver todos os resultados para “${esc(q)}”</a>`
      : `<div class="empty-mini">Nenhum evento encontrado para “${esc(q)}”.</div>`;
    box.classList.add('open');
    const all = box.querySelector('[data-all]');
    if (all) all.onclick = () => { UI.events.q = q; };
  };
  inp.addEventListener('input', () => { hl = 0; draw(); });
  inp.addEventListener('focus', draw);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { hl = Math.min(hl + 1, items.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter') {
      if (items[hl]) location.hash = `#/eventos/${items[hl].id}`;
      else { UI.events.q = inp.value.trim(); location.hash = '#/eventos'; }
      inp.value = ''; box.classList.remove('open'); inp.blur();
    }
    if (e.key === 'Escape') { inp.value = ''; box.classList.remove('open'); inp.blur(); }
  });
  box.addEventListener('click', () => { setTimeout(() => { inp.value = ''; box.classList.remove('open'); }, 0); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.gsearch')) box.classList.remove('open'); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (getComputedStyle($('.gsearch')).display === 'none') location.hash = '#/eventos'; else inp.focus(); }
  });
}

  }
  async function render(opts = {}) {

    const sameView = key === current;

    closeMenu();

    const navKey = root === 'configuracoes' ? 'administracao' : (root || 'visao-geral');

      else if (root === 'administracao' || root === 'configuracoes') await Views.config(view);
      else { location.hash = '#/visao-geral'; return; }

      console.error(err);

    if (!sameView && !opts.keepScroll) { window.scrollTo(0, 0); view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter'); }
  }
  window.addEventListener('hashchange', () => render());
  return { render, refresh: () => render({ keepScroll: true }), parse };
})();

/** Série mensal de caixa (faturado/recebido/pago) para um conjunto de eventos */
function cashSeries(db, evIds) {
  const map = {};
  const bump = (d, k, v) => { if (!d || !v) return; const ym = d.slice(0, 7); (map[ym] = map[ym] || { fat: 0, rec: 0, pag: 0 })[k] += Number(v); };
  db.fatrec.filter((f) => evIds.has(f.eventoId)).forEach((f) => { bump(f.dataFaturamento, 'fat', f.valorFaturado); bump(f.dataRecebimento, 'rec', f.valorRecebido); });
  db.pagamentos.filter((p) => evIds.has(p.eventoId)).forEach((p) => bump(p.dataPagamento, 'pag', p.valorPago));
  const keys = Object.keys(map).sort();
  if (!keys.length) return { labels: [], fat: [], rec: [], pag: [] };
  // preenche meses intermediários
  const all = []; let [y, m] = keys[0].split('-').map(Number); const [ly, lm] = keys[keys.length - 1].split('-').map(Number);
  while (y < ly || (y === ly && m <= lm)) { all.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
  return { labels: all.map(monthLabel), fat: all.map((k) => map[k]?.fat || 0), rec: all.map((k) => map[k]?.rec || 0), pag: all.map((k) => map[k]?.pag || 0) };
}
function groupCosts(db, evIds, key) {
  const g = {};
  db.custos.filter((c) => evIds.has(c.eventoId)).forEach((c) => {
    const k = c[key] || '—'; const f = Rules.custoFin(c, db);
    const o = (g[k] = g[k] || { k, previsto: 0, realizado: 0, pago: 0, aPagar: 0, n: 0, prevRealizados: 0 });
    o.previsto += f.previsto; o.realizado += f.realizado; o.pago += f.pago; o.aPagar += f.aPagar; o.n++;
    if (f.realizado > 0) o.prevRealizados += f.previsto;
  });
  return Object.values(g);
}

          <span class="rbar"></span>

    const rs = rows.filter((r) => r.ev.vertical === v);
    return { v, fat: Rules.sum(rs, (r) => r.m.faturada), cus: Rules.sum(rs, (r) => r.m.realizado), res: Rules.sum(rs, (r) => r.m.resultado) };

      { label: 'Resultado', data: byV.map((x) => x.res), color: C.verde },

  });

    lines: [{ label: 'Pago', data: cs.pag, color: C.vermelho }],
  });

  Charts.bars($('#chCat'), {

    datasets: [{ label: 'Orçado', data: cats.map((c) => c.previsto), color: C.azul3 }, { label: 'Realizado', data: cats.map((c) => c.realizado), color: C.azul }],
  });
};

function funnelRow(label, v, max, color, note) {
  const w = max > 0 ? (v / max) * 100 : 0;
  return `<div class="funnel-row"><div class="fr-top"><span class="frl">${esc(label)}</span><span class="frv num">${fmtBRL(v)}</span></div>
    <div class="fr-bar"><i style="width:${w.toFixed(1)}%;background:${color}"></i></div>${note ? `<div class="fr-note">${esc(note)}</div>` : ''}</div>`;
}
const PHASE_COLORS = { 'Pré-evento': C.azul3, 'Execução': C.azul, 'Pós-evento': C.azul2, 'Estrutura compartilhada': C.prata };
function phaseDonut(el, groups) {
  const gs = PARAMS.fases.map((f) => groups.find((g) => g.k === f)).filter((g) => g && g.realizado > 0);
  const total = gs.reduce((a, g) => a + g.realizado, 0);
  if (!total) { el.innerHTML = `<div class="empty" style="padding:30px"><p>Sem custos realizados no recorte.</p></div>`; return; }
  el.innerHTML = `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:center">
    <div class="chart-box short" id="chPhase" style="height:200px"></div>
    <div>${gs.map((g) => `<div class="cline"><span class="cl"><i style="width:10px;height:10px;border-radius:2px;background:${PHASE_COLORS[g.k]};display:inline-block"></i>${esc(g.k)}</span><span class="cv num">${fmtPct(g.realizado / total, 0)}</span></div>`).join('')}
    <div class="cline total"><span class="cl">Total realizado</span><span class="cv num">${fmtBRL(total)}</span></div></div></div>`;
  Charts.doughnut($('#chPhase', el), { labels: gs.map((g) => g.k), data: gs.map((g) => g.realizado), colors: gs.map((g) => PHASE_COLORS[g.k]), aria: 'Composição do custo realizado por fase' });
}
function recentEvents(evs) {
  const t = Rules.todayISO();
  const dist = (e) => Math.abs(new Date(e.dataInicio) - new Date(t));
  return [...evs].sort((a, b) => dist(a) - dist(b));
}

Views.events = async function (view) {
  setCrumbs([['Visão Executiva', '#/visao-geral'], ['Eventos e Projetos', '#/eventos']]);
  const S = UI.events; const keys = ['status', 'modalidade', 'periodo', 'tipo'];
  const db = Repo.snapshot();
  const base = db.eventos.filter((e) => Rules.matchEvent(e, { ...S, vertical: 'all' }));
  let list = base.filter((e) => S.vertical === 'all' || e.vertical === S.vertical);
  const [sk, sd] = S.sort.split('-');

    </div>
  </div>
  <div class="filterbar">
    <div class="search-in">${icon('search', 'sm')}<input id="eSearch" type="search" placeholder="Buscar por nome, ID, programa, órgão, cidade…" value="${esc(S.q)}" aria-label="Buscar eventos"></div>

    ${anyFilter(S, keys) ? `<button class="btn btn-ghost btn-sm" data-clear-filters>${icon('x', 'xs')}Limpar</button>` : ''}

    <span class="muted" style="font-size:12.5px"><b class="num" style="color:var(--tinta)">${list.length}</b> evento(s)</span>
    <div class="fsel"><span class="fcap">Ordenar</span><select id="eSort" aria-label="Ordenar">

    </select></div>
    <div class="seg" role="group" aria-label="Visualização">
      <button class="${S.view === 'cards' ? 'on' : ''}" data-view="cards" aria-pressed="${S.view === 'cards'}">${icon('cards', 'sm')}Cards</button>
      <button class="${S.view === 'lista' ? 'on' : ''}" data-view="lista" aria-pressed="${S.view === 'lista'}">${icon('list', 'sm')}Lista</button>
    </div>
  </div>
  <div id="eList"></div>`;

  const box = $('#eList');
  if (!list.length) {
    box.innerHTML = `<div class="card"><div class="empty"><div class="e-icon">${icon('search')}</div><h4>Nenhum evento encontrado</h4><p>Revise a busca e os filtros, ou cadastre um novo evento.</p>
      <div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-secondary" data-clear-filters>Limpar filtros</button><button class="btn btn-primary" data-new>${icon('plus', 'sm')}Novo evento</button></div></div></div>`;
  } else if (S.view === 'cards') {
    box.innerHTML = `<div class="ev-grid">${list.map((e) => eventCard(e, alertCount[e.id])).join('')}
      <button class="ev-card new-card" data-new>${icon('plus')}<div style="font-weight:600;margin-top:8px">Novo evento</div><div class="muted" style="font-size:12.5px">Cadastro em 4 etapas</div></button></div>`;
  } else {
    const th = (k, l, cls = '') => `<th class="${cls}"><button class="linkbtn" style="color:inherit;font:inherit;letter-spacing:inherit" data-sort="${k}">${l}${sk === k ? icon(sd === 'desc' ? 'chevD' : 'chevD', 'xs').replace('class="i xs"', `class="i xs" style="transform:${sd === 'asc' ? 'rotate(180deg)' : 'none'}"`) : ''}</button></th>`;
    box.innerHTML = `<div class="card"><div class="table-wrap"><table class="t">

function eventCard(e, alerts) {
  const prog = [e.programa, e.modulo].filter(Boolean).join(' · ');
  return `<article class="ev-card ${VCLASS[e.vertical]}" role="link" tabindex="0" data-go="#/eventos/${e.id}" aria-label="${esc(e.nome)}">

    <h4>${esc(e.nome)}</h4>
    <div class="ec-prog">${esc(tipoShort(e.tipo))}${prog ? ' · ' + esc(prog) : ''}</div>
    <div class="ec-meta">
      <div>${icon('calendar', 'sm')}<span class="num">${fmtRange(e.dataInicio, e.dataFim)}</span></div>
      <div>${icon(MOD_ICON[e.modalidade], 'sm')}<span>${esc(e.modalidade)}</span></div>
      <div style="grid-column:span 2">${icon('pin', 'sm')}<span>${esc(e.modalidade === 'Online ao vivo' ? 'Transmissão online · ' : (e.local ? e.local + ' · ' : ''))}${esc(e.cidade)}/${esc(e.uf)}</span></div>
    </div>
    <div class="ec-foot">${badgeOp(e.status)}${alerts && alerts.length ? `&nbsp;<span class="alert-dot" data-tip="${alerts.length} pendência(s) financeira(s)">${icon('alert', 'xs')}${alerts.length}</span>` : ''}
      <span class="ec-go">Ver evento ${icon('arrowR', 'sm')}</span></div>
  </article>`;
}

function eventMenu(anchor, id) {
  openMenu(anchor, [
    { label: 'Abrir evento', icon: 'arrowR', action: () => (location.hash = `#/eventos/${id}`) },
    { label: 'Editar cadastro', icon: 'edit', action: async () => openEventWizard(await Repo.get('eventos', id)) },
    '-',
    { label: 'Excluir evento', icon: 'trash', danger: true, action: () => deleteEventFlow(id) },
  ]);
}
async function deleteEventFlow(id, after) {
  const ev = await Repo.get('eventos', id);
  const d = Service.dependents(id);
  const tot = d.receitas + d.fatrec + d.custos + d.pagamentos;
  const ok = await confirmDialog({
    title: 'Excluir evento?', danger: true, confirmLabel: 'Excluir evento',
    message: `<b>${esc(ev.id)} · ${esc(ev.nome)}</b><br><br>${tot ? `Serão excluídos também os lançamentos vinculados por <b>ID_EVENTO</b>: ${d.receitas} receita(s), ${d.fatrec} faturamento(s)/recebimento(s), ${d.custos} custo(s) e ${d.pagamentos} pagamento(s).` : 'O evento não possui lançamentos vinculados.'}<br><br><span class="muted">Protótipo sem persistência — a exclusão vale apenas para esta sessão.</span>`,
  });
  if (!ok) return;
  await Service.deleteEvento(id);
  toast('Evento excluído', `${ev.id} · ${ev.nome}`);
  if (after) after(); else Router.refresh();
}

/* ---------- Wizard de cadastro/edição ---------- */
const TIPO_NOTES = {
  'Evento aberto': 'Evento aberto: receita por <b>inscrição</b> (quantidade × valor unitário), com <b>pagantes</b> e <b>cortesias</b>. Os múltiplos órgãos/clientes são registrados na aba <b>Receitas</b> do evento.',
  'In Company / Projeto B2G': 'In Company / B2G: <b>órgão/cliente principal</b> obrigatório; receita por <b>valor global</b>, <b>parcelas</b> ou <b>faturamento por etapa/módulo</b>. Informe a referência contratual na etapa 4.',
  'Programa': 'Programa: composto por vários módulos; consolida módulos e custos do programa.',
  'Módulo': 'Módulo: unidade independente de execução, vinculada a um programa.',
  'Evento avulso': 'Evento avulso: sem programa obrigatório.',
};
const catsFor = (mod) => PARAMS.categorias.filter((c) => modalidadeKeys(mod).some((k) => c.mod.includes(k)) && !(c.mod.length === 2 && false));
function modalidadeNote(v) {
  if (!v.modalidade) return '';
  const keys = modalidadeKeys(v.modalidade);
  const esp = PARAMS.categorias.filter((c) => c.mod.length === 1 && keys.includes(c.mod[0])).map((c) => c.nome);
  const lbl = { 'Online ao vivo': 'Online', 'Presencial': 'Presencial', 'Híbrido': 'Híbrido (online + presencial)' }[v.modalidade];
  return `<b>${lbl}</b> — a estrutura financeira é a mesma; na aba Custos, estas categorias aparecerão priorizadas:<div class="cat-sugg">${esp.map((c) => `<span>${esc(c)}</span>`).join('')}<span>+ categorias comuns</span></div><div style="margin-top:6px;opacity:.8">Apoio de taxonomia: nenhum custo é gerado automaticamente.</div>`;
}
const STEP_FIELDS = [
  ['nome', 'vertical', 'tipo', 'programa', 'modulo'],
  ['modalidade', 'cidade', 'uf', 'local', 'dataInicio', 'dataFim', 'cargaHoraria', 'status', 'responsavel'],
  ['cliente', 'qtdPrevista', 'capacidade', 'efetivos', 'pagantesPrev', 'cortesiasPrev'],
  ['refCrm', 'refContratual', 'observacoes'],
];
function eventSchemas() {
  const aberto = (v) => v.tipo === 'Evento aberto';
  const b2g = (v) => v.tipo === 'In Company / Projeto B2G';
  return [
    [
      { key: 'nome', label: 'Nome do evento', required: true, placeholder: 'Ex.: Seminário Nacional de Contratações Públicas' },
      { key: 'vertical', label: 'Vertical', type: 'chips', required: true, options: PARAMS.verticais.map((v) => ({ value: v, label: v, vc: VCLASS[v] })) },
      { key: 'tipo', label: 'Tipo de operação', type: 'chips', required: true, options: PARAMS.tiposOperacao.map((t) => ({ value: t, label: tipoShort(t) })) },
      { note: (v) => TIPO_NOTES[v.tipo] || '' },
      { key: 'programa', label: 'Programa', type: 'select', span: 3, show: (v) => v.tipo !== 'Evento aberto' && v.tipo !== 'Evento avulso', required: (v) => ['Programa', 'Módulo'].includes(v.tipo), optional: true,
        options: (v) => (v.vertical ? PARAMS.programas[v.vertical] : []), placeholder: (null) || 'Selecione (conforme vertical)…', help: (v) => (v.vertical ? '' : 'Selecione a vertical para listar os programas.') },
      { key: 'modulo', label: 'Módulo / trilha / etapas', span: 3, show: (v) => v.tipo !== 'Evento aberto' && v.tipo !== 'Evento avulso', required: (v) => v.tipo === 'Módulo', optional: true, placeholder: 'Ex.: Módulo 02' },
    ],
    [
      { key: 'modalidade', label: 'Modalidade', type: 'chips', required: true, options: PARAMS.modalidades.map((m) => ({ value: m, label: m, icon: MOD_ICON[m] })) },
      { note: modalidadeNote },
      { key: 'cidade', label: 'Cidade', span: 3, optional: true, placeholder: (null) || 'Cidade-sede' },
      { key: 'uf', label: 'UF', type: 'select', span: 1, options: PARAMS.ufs, optional: false, placeholder: 'UF' },
      { key: 'cargaHoraria', label: 'Carga horária (h)', type: 'number', span: 2, required: true },
      { key: 'local', label: 'Local', show: (v) => v.modalidade && v.modalidade !== 'Online ao vivo', required: true, placeholder: 'Espaço físico da execução' },
      { key: 'dataInicio', label: 'Data inicial', type: 'date', span: 3, required: true },
      { key: 'dataFim', label: 'Data final', type: 'date', span: 3, required: true },
      { key: 'status', label: 'Status operacional', type: 'select', span: 3, required: true, options: PARAMS.statusOperacional, tip: 'Situação da operação. A situação da receita e a do custo são independentes desta.' },
      { key: 'responsavel', label: 'Responsável', type: 'datalist', span: 3, required: true, options: PARAMS.responsaveis, placeholder: 'Função responsável' },
    ],
    [
      { note: (v) => (aberto(v) ? 'Evento aberto: não há cliente único — cada órgão/cliente é vinculado à sua receita, na aba Receitas.' : '') },
      { key: 'cliente', label: (null) || 'Órgão/cliente principal', show: (v) => !aberto(v), required: b2g, optional: true, placeholder: 'Ex.: Secretaria de Estado A', help: (v) => (b2g(v) ? 'Obrigatório em In Company/B2G.' : 'Quando aplicável.') },
      { group: 'Participação' },
      { key: 'qtdPrevista', label: 'Participantes previstos', type: 'number', span: 2, optional: true },
      { key: 'capacidade', label: 'Capacidade', type: 'number', span: 2, optional: true },
      { key: 'efetivos', label: 'Participantes efetivos', type: 'number', span: 2, optional: true, show: (v) => ['Em execução', 'Realizado', 'Encerrado'].includes(v.status), tip: 'Apurados após a execução.' },
      { group: 'Pagantes e cortesias (previsão)', show: (v) => aberto(v) || v.tipo === 'Evento avulso' },
      { key: 'pagantesPrev', label: 'Pagantes previstos', type: 'number', span: 2, show: (v) => aberto(v) || v.tipo === 'Evento avulso', optional: true },
      { key: 'cortesiasPrev', label: 'Cortesias previstas', type: 'number', span: 2, show: (v) => aberto(v) || v.tipo === 'Evento avulso', optional: true },
      { key: 'totPrev', label: 'Total previsto', type: 'computed', span: 2, show: (v) => aberto(v) || v.tipo === 'Evento avulso', compute: (v) => `<span class="num">${fmtNum((+v.pagantesPrev || 0) + (+v.cortesiasPrev || 0))}</span>` },
      { note: (v) => (aberto(v) || v.tipo === 'Evento avulso' ? 'Cortesia <b>não é custo negativo nem desconto</b>: é participante sem receita diretamente associada. Pagantes e cortesias efetivos são registrados por órgão, nas receitas.' : ''), kind: 'gold', icon: 'ticket' },
    ],
    [
      { note: () => 'Campos de <b>integração/referência</b>: o comercial permanece no CRM — aqui apenas identificamos o vínculo, sem duplicar a dimensão comercial.' },
      { key: 'refCrm', label: 'Referência CRM', span: 3, optional: true, placeholder: 'ID da oportunidade' },
      { key: 'refContratual', label: 'Referência contratual', span: 3, optional: !0, placeholder: 'Nº do contrato/instrumento', help: (v) => (b2g(v) ? 'Recomendado em In Company/B2G.' : '') },
      { key: 'observacoes', label: 'Observações', type: 'textarea', optional: true },
      { html: (v) => `<div class="summary-box">${[
        ['Evento', v.nome], ['Vertical', v.vertical], ['Tipo', v.tipo && tipoShort(v.tipo)], ['Programa/Módulo', [v.programa, v.modulo].filter(Boolean).join(' · ')],
        ['Modalidade', v.modalidade], ['Período', v.dataInicio ? fmtRange(v.dataInicio, v.dataFim) : ''], ['Local', [v.local, v.cidade && v.cidade + (v.uf ? '/' + v.uf : '')].filter(Boolean).join(' · ')],
        ['Status', v.status], ['Responsável', v.responsavel], ['Cliente principal', aberto(v) ? 'Múltiplos (via receitas)' : v.cliente],
      ].map(([l, x]) => `<div class="cline"><span class="cl">${l}</span><span class="cv">${esc(x || '—')}</span></div>`).join('')}</div>` },
    ],
  ];
}

function openEventWizard(existing) {
  const isEdit = !!existing;
  const v = existing ? { ...existing } : { nome: '', vertical: '', tipo: '', modalidade: '', status: 'Planejado', uf: '', cargaHoraria: '', observacoes: 'DADOS FICTÍCIOS — EXCLUSIVOS PARA HOMOLOGAÇÃO' };
  const schemas = eventSchemas();
  const steps = [['Identificação', 'Nome, vertical, tipo'], ['Execução', 'Modalidade, local, datas'], ['Operação', 'Cliente, participantes'], ['Referências', 'CRM, contrato, revisão']];
  let cur = 0; const done = new Set(isEdit ? [0, 1, 2, 3] : []); const errSteps = new Set();
  const wrap = document.createElement('div'); wrap.className = 'wizard';
  wrap.innerHTML = `<div class="wsteps" role="tablist">${steps.map((s, i) => `<button type="button" class="wstep" data-step="${i}" role="tab"><span class="wn">${i + 1}</span><span><div class="wt">${s[0]}</div><div class="wd">${s[1]}</div></span></button>`).join('')}</div>
    <div class="wpanel"><h4 id="wTitle"></h4><div class="wp-sub" id="wSub"></div><div id="wForm"></div></div>`;
  const engines = [];
  const ctx = Overlay.open({
    kind: 'modal', eyebrow: isEdit ? `Editar cadastro · ${existing.id}` : 'Novo evento', title: isEdit ? existing.nome : 'Cadastrar evento',
    body: wrap,
    foot: `<span class="hint" id="wHint"></span><span class="spacer"></span><button class="btn btn-secondary" id="wBack">${icon('chevL', 'sm')}Voltar</button><button class="btn btn-primary" id="wNext"></button>`,
  });
  const formEl = $('#wForm', wrap);
  const subs = ['Como o evento será identificado no sistema.', 'Onde, quando e como o evento será executado.', 'Quem participa. Os campos se adaptam ao tipo de operação.', 'Vínculos de integração e revisão final.'];
  function stepOfField(f) { return STEP_FIELDS.findIndex((a) => a.includes(f)); }
  function tryValidate() { try { Service.validateEvento(v); return null; } catch (e) { return e; } }
  function show(i) {
    cur = i;
    $('#wTitle', wrap).textContent = `${i + 1}. ${steps[i][0]}`;
    $('#wSub', wrap).textContent = subs[i];
    formEl.innerHTML = '';
    engines[i] = new FormEngine(formEl, schemas[i], v, { onChange: () => { if (i !== 1 && i !== 0) return; } });
    $$('.wstep', wrap).forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('done', k !== i && done.has(k) && !errSteps.has(k)); b.classList.toggle('err', k !== i && errSteps.has(k)); b.setAttribute('aria-selected', k === i); });
    const back = $('#wBack', ctx.box), next = $('#wNext', ctx.box);
    back.style.visibility = i === 0 ? 'hidden' : 'visible';
    next.innerHTML = i < 3 ? `Avançar ${icon('chevR', 'sm')}` : `${icon('check', 'sm')} ${isEdit ? 'Salvar alterações' : 'Criar evento'}`;
    $('#wHint', ctx.box).textContent = `Etapa ${i + 1} de 4 · campos com * são obrigatórios`;
    ctx.box.querySelector('.wpanel').scrollTop = 0;
  }
  function checkStep(i) {
    const err = tryValidate();
    if (err && err.field && stepOfField(err.field) <= i) {
      const st = stepOfField(err.field);
      if (st !== cur) show(st);
      engines[st].showError(err);
      errSteps.add(st);
      return false;
    }
    errSteps.delete(i);
    return true;
  }
  $('#wBack', ctx.box).onclick = () => show(Math.max(0, cur - 1));
  $('#wNext', ctx.box).onclick = async () => {
    if (cur < 3) { if (checkStep(cur)) { done.add(cur); show(cur + 1); } return; }
    const err = tryValidate();
    if (err) { const st = err.field ? stepOfField(err.field) : cur; show(st < 0 ? cur : st); engines[st < 0 ? cur : st].showError(err); return; }
    ['qtdPrevista', 'capacidade', 'efetivos', 'pagantesPrev', 'cortesiasPrev', 'cargaHoraria'].forEach((k) => (v[k] = Number(v[k]) || 0));
    if (v.tipo === 'Evento aberto') v.cliente = '';
    if (v.modalidade === 'Online ao vivo') v.local = '';
    if (!(v.tipo === 'Evento aberto' || v.tipo === 'Evento avulso')) { v.pagantesPrev = 0; v.cortesiasPrev = 0; }
    delete v.totPrev;
    const saved = await Service.saveEvento(v, existing && existing.id);
    ctx.close();
    toast(isEdit ? 'Cadastro atualizado' : 'Evento criado', `${saved.id} · ${saved.nome}`);
    if (isEdit) Router.refresh(); else location.hash = `#/eventos/${saved.id}`;
  };
  $$('.wstep', wrap).forEach((b) => (b.onclick = () => {
    const k = +b.dataset.step;
    if (k <= cur || isEdit) { show(k); return; }
    for (let s = cur; s < k; s++) { if (!checkStep(s)) return; done.add(s); }
    show(k);
  }));
  show(0);
}

/* =====================================================================
   TELA · WORKSPACE DO EVENTO (nível 2 e 3)
   Visão geral · Receitas · Custos · Faturamento e recebimentos · Pagamentos · Resultado
   ===================================================================== */
const WS_TABS = [
  ['visao-geral', 'Visão geral', 'home'], ['receitas', 'Receitas', 'inn'], ['custos', 'Custos', 'out'],
  ['comissoes', 'Comissões', 'coins'],
  ['faturamento', 'Faturamento e recebimentos', 'receipt'], ['pagamentos', 'Pagamentos', 'wallet'], ['resultado', 'Resultado', 'scale'],
];

Views.workspace = async function (view, id, tab) {
  const ev = await Repo.get('eventos', id);
  if (!ev) {
    setCrumbs([['Visão Executiva', '#/visao-geral'], ['Eventos e Projetos', '#/eventos'], ['Não encontrado', '']]);
    view.innerHTML = `<div class="card"><div class="empty"><div class="e-icon">${icon('search')}</div><h4>Evento não encontrado</h4><p>O evento ${esc(id)} não existe nesta sessão (pode ter sido excluído).</p><a class="btn btn-secondary" href="#/eventos">${icon('arrowL', 'sm')}Voltar aos eventos</a></div></div>`;
    return;
  }
  if (!WS_TABS.some((t) => t[0] === tab)) tab = 'visao-geral';
  const db = Repo.snapshot();
  const m = Rules.eventMetrics(ev, db);
  const alerts = Rules.eventAlerts(ev, db, m);
  const tabLabel = WS_TABS.find((t) => t[0] === tab)[1];
  setCrumbs([['Visão Executiva', '#/visao-geral'], ['Eventos e Projetos', '#/eventos'], [ev.id, `#/eventos/${ev.id}`], [tabLabel, '']]);
  const counts = {
    receitas: m.nReceitas, custos: m.nCustos, comissoes: m.nComissoes,
    faturamento: db.fatrec.filter((f) => f.eventoId === ev.id).length,
    pagamentos: db.pagamentos.filter((p) => p.eventoId === ev.id).length,
  };
  const prog = [ev.programa, ev.modulo].filter(Boolean).join(' · ');
  view.innerHTML = `
  <section class="ws-head ${VCLASS[ev.vertical]}">
    <div class="ws-top">
      <div style="min-width:0;flex:1 1 420px">
        <a class="ws-back" href="#/eventos">${icon('arrowL', 'xs')} Eventos</a>
        <div class="ws-id">${ev.id}${ev.refCrm ? ` · ${esc(ev.refCrm)}` : ''}</div>
        <h1 class="ws-title">${esc(ev.nome)}</h1>
        <div class="ws-meta">${vchip(ev.vertical)}<span class="meta-dot">·</span><span>${esc(tipoShort(ev.tipo))}</span><span class="meta-dot">·</span>
          <span style="display:inline-flex;gap:5px;align-items:center">${icon(MOD_ICON[ev.modalidade], 'sm')}${esc(ev.modalidade)}</span><span class="meta-dot">·</span>
          <span class="num">${fmtRange(ev.dataInicio, ev.dataFim)}</span>${prog ? `<span class="meta-dot">·</span><span>${esc(prog)}</span>` : ''}
          <span style="margin-left:4px">${badgeOp(ev.status)}</span></div>
      </div>
      <div class="ws-actions">
        <button class="btn btn-secondary btn-sm" id="wsEdit">${icon('edit', 'sm')}Editar</button>
        <button class="btn btn-ghost btn-icon sm" id="wsMore" aria-label="Mais ações">${icon('more')}</button>
        <button class="btn btn-primary btn-sm" id="wsAdd">${icon('plus', 'sm')}Lançar ${icon('chevD', 'xs')}</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções do evento">
      ${WS_TABS.map(([k, l, ic]) => `<a role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}" href="#/eventos/${ev.id}/${k}">${icon(ic, 'sm')}${l}${counts[k] != null ? `<span class="tcount">${counts[k]}</span>` : ''}${k === 'visao-geral' && alerts.some((a) => a.sev === 'Vencido') ? `<span class="tcount" style="background:var(--vermelho-50);color:var(--vermelho)" data-tip="Há vencimentos sem baixa">!</span>` : ''}</a>`).join('')}
    </nav>
  </section>
  <div id="wsBody"></div>`;

  $('#wsEdit').onclick = () => openEventWizard(ev);
  $('#wsMore').onclick = (e) => { e.stopPropagation(); openMenu(e.currentTarget, [
    { label: 'Editar cadastro', icon: 'edit', action: () => openEventWizard(ev) },
    { label: 'Ver pendências do evento', icon: 'alert', action: () => openAlertsDrawer(alerts, 'Pendências do evento') },
    '-',
    { label: 'Excluir evento', icon: 'trash', danger: true, action: () => deleteEventFlow(ev.id, () => (location.hash = '#/eventos')) },
  ]); };
  $('#wsAdd').onclick = (e) => { e.stopPropagation(); openMenu(e.currentTarget, [
    { header: 'Novo lançamento' },
    { label: 'Receita', icon: 'inn', action: () => openReceitaDrawer(ev) },
    { label: 'Custo', icon: 'out', action: () => openCustoDrawer(ev) },
    { label: 'Faturamento', icon: 'receipt', action: () => openFatrecDrawer(ev) },
    { label: 'Pagamento', icon: 'wallet', action: () => openPagamentoDrawer(ev) },
    { label: 'Comissão comercial', icon: 'coins', action: () => openComissaoDrawer(ev) },
  ]); };

  const body = $('#wsBody');
  const R = { 'visao-geral': wsOverview, receitas: wsReceitas, custos: wsCustos, comissoes: wsComissoes, faturamento: wsFaturamento, pagamentos: wsPagamentos, resultado: wsResultado }[tab];
  R(body, ev, m, alerts, db);
  bindGo(body);
};

/* ---------- helpers ---------- */
const flowStep = (label, v, sub, arrow = true, ic) => `<div class="flow-step"><div class="fs-l">${ic ? icon(ic, 'xs') : ''}${esc(label)}</div><div class="fs-v">${bigMoney(v).replace('class="num"', 'class="num"')}</div><div class="fs-s">${sub || ''}</div>${arrow ? `<span class="fs-arrow">${icon('chevR')}</span>` : ''}</div>`;
const miniKpi = (l, v, s = '', cls = '') => `<div><div class="ml">${l}</div><div class="mv num ${cls}">${v}</div>${s ? `<div class="ms">${s}</div>` : ''}</div>`;
const pct = (a, b) => (b ? fmtPct(a / b, 0) : '—');
function emptyState(ic, title, text, btn) {
  return `<div class="empty"><div class="e-icon">${icon(ic)}</div><h4>${esc(title)}</h4><p>${text}</p>${btn || ''}</div>`;
}
const isAberto = (ev) => ev.tipo === 'Evento aberto' || ev.tipo === 'Evento avulso';
function rowActions(key, id) { return `<td class="actions"><button class="btn btn-ghost btn-icon sm" data-act="${key}" data-id="${id}" aria-label="Ações de ${id}">${icon('more')}</button></td>`; }
function toolbarSearch(key, ph) {
  return `<div class="search-in">${icon('search', 'sm')}<input type="search" data-wsq="${key}" placeholder="${esc(ph)}" value="${esc(UI.ws.q[key] || '')}" aria-label="${esc(ph)}"></div>`;
}
function bindWsSearch(root) {
  $$('[data-wsq]', root).forEach((inp) => {
    let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => { UI.ws.q[inp.dataset.wsq] = inp.value; Router.refresh(); requestAnimationFrame(() => { const n = $(`[data-wsq="${inp.dataset.wsq}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 200); };
  });
}
const qMatch = (key, ...fields) => { const q = norm(UI.ws.q[key]); return !q || q.split(/\s+/).every((t) => norm(fields.join(' ')).includes(t)); };

/* ---------- 1 · VISÃO GERAL DO EVENTO ---------- */
function wsOverview(el, ev, m, alerts, db) {
  const nOrg = new Set(m.rf.map((x) => norm(x.r.cliente))).size;
  const facts = [
    ['Vertical', vchip(ev.vertical)], ['Tipo de operação', esc(tipoShort(ev.tipo))], ['Modalidade', esc(ev.modalidade)], ['Status', badgeOp(ev.status)],
    ['Período', `<span class="num">${fmtRange(ev.dataInicio, ev.dataFim)}</span>`], ['Carga horária', `${fmtNum(ev.cargaHoraria)} h`],
    ['Local', esc(ev.modalidade === 'Online ao vivo' ? `Online · ${ev.cidade}/${ev.uf}` : `${ev.local || '—'} · ${ev.cidade}/${ev.uf}`)], ['Responsável', esc(ev.responsavel)],
    ['Programa / módulo', esc([ev.programa, ev.modulo].filter(Boolean).join(' · ') || '—')],
    ['Cliente / órgão', ev.tipo === 'Evento aberto' ? `Múltiplos · ${nOrg} órgão(s)` : esc(ev.cliente || '—')],
    ['Referência contratual', esc(ev.refContratual || '—')], ['Referência CRM', esc(ev.refCrm || '—')],
  ];
  const op = [];
  if (ev.qtdPrevista) op.push(['Previstos', fmtNum(ev.qtdPrevista), ev.capacidade ? `capacidade ${fmtNum(ev.capacidade)}` : '']);
  if (['Em execução', 'Realizado', 'Encerrado'].includes(ev.status) && ev.efetivos) op.push(['Efetivos', fmtNum(ev.efetivos), ev.qtdPrevista ? `${pct(ev.efetivos, ev.qtdPrevista)} do previsto` : '']);
  if (m.pagantes || isAberto(ev)) op.push(['Pagantes', fmtNum(m.pagantes), ev.pagantesPrev ? `previsto ${fmtNum(ev.pagantesPrev)}` : 'registrados nas receitas']);
  if (m.cortesias || isAberto(ev)) op.push(['Cortesias', fmtNum(m.cortesias), ev.cortesiasPrev ? `previsto ${fmtNum(ev.cortesiasPrev)}` : 'não é custo nem desconto']);
  if (m.participantes) op.push(['Participantes totais', fmtNum(m.participantes), 'pagantes + cortesias']);

  el.innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="facts">${facts.map(([l, v]) => `<div class="fact"><div class="fl">${l}</div><div class="fv">${v}</div></div>`).join('')}</div></div>
  ${resultHero(m, { scope: 'do evento' })}
  <div class="section-title"><h2>Receita</h2><span class="st-line"></span><span class="st-note">${m.prevista ? `${fmtBRL(m.prevista)} em receita prevista (não contratada)` : ''}</span></div>
  <div class="card"><div class="flow">
    ${flowStep('Contratada', m.contratada, `${m.nReceitas} receita(s)`, true, 'file')}
    ${flowStep('Faturada', m.faturada, `${pct(m.faturada, m.contratada)} do contratado · ${fmtBRL(m.aFaturar)} a faturar`, true, 'receipt')}
    ${flowStep('Recebida', m.recebida, `${pct(m.recebida, m.faturada)} do faturado`, true, 'inn')}
    ${flowStep('A receber', m.aReceber, 'faturado − recebido', false, 'clock')}
  </div></div>
  <div class="section-title"><h2>Custos</h2><span class="st-line"></span><span class="st-note">${m.nCustos} lançamento(s)</span></div>
  <div class="card"><div class="flow">
    ${flowStep('Orçado', m.orcado, 'valor total previsto', true, 'doc')}
    ${flowStep('Realizado', m.realizado, `${pct(m.realizado, m.orcado)} do orçado`, true, 'out')}

  el.innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="mini-kpis">
    ${miniKpi('Receita contratada', fmtBRL(m.contratada), `${m.rf.filter((x) => Rules.isContratada(x.r)).length} receita(s) contratada(s)`)}
    ${miniKpi('Prevista (não contratada)', fmtBRL(m.prevista), 'não entra no contratado')}
    ${aberto ? miniKpi('Pagantes · cortesias', `${fmtNum(m.pagantes)} · ${fmtNum(m.cortesias)}`, `${fmtNum(m.participantes)} participantes`) : miniKpi('Faturada', fmtBRL(m.faturada), `${pct(m.faturada, m.contratada)} do contratado`)}

    <div class="toolbar">

      <span class="fb-spacer" style="flex:1"></span>
      <span class="muted" style="font-size:12.5px">${aberto ? 'Evento aberto · receita por inscrição' : 'In Company/B2G · valor global, etapas ou módulos'}</span>
      ${!aberto && m.rf.length ? `<button class="btn btn-secondary btn-sm" id="addEt">${icon('layers', 'sm')}Etapas e reconhecimento</button>` : ''}
      <button class="btn btn-primary btn-sm" id="addRec">${icon('plus', 'sm')}Adicionar receita</button>
    </div>
    ${m.rf.length === 0 ? emptyState('inn', 'Nenhuma receita registrada', aberto ? 'Registre as receitas por órgão/cliente: quantidade de inscrições, valor unitário, desconto, pagantes e cortesias.' : 'Registre o valor contratado (global, por etapa ou por módulo).', `<button class="btn btn-primary" data-add-rec>${icon('plus', 'sm')}Adicionar receita</button>`) : `
    <div class="table-wrap"><table class="t">
      <thead><tr><th>ID</th><th>Cliente / órgão</th><th>Tipo</th>${aberto ? '<th class="r">Inscrições × valor</th><th class="r">Desconto</th><th class="c">Pag. · Cort.</th>' : '<th>Etapa / módulo</th>'}<th class="r">Valor contratado</th><th class="r">Reconhecida ${info('Receita reconhecida por competência — etapas concluídas ou critério provisório de execução declarada. Contratada ≠ Reconhecida.')}</th><th class="r">Faturado ${info('Vem dos faturamentos registrados.')}</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(({ r, f }) => `<tr>
        <td class="idc">${r.id}</td>

        <td class="dim" style="white-space:nowrap">${esc(r.tipoReceita)}</td>
        ${aberto ? `<td class="r num" style="white-space:nowrap">${fmtNum(r.qtde)} × ${fmtBRL(r.valorUnit)}</td><td class="r num">${fmtBRL(r.desconto)}</td><td class="c num">${fmtNum(r.pagantes)} · ${fmtNum(r.cortesias)}</td>` : `<td class="dim">${esc(r.etapa || '—')}</td>`}
        <td class="r strong">${r.statusEconomico === 'Prevista' ? `<span class="muted num" data-tip="Receita prevista — não entra no contratado">${fmtBRL(f.valor)}</span>` : money(f.valor)}</td>
        <td class="r num">${(() => { const rc = Rules.receitaReconhecida(r, Repo.snapshot()); const et = (r.etapas || []).filter((x) => x.concluida).length;
          return rc ? `${fmtBRL(rc)}${(r.etapas || []).length ? `<div class="sub">${et}/${r.etapas.length} etapa(s)</div>` : ''}` : `<span class="muted">—</span>${(r.etapas || []).length ? `<div class="sub">0/${r.etapas.length} etapa(s)</div>` : ''}`; })()}</td>
        <td class="r"><div class="minibar" style="justify-content:flex-end">${Rules.isContratada(r) ? `<span class="num" style="width:auto;color:var(--tinta);font-size:13px">${fmtBRL(f.faturado)}</span>` : '<span class="muted" style="width:auto">—</span>'}</div></td>
        <td>${badgeFin(f.status)}</td>

      <tfoot><tr><td colspan="${aberto ? 3 : 3}">Total contratado</td>${aberto ? `<td></td><td class="r num">${fmtBRL(Rules.sum(m.rf, (x) => (Rules.isContratada(x.r) ? x.r.desconto : 0)))}</td><td class="c num">${fmtNum(m.pagantes)} · ${fmtNum(m.cortesias)}</td>` : '<td></td>'}<td class="r num">${fmtBRL(m.contratada)}</td><td class="r num">${fmtBRL(Rules.sum(m.rf, (x) => Rules.receitaReconhecida(x.r, Repo.snapshot())))}</td><td class="r num">${fmtBRL(m.faturada)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`}
  </div>
  ${aberto && m.rf.length > 1 ? `<div class="grid g-2" style="margin-top:16px">
    <div class="card"><div class="card-head"><div><h3>Receita por segmento</h3><div class="ch-sub">Composição da receita por segmento de cliente</div></div></div><div class="card-body"><div class="chart-box short" id="segChart"></div></div></div>
    <div class="card"><div class="card-head"><div><h3>Pagantes e cortesias por órgão</h3><div class="ch-sub">Cortesia não é custo negativo nem desconto</div></div><div class="ch-right">${legend([['Pagantes', C.azul], ['Cortesias', C.dourado]])}</div></div><div class="card-body"><div class="chart-box short" id="pcChart"></div></div></div>
  </div>` : ''}`;
  bindWsSearch(el);
  const bEt = $('#addEt');
  if (bEt) bEt.onclick = () => {
    const contr = m.rf.filter((x) => Rules.isContratada(x.r));
    if (contr.length === 1) return openEtapasDrawer(contr[0].r);
    openMenu(bEt, contr.map(({ r }) => ({ label: `${r.id} · ${r.cliente}`, icon: 'layers', action: () => openEtapasDrawer(r) })));
  };
  $('#addRec').onclick = () => openReceitaDrawer(ev);
  $$('[data-add-rec]', el).forEach((b) => (b.onclick = () => openReceitaDrawer(ev)));
  $$('[data-act="rec"]', el).forEach((b) => (b.onclick = (e) => {
    e.stopPropagation(); const r = m.rf.find((x) => x.r.id === b.dataset.id).r;
    openMenu(b, [
      ...(Rules.isContratada(r) ? [{ label: 'Registrar faturamento', icon: 'receipt', action: () => openFatrecDrawer(ev, null, { receitaId: r.id }) }] : []),
      { label: 'Editar receita', icon: 'edit', action: () => openReceitaDrawer(ev, r) },
      '-', { label: 'Excluir receita', icon: 'trash', danger: true, action: () => deleteFlow('receita', r.id, `${r.id} · ${r.cliente}`, Service.deleteReceita) },
    ]);
  }));
  if (aberto && m.rf.length > 1) {
    const seg = {}; m.rf.filter((x) => Rules.isContratada(x.r)).forEach((x) => (seg[x.r.segmento] = (seg[x.r.segmento] || 0) + x.f.valor));
    const sk = Object.keys(seg).sort((a, b) => seg[b] - seg[a]);
    Charts.bars($('#segChart'), { horizontal: true, labels: sk, datasets: [{ label: 'Contratado', data: sk.map((k) => seg[k]), color: C.azul }], maxBar: 16, aria: 'Receita contratada por segmento' });
    const rc = m.rf.filter((x) => Rules.isContratada(x.r));
    Charts.bars($('#pcChart'), { horizontal: true, stacked: true, money: false, labels: rc.map((x) => x.r.cliente), maxBar: 16, aria: 'Pagantes e cortesias por órgão',
      datasets: [{ label: 'Pagantes', data: rc.map((x) => x.r.pagantes), color: C.azul }, { label: 'Cortesias', data: rc.map((x) => x.r.cortesias), color: C.dourado }] });
  }
}

async function deleteFlow(kind, id, label, fn) {
  const ok = await confirmDialog({ title: `Excluir ${kind}?`, danger: true, confirmLabel: 'Excluir', message: `<b>${esc(label)}</b><br><br>Esta ação remove o lançamento desta sessão e recalcula os indicadores.` });
  if (!ok) return;
  try { await fn(id); toast(`${kind[0].toUpperCase() + kind.slice(1)} excluído(a)`, label); Router.refresh(); }
  catch (e) { toast('Exclusão bloqueada', e.message, 'err'); }
}

  const esp = PARAMS.categorias.filter((c) => c.mod.length === 1 && keys.includes(c.mod[0]));
  const semLanc = esp.filter((c) => !m.cf.some((x) => x.c.categoria === c.nome));
  const byFase = PARAMS.fases.map((fase) => ({ fase, items: rows.filter((x) => x.c.fase === fase) })).filter((g) => g.items.length);

  <div class="card" style="margin-bottom:16px"><div class="mini-kpis">
    ${miniKpi('Custo orçado', fmtBRL(m.orcado), `${m.nCustos} lançamento(s)`)}
    ${miniKpi('Custo realizado', fmtBRL(m.realizado), `${pct(m.realizado, m.orcado)} do orçado`)}
    ${miniKpi('Desvio (itens realizados)', `${m.desvio > 0 ? '+' : ''}${fmtBRL(m.desvio)}`, acima ? `${acima} item(ns) acima do previsto` : 'realizado − previsto', m.desvio > 0 ? 'neg' : (m.desvio < 0 ? 'pos' : ''))}

      <div class="fsel"><span class="fcap">Status</span><select id="cStatus"><option value="all">Todos os status</option>${PARAMS.statusCusto.map((f) => `<option ${U.cstatus === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>

      <button class="btn btn-primary btn-sm" id="addCus">${icon('plus', 'sm')}Adicionar custo</button>

    ${m.cf.length === 0 ? emptyState('out', 'Evento sem orçamento de custos', 'Registre os custos previstos por fase e categoria. O valor realizado e os pagamentos podem ser lançados depois.', `<button class="btn btn-primary" data-add-cus>${icon('plus', 'sm')}Adicionar custo</button>`) : `
    <div class="table-wrap"><table class="t">
      <thead><tr><th>ID</th><th>Descrição</th><th>Fornecedor</th><th class="r">Previsto</th><th class="r">Realizado</th><th class="r">Desvio</th><th>Pago</th><th>Status</th><th></th></tr></thead>
      <tbody>${byFase.map((g) => {

/* ---------- 4 · FATURAMENTO E RECEBIMENTOS ---------- */
function wsFaturamento(el, ev, m, alerts, db) {
  const U = UI.ws;
  const contr = m.rf.filter((x) => Rules.isContratada(x.r));
  const vencidos = db.fatrec.filter((f) => f.eventoId === ev.id && Rules.fatrecFin(f).vencido);
  const fatEv = db.fatrec.filter((f) => f.eventoId === ev.id);
  const retTrib = Rules.sum(fatEv, Rules.retTrib);
  const retContr = Rules.sum(fatEv, Rules.retContr);
  const retTotal = retTrib + retContr;
  const aLiberar = Rules.sum(fatEv, (f) => Rules.fatrecFin(f).aLiberar);
  const exigivel = Rules.sum(fatEv, (f) => Rules.fatrecFin(f).exigivel);
  el.innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="flow">
    ${flowStep('Contratada', m.contratada, `${contr.length} receita(s) contratada(s)`, true, 'file')}
    ${flowStep('Faturada', m.faturada, `${fmtBRL(m.aFaturar)} a faturar`, true, 'receipt')}
    ${flowStep('Recebida', m.recebida, `${pct(m.recebida, m.faturada)} do faturado`, true, 'inn')}
    ${flowStep('A receber', m.aReceber, vencidos.length ? `<span class="neg">${vencidos.length} parcela(s) vencida(s)</span>` : 'faturado − recebido', false, 'clock')}
  </div></div>
  ${retTotal > 0 ? `<div class="ctx-note gold" style="margin-bottom:16px">${icon('scale', 'sm')}<div><b>Retenções registradas: ${fmtBRL(retTotal)}</b> — tributária ${fmtBRL(retTrib, { dash: false })} · contratual ${fmtBRL(retContr, { dash: false })}${aLiberar > 0 ? ` (a liberar ${fmtBRL(aLiberar)})` : ''}. Retenção <b>não é inadimplência</b> e não é, por si, custo do evento: reduz o líquido esperado. Valor que pode ser cobrado hoje: <b>${fmtBRL(exigivel, { dash: false })}</b>. O faturado em aberto continua sendo faturado menos recebido; o tratamento tributário permanece ${VALIDAR('VALIDAR COM CONTABILIDADE')}.</div></div>` : ''}
  <div class="card">
    <div class="toolbar">
      ${toolbarSearch('fat', 'Buscar cliente, NF, parcela…')}
      <label style="display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--grafite);cursor:pointer"><input type="checkbox" id="soSaldo" ${U.soSaldo ? 'checked' : ''}> Somente com saldo</label>
      <span style="flex:1"></span>
      <button class="btn btn-primary btn-sm" id="addFat" ${contr.length ? '' : 'disabled'}>${icon('plus', 'sm')}Registrar faturamento</button>
    </div>
    ${contr.length === 0 ? emptyState('receipt', 'Nenhuma receita contratada', 'O faturamento é vinculado a uma receita contratada (ID_RECEITA). Registre ou contrate uma receita primeiro.', `<a class="btn btn-secondary" href="#/eventos/${ev.id}/receitas">Ir para Receitas</a>`) : `
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Receita / parcela</th><th>Vencimento</th><th class="r">Faturado</th><th class="r">Ret. trib.</th><th class="r">Ret. contr.</th><th class="r">Líquido esperado</th><th class="r">Recebido</th><th class="r">A receber</th><th class="r">Faturado em aberto</th><th>Situação</th><th></th></tr></thead>
      <tbody>${contr.map(({ r, f }) => {
        let parc = f.parcelas;
        if (!qMatch('fat', r.cliente, r.id, r.segmento, ...parc.map((p) => `${p.nf} ${p.parcela} ${p.id}`))) return '';
        if (U.soSaldo) { parc = parc.filter((p) => Rules.fatrecFin(p).saldo > 0); if (!parc.length && f.aFaturar <= 0) return ''; }
        return `<tr class="group-row">
          <td colspan="2"><div class="strong">${esc(r.cliente)}</div><div class="sub">${r.id} · ${esc(r.tipoReceita)}${r.etapa ? ' · ' + esc(r.etapa) : ''} · contratado ${fmtBRL(f.valor)}${f.aFaturar > 0 ? ` · <b style="color:#7A5E0F">${fmtBRL(f.aFaturar)} a faturar</b>` : ''}</div></td>
          <td class="r num strong">${fmtBRL(f.faturado)}</td><td></td><td></td><td></td>
          <td class="r num strong">${fmtBRL(f.recebido)}</td><td class="r num strong">${fmtBRL(f.exigivel)}</td><td class="r num strong">${fmtBRL(f.aReceber)}</td>
          <td>${badgeFin(f.status)}</td>
          <td class="actions">${f.aFaturar > 0 ? `<button class="btn btn-secondary btn-sm" data-fat-rec="${r.id}">${icon('plus', 'xs')}Faturar</button>` : ''}</td>
        </tr>` + parc.map((p) => {
          const x = Rules.fatrecFin(p);
          return `<tr class="child-row">
            <td><div class="strong" style="font-weight:500">${esc(p.parcela)}</div><div class="sub">${esc(p.nf || 'sem NF')} · ${p.id} · emit. ${fmtDate(p.dataFaturamento)}</div></td>
            <td class="num ${x.vencido ? 'neg' : ''}">${fmtDate(p.vencimento)}</td>
            <td class="r num">${fmtBRL(p.valorFaturado)}</td>
            <td class="r num">${x.retTrib ? `<span data-tip="Retenção tributária — tratamento a validar com Contabilidade. Não é inadimplência.">${fmtBRL(x.retTrib)}</span>` : '<span class="muted">—</span>'}</td>
            <td class="r num">${x.retContr ? `<span data-tip="Retenção contratual (garantia) — liberação prevista em contrato. Não é inadimplência.">${fmtBRL(x.retContr)}${x.aLiberar > 0 ? '<div class="sub">a liberar ' + fmtBRL(x.aLiberar) + '</div>' : ''}</span>` : '<span class="muted">—</span>'}</td>
            <td class="r num">${fmtBRL(x.liquido)}</td>
            <td class="r num">${p.valorRecebido ? `${fmtBRL(p.valorRecebido)}<div class="sub">${fmtDate(p.dataRecebimento)} · ${esc(contaNome(p.contaId))}</div>` : '<span class="muted">—</span>'}</td>
            <td class="r num">${fmtBRL(x.exigivel)}${x.diferenca !== 0 ? `<div class="sub neg">concil. ${fmtBRL(x.diferenca, { dash: false })}</div>` : ''}</td>
            <td class="r num strong">${fmtBRL(x.saldo)}</td>
            <td>${x.vencido ? badgeFin('Vencida') : badgeFin(x.status === 'Faturada' ? 'Faturada' : x.status)}</td>
            <td class="actions">${x.exigivel > 0 ? `<button class="btn btn-ghost btn-sm" data-receber="${p.id}" style="opacity:1">${icon('inn', 'xs')}Receber</button>` : ''}<button class="btn btn-ghost btn-icon sm" data-act="fat" data-id="${p.id}" aria-label="Ações de ${p.id}">${icon('more')}</button></td>
          </tr>`;
        }).join('') + (parc.length === 0 ? `<tr class="child-row"><td colspan="11" class="muted">${U.soSaldo ? 'Sem parcelas com saldo — resta faturar.' : 'Nenhum faturamento registrado para esta receita.'}</td></tr>` : '');
      }).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total do evento</td><td class="r num">${fmtBRL(m.faturada)}</td><td class="r num">${fmtBRL(retTrib)}</td><td class="r num">${fmtBRL(retContr)}</td><td class="r num">${fmtBRL(m.faturada - retTotal)}</td><td class="r num">${fmtBRL(m.recebida)}</td><td class="r num">${fmtBRL(exigivel)}</td><td class="r num">${fmtBRL(m.aReceber)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`}
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Cronograma de recebimentos</h3><div class="ch-sub">Faturado × recebido por mês</div></div><div class="ch-right">${legend([['Faturado', C.azul3], ['Recebido', C.azul]])}</div></div><div class="card-body"><div class="chart-box short" id="frChart"></div></div></div>`;
  bindWsSearch(el);
  $('#soSaldo').onchange = (e) => { U.soSaldo = e.target.checked; Router.refresh(); };
  $('#addFat').onclick = () => openFatrecDrawer(ev);
  $$('[data-fat-rec]', el).forEach((b) => (b.onclick = () => openFatrecDrawer(ev, null, { receitaId: b.dataset.fatRec })));
  $$('[data-receber]', el).forEach((b) => (b.onclick = async () => openFatrecDrawer(ev, await Repo.get('fatrec', b.dataset.receber), { mode: 'receber' })));
  $$('[data-act="fat"]', el).forEach((b) => (b.onclick = async (e) => {
    e.stopPropagation(); const p = await Repo.get('fatrec', b.dataset.id);
    openMenu(b, [
      { label: 'Registrar recebimento', icon: 'inn', action: () => openFatrecDrawer(ev, p, { mode: 'receber' }) },
      { label: 'Editar faturamento', icon: 'edit', action: () => openFatrecDrawer(ev, p) },
      '-', { label: 'Excluir faturamento', icon: 'trash', danger: true, action: () => deleteFlow('faturamento', p.id, `${p.id} · ${p.nf || p.parcela}`, Service.deleteFatrec) },
    ]);
  }));
  const cs = cashSeries(db, new Set([ev.id]));
  if (cs.labels.length) Charts.bars($('#frChart'), { labels: cs.labels, datasets: [{ label: 'Faturado', data: cs.fat, color: C.azul3 }, { label: 'Recebido', data: cs.rec, color: C.azul }], maxBar: 28, aria: 'Cronograma de faturamento e recebimento' });
  else $('#frChart').innerHTML = '<div class="empty" style="padding:30px"><p>Sem faturamentos registrados.</p></div>';
}

/* ---------- 5 · PAGAMENTOS ---------- */
function wsPagamentos(el, ev, m, alerts, db) {
  const U = UI.ws;
  const groups = m.cf.filter(({ f }) => f.realizado > 0 || f.pagamentos.length)
    .filter(({ c, f }) => qMatch('pag', c.descricao, c.fornecedor, c.categoria, c.id, ...f.pagamentos.map((p) => p.documento)))
    .filter(({ f }) => !U.soSaldo || f.aPagar > 0 || f.pagamentos.some((p) => Rules.pagamentoFin(p).saldo > 0));
  const pays = db.pagamentos.filter((p) => p.eventoId === ev.id);
  const venc = pays.filter((p) => Rules.pagamentoFin(p).vencido);
  const semTitulo = m.cf.filter(({ f }) => f.realizado > 0 && f.programado < f.realizado);
  el.innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="flow">
    ${flowStep('Custo realizado', m.realizado, `${m.cf.filter((x) => x.f.realizado > 0).length} custo(s) incorrido(s)`, true, 'out')}
    ${flowStep('Pago', m.pago, `${pct(m.pago, m.realizado)} do realizado`, true, 'wallet')}
    ${flowStep('Saldo a pagar', m.aPagar, 'realizado − pago', true, 'clock')}
    ${flowStep('Vencido sem baixa', Rules.sum(venc, (p) => Rules.pagamentoFin(p).saldo), venc.length ? `<span class="neg">${venc.length} título(s)</span>` : 'nenhum título vencido', false, 'alert')}
  </div></div>
  ${semTitulo.length ? `<div class="ctx-note" style="margin-bottom:16px">${icon('info', 'sm')}<div>${semTitulo.length} custo(s) realizado(s) ainda sem título programado para todo o valor. Use <b>+ Pagamento</b> no custo para programar ou baixar.</div></div>` : ''}
  <div class="card">
    <div class="toolbar">
      ${toolbarSearch('pag', 'Buscar fornecedor, documento, custo…')}
      <label style="display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--grafite);cursor:pointer"><input type="checkbox" id="soSaldoP" ${U.soSaldo ? 'checked' : ''}> Somente com saldo</label>
      <span style="flex:1"></span>
      <button class="btn btn-primary btn-sm" id="addPag" ${m.nCustos ? '' : 'disabled'}>${icon('plus', 'sm')}Registrar pagamento</button>
    </div>
    ${groups.length === 0 ? emptyState('wallet', m.nCustos ? 'Nenhum custo realizado ou pagamento' : 'Evento sem custos', 'Pagamentos são vinculados a lançamentos de custo (ID_LANCAMENTO_CUSTO). Custo realizado ≠ pago.', m.nCustos ? '' : `<a class="btn btn-secondary" href="#/eventos/${ev.id}/custos">Ir para Custos</a>`) : `
    <div class="table-wrap"><table class="t">
      <thead><tr><th>Custo / título</th><th>Documento</th><th>Vencimento</th><th class="r">Valor do título</th><th>Pagamento</th><th class="r">Valor pago</th><th class="r">Saldo</th><th>Status</th><th></th></tr></thead>
      <tbody>${groups.map(({ c, f }) => `<tr class="group-row">
        <td colspan="3"><div class="strong">${esc(c.descricao)}</div><div class="sub">${c.id} · ${esc(c.fornecedor || 'Fornecedor não informado')} · ${esc(c.fase)}</div></td>
        <td class="r"><div class="sub" style="margin:0">realizado</div><span class="num strong">${fmtBRL(f.realizado)}</span></td><td></td>
        <td class="r"><div class="sub" style="margin:0">pago</div><span class="num strong">${fmtBRL(f.pago)}</span></td>
        <td class="r"><div class="sub" style="margin:0">a pagar</div><span class="num strong">${fmtBRL(f.aPagar)}</span></td>
        <td>${badgeFin(f.status)}</td>
        <td class="actions"><button class="btn btn-secondary btn-sm" data-pay-cus="${c.id}">${icon('plus', 'xs')}Pagamento</button></td>
      </tr>` + f.pagamentos.map((p) => {
        const x = Rules.pagamentoFin(p);
        return `<tr class="child-row">
          <td><span class="idc">${p.id}</span></td>
          <td>${esc(p.documento || '—')}</td>
          <td class="num ${x.vencido ? 'neg' : ''}">${fmtDate(p.vencimento)}</td>
          <td class="r num">${fmtBRL(p.valor)}</td>
          <td class="num">${fmtDate(p.dataPagamento)}</td>
          <td class="r num">${fmtBRL(p.valorPago)}</td>
          <td class="r num strong">${fmtBRL(x.saldo)}</td>
          <td>${x.vencido ? badgeFin('Vencido') : badgeFin(x.status)}</td>
          <td class="actions">${x.saldo > 0 ? `<button class="btn btn-ghost btn-sm" data-baixar="${p.id}" style="opacity:1">${icon('check', 'xs')}Baixar</button>` : ''}<button class="btn btn-ghost btn-icon sm" data-act="pag" data-id="${p.id}" aria-label="Ações de ${p.id}">${icon('more')}</button></td>
        </tr>`;
      }).join('') + (f.pagamentos.length === 0 ? `<tr class="child-row"><td colspan="9" class="muted">Nenhum título programado — saldo integral a pagar.</td></tr>` : '')).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total do evento</td><td class="r num">${fmtBRL(Rules.sum(pays, (p) => p.valor))}</td><td></td><td class="r num">${fmtBRL(m.pago)}</td><td class="r num">${fmtBRL(m.aPagar)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`}
  </div>`;
  bindWsSearch(el);
  $('#soSaldoP').onchange = (e) => { U.soSaldo = e.target.checked; Router.refresh(); };
  $('#addPag').onclick = () => openPagamentoDrawer(ev);
  $$('[data-pay-cus]', el).forEach((b) => (b.onclick = () => openPagamentoDrawer(ev, null, { custoId: b.dataset.payCus })));
  $$('[data-baixar]', el).forEach((b) => (b.onclick = async () => openPagamentoDrawer(ev, await Repo.get('pagamentos', b.dataset.baixar), { mode: 'baixar' })));
  $$('[data-act="pag"]', el).forEach((b) => (b.onclick = async (e) => {
    e.stopPropagation(); const p = await Repo.get('pagamentos', b.dataset.id);
    openMenu(b, [
      { label: 'Registrar baixa', icon: 'check', action: () => openPagamentoDrawer(ev, p, { mode: 'baixar' }) },
      { label: 'Editar título', icon: 'edit', action: () => openPagamentoDrawer(ev, p) },
      '-', { label: 'Excluir pagamento', icon: 'trash', danger: true, action: () => deleteFlow('pagamento', p.id, `${p.id} · ${p.documento}`, Service.deletePagamento) },
    ]);
  }));
}

/* ---------- 6 · RESULTADO ---------- */
function wsResultado(el, ev, m, alerts, db) {
  const cats = groupCosts(db, new Set([ev.id]), 'categoria').sort((a, b) => b.previsto - a.previsto);
  const line = (l, v, opts = {}) => `<div class="cline ${opts.total ? 'total' : ''}"><span class="cl">${l}${opts.tip ? info(opts.tip) : ''}</span><span class="cv">${opts.raw != null ? opts.raw : money(v, opts)}</span></div>`;
  const ueRow = (l, v, base, tip) => `<div class="cline"><span class="cl">${l}${tip ? info(tip) : ''}</span><span class="cv">${v}</span></div>${base ? `<div class="muted" style="font-size:11.5px;margin:-6px 0 6px">${base}</div>` : ''}`;
  el.innerHTML = `
  ${resultHero(m, { scope: 'do evento' })}

  <div class="section-title"><h2>Demonstrativo do resultado</h2><span class="st-line"></span><span class="st-note">receitas − custos − comissões</span></div>
  <div class="card" style="margin-bottom:16px">
    ${demoTable(m.demo, { titulo: 'Composição do resultado do evento' })}
    ${demoLegenda({ caixa: 'o que foi recebido e pago neste evento, com as comissões efetivamente pagas.' })}
    <div class="ctx-note gold" style="margin:14px 18px 18px">${icon('info', 'sm')}<div>
      O demonstrativo considera apenas o que está lançado <b>neste evento</b>. Não inclui despesas corporativas, estrutura compartilhada, tributos sobre o resultado nem retenções —
      esses elementos são apurados na visão da instituição, em Resultado e Orçamento. Resultado positivo não significa dinheiro em caixa.
    </div></div>
  </div>

  <div class="section-title"><h2>Como o resultado se forma</h2><span class="st-line"></span></div>
  <div class="compose">
    <div class="cbox"><h4><span class="cb-mark" style="background:var(--azul)"></span>Receitas</h4>
      ${line('Contratada', m.contratada, { tip: 'Valor dos contratos e inscrições confirmados, mesmo que ainda não faturados ou recebidos.' })}
      ${line('Reconhecida no período', m.reconhecida, { tip: 'Parcela da receita que já pertence ao resultado: etapas concluídas ou execução declarada.' })}
      ${line('Faturada', m.faturada, { tip: 'Valor dos documentos de cobrança emitidos.' })}
      ${line('Recebida', m.recebida, { tip: 'Valor efetivamente recebido.' })}
      ${line('A faturar', m.aFaturar, { tip: 'Contratada menos faturada.' })}
      ${line('A receber', m.aReceber, { total: true, tip: 'Faturada menos recebida.' })}
      ${m.prevista ? `<div class="muted" style="font-size:12px;margin-top:6px">+ ${fmtBRL(m.prevista)} em receita prevista, ainda não contratada</div>` : ''}
    </div>
    <div class="cbox"><h4><span class="cb-mark" style="background:var(--vermelho)"></span>Custos e despesas</h4>
      ${line('Previsto', m.orcado, { tip: 'Plano de custos do evento, incluindo comissões previstas.' })}
      ${line('Realizado (total)', m.realizado, { tip: 'Custos e despesas incorridos, independentemente de pagamento. Inclui as comissões devidas.' })}
      ${line('— operacionais', m.custoOperacionalRealizado, { tip: 'Custos e despesas do evento, exceto comissões.' })}
      ${line('— comissões', m.comissaoDevida, { tip: 'Comissões comerciais devidas. O mesmo lançamento aparece em Comissões e em Contas a Pagar.' })}
      ${line('Pago', m.pago, { tip: 'Saída de caixa efetiva.' })}
      ${line('Diretos', m.direto)}
      ${line('A pagar', m.aPagar, { total: true, tip: 'Realizado menos pago.' })}
    </div>
    <div class="cbox"><h4><span class="cb-mark" style="background:var(--noite)"></span>Resultado</h4>
      <div class="eq" style="margin:10px 0 6px"><span>Reconhecida</span><span class="op">−</span><span>Realizado</span><span class="op">=</span><b class="${m.resultadoRealizado < 0 ? 'neg' : ''} num">${fmtBRL(m.resultadoRealizado, { dash: false })}</b></div>
      ${line('Resultado do evento', m.resultadoRealizado, { signed: true })}
      ${line('Resultado previsto', m.resultadoPrevisto, { signed: true, tip: 'Contratada menos previsto.' })}
      ${line('Comissões no resultado', m.comissaoDevida, { tip: 'Quanto do custo do evento foi destinado a comissões comerciais.' })}
      ${line('Desvio previsto × realizado', m.desvio, { signed: false, raw: `<span class="num ${m.desvio > 0 ? 'neg' : m.desvio < 0 ? 'pos' : ''}">${m.desvio > 0 ? '+' : ''}${fmtBRL(m.desvio)}</span>`, tip: 'Realizado menos previsto, nos itens já realizados.' })}
      ${line('Movimentação financeira', m.movimentacao, { signed: true, total: true, tip: 'Recebido menos pago. Não é resultado.' })}

  <div class="grid g-2" style="margin-top:16px">
    <div class="cbox"><h4>${icon('users', 'sm')} Indicadores por participante</h4>
      <div class="muted" style="font-size:12.5px;margin:4px 0 8px">Apenas os indicadores que podem ser calculados com o que está lançado.</div>
      ${ueRow('Custo por participante', m.custoPorParticipante != null ? `<span class="num">${fmtBRL(m.custoPorParticipante)}</span>` : '<span class="muted">—</span>', m.custoPorParticipante != null ? `Custo realizado ÷ ${m.baseUnitLabel} (${fmtNum(m.baseUnit)})` : 'sem custo realizado ou participantes', 'Custo realizado ÷ participantes')}
      ${ueRow('Receita média por pagante', m.receitaPorPagante != null ? `<span class="num">${fmtBRL(m.receitaPorPagante)}</span>` : '<span class="muted">Não aplicável</span>', m.receitaPorPagante != null ? `Receita contratada ÷ ${fmtNum(m.pagantes)} pagantes` : 'sem pagantes registrados (receita por valor global)')}
      ${ueRow('Receita média por participante total', m.receitaPorParticipante != null ? `<span class="num">${fmtBRL(m.receitaPorParticipante)}</span>` : '<span class="muted">Não aplicável</span>', m.receitaPorParticipante != null ? `Receita contratada ÷ ${fmtNum(m.participantes)} (pagantes + cortesias)` : '')}
      ${ueRow('Comissão por participante', m.baseUnit > 0 && m.comissaoDevida > 0 ? `<span class="num">${fmtBRL(Math.round(m.comissaoDevida / m.baseUnit))}</span>` : '<span class="muted">—</span>', m.comissaoDevida > 0 ? `Comissões devidas ÷ ${m.baseUnitLabel} (${fmtNum(m.baseUnit)})` : 'sem comissão devida neste evento')}
    </div>
    <div class="cbox"><h4>${icon('ticket', 'sm')} Pagantes e cortesias</h4>
      <div class="muted" style="font-size:12.5px;margin:4px 0 8px">Cortesia não é custo negativo nem simples desconto: é participante sem receita associada.</div>
      ${m.participantes ? `
      <div style="display:flex;height:14px;border-radius:2px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line-soft)">
        <i style="width:${(m.pagantes / m.participantes) * 100}%;background:var(--azul)"></i><i style="width:${(m.cortesias / m.participantes) * 100}%;background:var(--dourado)"></i></div>
      ${legend([[`Pagantes · ${fmtNum(m.pagantes)}`, C.azul], [`Cortesias · ${fmtNum(m.cortesias)}`, C.dourado]])}
      <div style="margin-top:10px">
      ${line('Participantes totais', 0, { raw: `<span class="num">${fmtNum(m.participantes)}</span>` })}
      ${line('Cortesias sobre o total', 0, { raw: `<span class="num">${fmtPct(m.cortesias / m.participantes)}</span>` })}
      ${ev.capacidade ? line('Participantes / capacidade', 0, { raw: `<span class="num">${fmtNum(m.participantes)} de ${fmtNum(ev.capacidade)}</span>` }) : ''}
      </div>`
      : `<div class="empty" style="padding:22px"><p>${isAberto(ev) ? 'Sem pagantes/cortesias registrados nas receitas.' : 'Não aplicável a este tipo de operação (receita por valor global).'}</p></div>`}
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head"><div><h3>Orçado × Realizado por categoria</h3><div class="ch-sub">Onde o orçamento foi (ou não) cumprido</div></div><div class="ch-right">${legend([['Orçado', C.azul3], ['Realizado', C.azul]])}</div></div>
    <div class="card-body">${cats.length ? `<div class="chart-box" id="rsCat" style="height:${Math.max(200, cats.length * 34 + 40)}px"></div>` : '<div class="empty" style="padding:30px"><p>Sem custos registrados.</p></div>'}</div>
  </div>`;
  if (cats.length) Charts.bars($('#rsCat'), { horizontal: true, labels: cats.map((c) => c.k), maxBar: 12, aria: 'Orçado versus realizado por categoria', datasets: [{ label: 'Orçado', data: cats.map((c) => c.previsto), color: C.azul3 }, { label: 'Realizado', data: cats.map((c) => c.realizado), color: C.azul }] });
}

/* =====================================================================
   FORMULÁRIOS DE LANÇAMENTO (nível 3 · operação) — drawers contextuais
   ===================================================================== */
function openFormDrawer({ eyebrow, title, sub, schema, values, save, okTitle, okDesc, submitLabel = 'Salvar', extraFoot = '', onMount }) {
  const body = document.createElement('div'); body.className = 'ov-body';
  const ctx = Overlay.open({
    kind: 'drawer', eyebrow, title, sub, body,
    foot: `${extraFoot}<span class="spacer"></span><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-save>${icon('check', 'sm')}${esc(submitLabel)}</button>`,
  });
  const fe = new FormEngine(body, schema, values);
  const btn = ctx.box.querySelector('[data-save]');
  const submit = async () => {
    btn.disabled = true;
    try {
      const saved = await save(values);
      ctx.close();
      toast(okTitle, typeof okDesc === 'function' ? okDesc(saved) : okDesc);
      Router.refresh();
    } catch (e) {
      if (e instanceof ValidationError) fe.showError(e); else { console.error(e); fe.showError(e); }
    } finally { btn.disabled = false; }
  };
  btn.onclick = submit;
  body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); });
  onMount && onMount(ctx, fe);
  return { ctx, fe };
}

function csvDownload(name, cols, rows) {
  const escCsv = (x) => { const s = x == null ? '' : String(x); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const fmt = (c, r) => { const v = c.v(r); return c.money ? (reais(Number(v) || 0)).toFixed(2).replace('.', ',') : v; };  // centavos → reais na exportação
  const txt = '﻿' + [cols.map((c) => escCsv(c.l)).join(';'), ...rows.map((r) => cols.map((c) => escCsv(fmt(c, r))).join(';'))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = `NTC_FIN05_${name}_FICTICIO.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Exportação gerada', `${rows.length} linha(s) · dados fictícios`);
}
/** Tabela genérica: cols [{l, v(r), money, cls, render(r)}] */
function repTable(allCols, rows, { total = true, empty = 'Sem dados no recorte.' } = {}) {
  const cols = allCols.filter((c) => !c.csvOnly);
  if (!rows.length) return `<div class="empty" style="padding:30px"><p>${empty}</p></div>`;
  const tot = cols.map((c) => (c.money && total ? Rules.sum(rows, c.v) : null));
  return `<div class="table-wrap"><table class="t"><thead><tr>${cols.map((c) => `<th class="${c.money || c.num ? 'r' : ''}">${esc(c.l)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr ${r._go ? `class="click" data-go="${r._go}" tabindex="0"` : ''}>${cols.map((c) => `<td class="${c.money || c.num ? 'r num' : ''} ${c.cls || ''}">${c.render ? c.render(r) : c.money ? (c.signed ? money(c.v(r), { signed: true }) : fmtBRL(c.v(r))) : esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody>
    ${total ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.money || c.num ? 'r num' : ''}">${i === 0 ? `Total · ${rows.length}` : tot[i] != null ? (c.signed ? money(tot[i], { signed: true }) : fmtBRL(tot[i])) : ''}</td>`).join('')}</tr></tfoot>` : ''}
  </table></div>`;
}
const DIM_COLS = (label) => [
  { l: label, v: (r) => r.k, cls: 'strong' },
  { l: 'Eventos', v: (r) => r.n, num: true },
  { l: 'Contratada', v: (r) => r.contratada, money: true }, { l: 'Faturada', v: (r) => r.faturada, money: true },
  { l: 'Recebida', v: (r) => r.recebida, money: true }, { l: 'Custo realizado', v: (r) => r.realizado, money: true },
  { l: 'Pago', v: (r) => r.pago, money: true },
  { l: 'Comissões', v: (r) => r.comissaoDevida, money: true },
  { l: 'Resultado', v: (r) => r.resultadoRealizado, money: true, signed: true },
];
function byDim(rows, key, order) {
  const g = {};
  rows.forEach(({ ev, m }) => {
    const k = ev[key]; const o = (g[k] = g[k] || { k, n: 0, contratada: 0, faturada: 0, recebida: 0, realizado: 0, pago: 0, orcado: 0, resultado: 0, resultadoRealizado: 0, reconhecida: 0, comissaoPrevista: 0, comissaoDevida: 0, comissaoPaga: 0, participantes: 0, efetivos: 0 });
    o.n++; ['contratada', 'faturada', 'recebida', 'realizado', 'pago', 'orcado', 'resultado', 'resultadoRealizado', 'reconhecida', 'comissaoPrevista', 'comissaoDevida', 'comissaoPaga', 'participantes'].forEach((x) => (o[x] += m[x])); o.efetivos += m.baseUnit;
  });
  const arr = Object.values(g);
  return order ? order.map((k) => g[k]).filter(Boolean) : arr;
}

      { l: 'Fornecedor', v: (r) => r.c.fornecedor || '—' }, { l: 'Realizado', v: (r) => r.f.realizado, money: true }, { l: 'Programado', v: (r) => r.f.programado, money: true },
      { l: 'Sem título', v: (r) => r.f.realizado - r.f.programado, money: true },
    ], sem.map((x) => ({ ...x, _go: `#/eventos/${x.c.eventoId}/pagamentos` })))}</div></div>` : '';
    B.chartTitle = 'Saldo a pagar por vencimento';
    const order = ['Vencido', 'A vencer'];
    B.chart = (el) => Charts.bars(el, { labels: order, datasets: [{ label: 'Saldo a pagar', data: [Rules.sum(B.rows.filter((r) => r.p.vencimento < t), (r) => r.saldo), Rules.sum(B.rows.filter((r) => r.p.vencimento >= t), (r) => r.saldo)], color: C.vermelho2 }], maxBar: 60 });
    return B;
  },
  'comparativo-periodos': (P, S) => {
    const pa = Rules.portfolio({ ...S, periodo: S.pa }), pb = Rules.portfolio({ ...S, periodo: S.pb });
    const la = Rules.PERIODOS.find((p) => p.id === S.pa).label, lb = Rules.PERIODOS.find((p) => p.id === S.pb).label;
    const keys = [['Eventos', null], ['Receita contratada', 'contratada'], ['Receita faturada', 'faturada'], ['Receita recebida', 'recebida'], ['Receita reconhecida', 'reconhecida'], ['Custo previsto', 'orcado'], ['Custo realizado', 'realizado'], ['Comissões devidas', 'comissaoDevida'], ['Valor pago', 'pago'], ['Resultado do evento', 'resultadoRealizado'], ['Participantes', 'participantes']];
    const rows = keys.map(([l, k]) => ({ l, a: k ? pa.tot[k] : pa.rows.length, b: k ? pb.tot[k] : pb.rows.length, isMoney: k && k !== 'participantes' }));

  },
};
function fatList(P, pred, title, byRec) {
  const rows = P.db.fatrec.filter((f) => P.evIds.has(f.eventoId) && pred(f)).map((f) => {
    const r = P.db.receitas.find((x) => x.id === f.receitaId) || {}; const x = Rules.fatrecFin(f);
    return { f, r, saldo: x.saldo, x, _go: `#/eventos/${f.eventoId}/faturamento` };
  }).sort((a, b) => (byRec ? b.f.dataRecebimento.localeCompare(a.f.dataRecebimento) : a.f.vencimento.localeCompare(b.f.vencimento)));
  const cols = [
    { l: 'Evento', v: (r) => r.f.eventoId, csvOnly: true },
    { l: 'Cliente / órgão', v: (r) => r.r.cliente, render: (r) => `<div class="strong">${esc(r.r.cliente)}</div><div class="sub">${r.f.eventoId} · ${esc(r.f.parcela)} · ${esc(r.f.nf || 'sem NF')}</div>` },
    { l: byRec ? 'Recebimento' : 'Faturamento', v: (r) => fmtDate(byRec ? r.f.dataRecebimento : r.f.dataFaturamento), render: (r) => `<div class="num">${fmtDate(byRec ? r.f.dataRecebimento : r.f.dataFaturamento)}</div><div class="sub num" style="min-width:0">venc. ${fmtDate(r.f.vencimento)}</div>` },
    { l: 'Vencimento', v: (r) => fmtDate(r.f.vencimento), csvOnly: true },
    { l: 'Faturado', v: (r) => r.f.valorFaturado, money: true }, { l: 'Retenção tributária', v: (r) => Rules.retTrib(r.f), money: true, csvOnly: true }, { l: 'Retenção contratual', v: (r) => Rules.retContr(r.f), money: true, csvOnly: true }, { l: 'Líquido esperado', v: (r) => Rules.fatrecFin(r.f).liquido, money: true, csvOnly: true }, { l: 'Saldo exigível', v: (r) => Rules.fatrecFin(r.f).exigivel, money: true, csvOnly: true },
    { l: 'Recebido', v: (r) => r.f.valorRecebido, money: true }, { l: 'Saldo', v: (r) => r.saldo, money: true },
    { l: 'Status', v: (r) => (r.x.vencido ? 'Vencida' : r.x.status), render: (r) => badgeFin(r.x.vencido ? 'Vencida' : r.x.status) },
  ];
  return { cols, rows, title, chartTitle: byRec ? 'Recebido por mês' : 'Faturado por mês', chart: (el) => {
    const cs = cashSeries(P.db, new Set(rows.map((r) => r.f.eventoId)));
    Charts.bars(el, { labels: cs.labels, datasets: [{ label: byRec ? 'Recebido' : 'Faturado', data: byRec ? cs.rec : cs.fat, color: byRec ? C.azul : C.azul2 }] });
  } };
}
function payList(P, pred, title) {
  const rows = P.db.pagamentos.filter((p) => P.evIds.has(p.eventoId) && pred(p)).map((p) => {
    const c = P.db.custos.find((x) => x.id === p.custoId) || {}; const x = Rules.pagamentoFin(p);
    return { p, c, x, saldo: x.saldo, _go: `#/eventos/${p.eventoId}/pagamentos` };
  }).sort((a, b) => a.p.vencimento.localeCompare(b.p.vencimento));
  const cols = [
    { l: 'Evento', v: (r) => r.p.eventoId, csvOnly: true },
    { l: 'Custo / fornecedor', v: (r) => `${r.c.descricao} · ${r.c.fornecedor}`, render: (r) => `<div class="strong">${esc(r.c.descricao)}</div><div class="sub">${r.p.eventoId} · ${esc(r.c.fornecedor || '—')} · ${esc(r.p.documento || '')}</div>` },
    { l: 'Vencimento', v: (r) => fmtDate(r.p.vencimento), cls: 'num' }, { l: 'Pagamento', v: (r) => fmtDate(r.p.dataPagamento), cls: 'num' },
    { l: 'Valor do título', v: (r) => r.p.valor, money: true }, { l: 'Pago', v: (r) => r.p.valorPago, money: true }, { l: 'Saldo', v: (r) => r.saldo, money: true },
    { l: 'Status', v: (r) => (r.x.vencido ? 'Vencido' : r.x.status), render: (r) => badgeFin(r.x.vencido ? 'Vencido' : r.x.status) },
  ];
  return { cols, rows, title, chartTitle: 'Pago por mês', chart: (el) => { const cs = cashSeries(P.db, new Set(rows.map((r) => r.p.eventoId))); Charts.bars(el, { labels: cs.labels, datasets: [{ label: 'Pago', data: cs.pag, color: C.vermelho2 }] }); } };
}

        <div class="cline"><span class="cl">Fechamento mensal</span><span class="cv">Simulado — congela a apuração; não bloqueia lançamentos; não é encerramento contábil</span></div>
        <div class="ctx-note gold" style="margin:16px 0">${icon('alert', 'sm')}<div><b>DADOS FICTÍCIOS — EXCLUSIVOS PARA HOMOLOGAÇÃO.</b> Nenhum valor representa a operação real da NTC.</div></div>
        <button class="btn btn-secondary" id="cfgReset">${icon('refresh', 'sm')}Restaurar dados fictícios iniciais</button>
      </div></div>`;
  }
  view.innerHTML = `
  <div class="page-head"><div class="ph-text"><div class="eyebrow">Governança · parâmetros e integridade</div><h1 class="page-title">Administração</h1>
  <div class="page-sub">Listas controladas, plano de contas, centros de custo e verificação de integridade do livro financeiro. Ambiente separado da operação e dos relatórios.</div></div></div>
  <div class="cfg-layout">
    <nav class="card rep-nav" aria-label="Seções de administração">${CFG_SECTIONS.map((g) => `<div class="rg">${g.g}</div>${g.items.map(([id, l]) => `<a href="#/administracao" data-sec="${id}" class="${id === sec ? 'on' : ''}">${esc(l)}</a>`).join('')}`).join('')}</nav>
    <div style="min-width:0">${content}</div>
  </div>`;
  $$('[data-sec]', view).forEach((a) => (a.onclick = (e) => { e.preventDefault(); UI.cfg.sec = a.dataset.sec; Router.refresh(); }));
  const form = $('#cfgAdd');
  if (form) form.onsubmit = (e) => {
    e.preventDefault(); const val = $('#cfgNew').value.trim();
    if (!val) return;
    if (PARAMS[key].some((x) => norm(x) === norm(val))) { toast('Item já existe', val, 'err'); return; }
    PARAMS[key].push(val); UI.sessionParams.add(key + ':' + val); toast('Item adicionado nesta sessão', `${label}: ${val}`); Router.refresh();
  };
  $$('[data-rm]', view).forEach((b) => (b.onclick = () => { PARAMS[key] = PARAMS[key].filter((x) => x !== b.dataset.rm); UI.sessionParams.delete(key + ':' + b.dataset.rm); Router.refresh(); }));
  const nc = $('#admConta'); if (nc) nc.onclick = () => openContaDrawer();
  $$('[data-cta]', view).forEach((b) => (b.onclick = () => openContaDrawer(Repo.snapshot().contas.find((c) => c.id === b.dataset.cta))));
  const rs = $('#cfgReset');
  if (rs) rs.onclick = async () => {
    if (!(await confirmDialog({ title: 'Restaurar dados fictícios?', message: 'Todas as inclusões, edições e exclusões desta sessão serão descartadas.', confirmLabel: 'Restaurar' }))) return;
    await Repo.reset(); toast('Dados restaurados', 'Base fictícia inicial recarregada.'); Router.refresh();
  };
};
