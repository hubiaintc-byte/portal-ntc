<style>
/* =====================================================================
   DESIGN SYSTEM NTC · Software Corporativo
   Base: Manual de Marca Grupo NTC v2026.3 · Paleta Gabinete Soberano v2026.2
   Tipografia: Cormorant Garamond (títulos) + Barlow / Barlow Condensed (UI)
   ===================================================================== */
:root {
  /* Tokens oficiais */
  --azul: #1A4372;          /* Módulo N · dominante · NTC Educação */
  --vermelho: #8E2A1C;      /* Módulo T · NTC Gestão Pública */
  --verde: #37661C;         /* Módulo C · NTC Saúde */
  --dourado: #B8952E;       /* cerimonial · filetes (≤3% digital) */
  --noite: #0B1726;         /* fundo escuro */
  --pergaminho: #F2F0EA;    /* fundo claro */
  --branco: #FFFFFF;        /* branco técnico · UI/formulários */
  --tinta: #14202E;         /* tipografia principal */
  --grafite: #3A4050;       /* tipografia secundária */
  --prata: #767E8D;         /* prata legível · metadados */
  --hairline: #A8ACB6;      /* prata hairline · filetes (vetado em texto) */

  /* Derivados funcionais (tints dos tokens oficiais) */
  --azul-700: #133356;
  --azul-50: #E9EEF5;
  --azul-100: #D3DDEA;
  --vermelho-50: #F6ECEA;
  --verde-50: #EBF1E6;
  --dourado-50: #F6F0DE;
  --line: rgba(168, 172, 182, .42);
  --line-soft: rgba(168, 172, 182, .24);
  --surface: var(--branco);
  --surface-2: #F7F6F2;
  --shadow-1: 0 1px 2px rgba(11, 23, 38, .05);
  --shadow-2: 0 10px 30px -12px rgba(11, 23, 38, .22);
  --shadow-3: 0 24px 60px -20px rgba(11, 23, 38, .38);

  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cond: 'Barlow Condensed', 'Barlow', 'Arial Narrow', sans-serif;

  --r-sm: 3px;
  --r-md: 4px;
  --sidebar: 244px;
  --topbar: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--pergaminho); color: var(--tinta);
  font-family: var(--sans); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--azul); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; }
.num, .tabnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'lnum' 1; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.xs { width: 13px; height: 13px; }

/* ---------------- Shell ---------------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; background: var(--noite); color: var(--pergaminho);
  display: flex; flex-direction: column; padding: 22px 14px 16px; z-index: 30;
}
.brand { padding: 4px 10px 20px; border-bottom: 1px solid rgba(242, 240, 234, .08); margin-bottom: 18px; }
.brand .logo { display: block; width: 128px; height: auto; }
.brand .logo-mini { display: none; width: 58px; height: auto; }
.ver-mini { display: none; }
.brand .product { margin-top: 14px; font-family: var(--cond); letter-spacing: .16em; text-transform: uppercase; font-size: 11px; color: rgba(242, 240, 234, .62); }
.brand .product b { color: var(--pergaminho); font-weight: 600; letter-spacing: .12em; }
.brand .filete { width: 26px; height: 2px; background: var(--dourado); margin-top: 10px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--cond); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(242, 240, 234, .45); padding: 8px 12px 6px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md);
  color: rgba(242, 240, 234, .74); font-weight: 500; font-size: 14px; transition: background .15s, color .15s;
}
.nav a:hover { background: rgba(242, 240, 234, .06); color: var(--pergaminho); }
.nav a.active { background: rgba(242, 240, 234, .09); color: var(--pergaminho); }
.nav a.active::before { content: ''; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 2px; background: var(--dourado); }
.nav a .count { margin-left: auto; font-family: var(--cond); font-size: 12px; color: rgba(242, 240, 234, .5); }
.side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(242, 240, 234, .08); }
.ver { font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; color: rgba(242, 240, 234, .55); line-height: 1.5; }
.ver b { display: block; color: var(--pergaminho); font-size: 12.5px; letter-spacing: .08em; font-weight: 600; }
.pill-homolog { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 8px; border: 1px solid rgba(184, 149, 46, .55); color: #D9BE6B; border-radius: 2px; font-family: var(--cond); font-size: 10.5px; letter-spacing: .18em; }
.pill-homolog::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--dourado); }
.side-tag { margin-top: 12px; font-size: 11.5px; color: rgba(242, 240, 234, .5); line-height: 1.4; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; height: var(--topbar); display: flex; align-items: center; gap: 16px;
  padding: 0 32px; background: rgba(242, 240, 234, .88); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar .menu-btn { display: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--prata); }
.crumbs a { color: var(--grafite); }
.crumbs a:hover { color: var(--azul); }
.crumbs .cur { color: var(--tinta); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs svg { opacity: .6; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.fict {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 2px;
  background: var(--branco); border: 1px solid var(--line); font-family: var(--cond); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--vermelho); font-weight: 600; white-space: nowrap;
}
.fict .ft-s { display: none; }
.fict::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--vermelho); }
.gsearch { position: relative; width: 300px; }
.gsearch input {
  width: 100%; height: 36px; border: 1px solid var(--line); background: var(--branco); border-radius: var(--r-md);
  padding: 0 64px 0 36px; font-size: 13.5px; transition: border-color .15s, box-shadow .15s;
}
.gsearch input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26, 67, 114, .12); }
.gsearch > svg { position: absolute; left: 11px; top: 10px; color: var(--prata); }
.gsearch kbd { position: absolute; right: 9px; top: 8px; font-family: var(--cond); font-size: 11px; color: var(--prata); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; background: var(--surface-2); }
.gresults { position: absolute; top: 42px; left: 0; right: 0; background: var(--branco); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 6px; display: none; max-height: 380px; overflow: auto; }
.gresults.open { display: block; animation: pop .14s var(--ease); }
.gresults a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 3px; color: var(--tinta); }
.gresults a:hover, .gresults a.hl { background: var(--azul-50); }
.gresults .gid { font-family: var(--cond); font-size: 12px; color: var(--prata); width: 58px; flex: none; }
.gresults .gname { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gresults .empty-mini { padding: 12px; color: var(--prata); font-size: 13px; }

.content { padding: 28px 32px 56px; max-width: 1480px; width: 100%; margin: 0 auto; }
.view-enter { animation: fadeUp .28s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.99); } to { opacity: 1; transform: none; } }

/* ---------------- Page header ---------------- */
.page-head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head .ph-text { min-width: 0; flex: 1 1 380px; }
.eyebrow { font-family: var(--cond); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--grafite); font-weight: 500; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ''; width: 18px; height: 2px; background: var(--dourado); }
.page-title { font-family: var(--serif); font-weight: 600; font-size: 38px; line-height: 1.08; color: var(--tinta); margin-top: 8px; letter-spacing: -.005em; }
.page-sub { color: var(--grafite); margin-top: 6px; font-size: 14.5px; }
.ph-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------------- Buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--r-md);
  border: 1px solid transparent; background: none; cursor: pointer; font-weight: 600; font-size: 13.5px; letter-spacing: .01em;
  transition: background .15s, border-color .15s, color .15s, transform .06s, box-shadow .15s; white-space: nowrap; user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--azul); color: var(--pergaminho); box-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, var(--shadow-1); }
.btn-primary:hover { background: var(--azul-700); }
.btn-secondary { background: var(--branco); border-color: var(--line); color: var(--tinta); }
.btn-secondary:hover { border-color: var(--hairline); background: var(--surface-2); }
.btn-ghost { color: var(--grafite); }
.btn-ghost:hover { background: rgba(20, 32, 46, .05); color: var(--tinta); }
.btn-danger { background: var(--vermelho); color: var(--pergaminho); }
.btn-danger:hover { background: #74200F; }
.btn-danger-ghost { color: var(--vermelho); }
.btn-danger-ghost:hover { background: var(--vermelho-50); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-icon { width: 34px; height: 34px; padding: 0; }
.btn-icon.sm { width: 30px; height: 30px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--azul); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.linkbtn:hover { color: var(--azul-700); text-decoration: underline; text-underline-offset: 3px; }

/* ---------------- Filter bar ---------------- */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--branco); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 22px; box-shadow: var(--shadow-1); }
.filterbar .fb-label { font-family: var(--cond); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--prata); display: flex; align-items: center; gap: 6px; margin-right: 4px; }
.fsel { position: relative; }
.fsel select {
  appearance: none; height: 34px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--branco);
  padding: 0 32px 0 12px; font-size: 13px; cursor: pointer; min-width: 132px; color: var(--tinta);
}
.fsel select:hover { border-color: var(--hairline); }
.fsel select.set { border-color: var(--azul); background: var(--azul-50); color: var(--azul); font-weight: 600; }
.fsel::after { content: ''; position: absolute; right: 12px; top: 13px; width: 6px; height: 6px; border-right: 1.5px solid var(--grafite); border-bottom: 1.5px solid var(--grafite); transform: rotate(45deg); pointer-events: none; }
.fsel .fcap { position: absolute; left: 12px; top: -7px; background: var(--branco); padding: 0 4px; font-size: 10px; font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--prata); pointer-events: none; }
.fb-spacer { flex: 1; }
.fb-clear { font-size: 12.5px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--grafite); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--tinta); }
.seg button.on { background: var(--branco); color: var(--azul); font-weight: 600; box-shadow: 0 1px 2px rgba(11, 23, 38, .1); }

/* ---------------- Cards & grids ---------------- */
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-md); box-shadow: var(--shadow-1); min-width: 0; }
.card-pad { padding: 20px 22px; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px 0; }
.card-head h3 { font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--tinta); line-height: 1.15; }
.card-head .ch-sub { font-size: 12.5px; color: var(--prata); margin-top: 2px; }
.card-head .ch-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 16px 22px 20px; }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
.section-title h2 { font-family: var(--cond); font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--grafite); font-weight: 600; }
.section-title .st-line { flex: 1; height: 1px; background: var(--line-soft); }
.section-title .st-note { font-size: 12px; color: var(--prata); }

/* KPI */
.kpi { position: relative; padding: 18px 20px 16px; overflow: hidden; }
.kpi .k-label { font-family: var(--cond); font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--grafite); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .k-value { font-size: 26px; font-weight: 600; color: var(--tinta); margin-top: 8px; letter-spacing: -.01em; white-space: nowrap; line-height: 1.1; }
.kpi .k-value .cur { font-size: 14px; font-weight: 500; color: var(--grafite); margin-right: 3px; }
.kpi .k-value .cents { font-size: 15px; color: var(--prata); font-weight: 500; }
.kpi .k-foot { margin-top: 10px; font-size: 12.5px; color: var(--grafite); display: flex; align-items: center; gap: 8px; min-height: 18px; }
.kpi .k-foot .muted { color: var(--prata); }
.kpi.accent-azul { box-shadow: inset 3px 0 0 var(--azul), var(--shadow-1); }
.kpi.accent-verde { box-shadow: inset 3px 0 0 var(--verde), var(--shadow-1); }
.kpi.accent-vermelho { box-shadow: inset 3px 0 0 var(--vermelho), var(--shadow-1); }
.kpi.accent-grafite { box-shadow: inset 3px 0 0 var(--grafite), var(--shadow-1); }
.bar { height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; flex: 1; min-width: 40px; }
.bar > i { display: block; height: 100%; background: var(--azul); border-radius: 3px; transition: width .5s var(--ease); }
.bar.verde > i { background: var(--verde); }
.bar.vermelho > i { background: var(--vermelho); }
.bar.grafite > i { background: var(--grafite); }

.kpi-group { display: grid; grid-template-columns: 170px 1fr; gap: 0; }
.kpi-group + .kpi-group { margin-top: 16px; }
.kg-title { padding: 18px 20px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; justify-content: center; }
.kg-title .kg-name { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1; }
.kg-title .kg-desc { font-size: 12px; color: var(--prata); margin-top: 6px; line-height: 1.35; }
.kg-cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kg-cells > .kpi + .kpi { border-left: 1px solid var(--line-soft); }

/* Result hero */
.hero {
  position: relative; background: var(--noite); color: var(--pergaminho); border-radius: var(--r-md); padding: 22px 26px; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 28px; align-items: center; box-shadow: var(--shadow-2);
}
.hero::after { content: ''; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border: 1px solid rgba(184, 149, 46, .16); border-radius: 50%; pointer-events: none; }
.hero .h-label { font-family: var(--cond); letter-spacing: .2em; font-size: 11.5px; text-transform: uppercase; color: rgba(242, 240, 234, .66); display: flex; align-items: center; gap: 8px; }
.hero .h-value { font-size: 40px; font-weight: 600; margin-top: 8px; letter-spacing: -.015em; white-space: nowrap; }
.hero .h-value .cur { font-size: 18px; font-weight: 500; opacity: .7; margin-right: 4px; }
.hero .h-value .cents { font-size: 20px; opacity: .55; }
.hero .h-formula { font-size: 12px; color: rgba(242, 240, 234, .6); margin-top: 6px; }
.hero .h-filete { width: 30px; height: 2px; background: var(--dourado); margin: 12px 0 0; }
.hero-cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; z-index: 1; }
.hero-cells > div { padding: 4px 18px; border-left: 1px solid rgba(242, 240, 234, .1); }
.hero-cells .hc-l { font-family: var(--cond); letter-spacing: .14em; font-size: 10.5px; text-transform: uppercase; color: rgba(242, 240, 234, .58); }
.hero-cells .hc-v { font-size: 18px; font-weight: 600; margin-top: 6px; white-space: nowrap; }
.hero-cells .hc-s { font-size: 11.5px; color: rgba(242, 240, 234, .55); margin-top: 3px; }
.hero .neg { color: #E8A396; }
.hero .pos { color: #BFD8A8; }
.tag-validar { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 2px; font-family: var(--cond); font-size: 11px; letter-spacing: .08em; font-weight: 600; background: var(--dourado-50); color: #6E5715; border: 1px dashed rgba(184, 149, 46, .7); white-space: nowrap; }
.hero .tag-validar { background: rgba(184, 149, 46, .12); color: #E2CB82; border-color: rgba(184, 149, 46, .5); }

/* values */
.neg { color: var(--vermelho); }
.pos { color: var(--verde); }
.muted { color: var(--prata); }
.dim { color: var(--grafite); }

/* ---------------- Badges ---------------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 2px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 1; }
.badge svg { width: 12px; height: 12px; }
.b-neutral { background: #EDEBE4; color: var(--grafite); }
.b-azul { background: var(--azul-50); color: var(--azul); }
.b-verde { background: var(--verde-50); color: var(--verde); }
.b-vermelho { background: var(--vermelho-50); color: var(--vermelho); }
.b-dourado { background: var(--dourado-50); color: #6E5715; }
.b-outline { background: var(--branco); border-color: var(--line); color: var(--grafite); }
.b-noite { background: var(--noite); color: var(--pergaminho); }
.vchip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--tinta); white-space: nowrap; }
.vchip::before { content: ''; width: 8px; height: 8px; border-radius: 1px; background: var(--vc, var(--azul)); }
.vchip.v-edu { --vc: var(--azul); }
.vchip.v-gp { --vc: var(--vermelho); }
.vchip.v-sau { --vc: var(--verde); }
.meta-dot { color: var(--hairline); margin: 0 2px; }

/* ---------------- Tables ---------------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.t th { position: sticky; top: 0; text-align: left; font-family: var(--cond); font-weight: 600; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--grafite); padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.t th.r, .t td.r { text-align: right; }
.t td.r, .t td.num, .t .num, .t tfoot td, .t .badge { white-space: nowrap; }
.t div.strong { min-width: 150px; }
.t td .sub { min-width: 120px; }
.rep-body .t td, .rep-body .t th { padding-left: 8px; padding-right: 8px; }
.rep-body .t div.strong { min-width: 130px; }
.rep-body .t td .sub { min-width: 0; }
.t th.c, .t td.c { text-align: center; }
.t td { padding: 12px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.t tbody tr { transition: background .12s; }
.t tbody tr:hover { background: #FAF9F5; }
.t tbody tr.click { cursor: pointer; }
.t tfoot td { padding: 12px 14px; font-weight: 700; border-top: 1px solid var(--line); background: var(--surface-2); }
.t .strong { font-weight: 600; color: var(--tinta); }
.t .sub { font-size: 12px; color: var(--prata); margin-top: 2px; }
.t .idc { font-family: var(--cond); color: var(--prata); font-size: 12.5px; letter-spacing: .03em; white-space: nowrap; }
.t td.actions { width: 1%; white-space: nowrap; text-align: right; }
.t td.actions .btn { opacity: .55; }
.t tr:hover td.actions .btn { opacity: 1; }
.t tr.group-row td { background: #FBFAF7; }
.t tr.child-row td { background: var(--branco); padding-top: 9px; padding-bottom: 9px; font-size: 13px; }
.t tr.child-row td:first-child { padding-left: 38px; position: relative; }
.t tr.child-row td:first-child::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 50%; width: 9px; border-left: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
.expander { width: 22px; height: 22px; border: 0; background: none; border-radius: 3px; cursor: pointer; color: var(--grafite); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-right: 4px; transition: transform .15s; }
.expander:hover { background: var(--azul-50); }
.expander.open { transform: rotate(90deg); }
.minibar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.minibar .bar { height: 4px; }
.minibar span { font-size: 11.5px; color: var(--prata); width: 34px; text-align: right; }

/* ---------------- Events ---------------- */
.ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ev-card {
  position: relative; display: flex; flex-direction: column; background: var(--branco); border: 1px solid var(--line-soft); border-radius: var(--r-md);
  padding: 18px 20px 16px; cursor: pointer; transition: border-color .18s, box-shadow .18s, transform .18s; min-height: 190px; color: var(--tinta);
  box-shadow: var(--shadow-1); overflow: hidden;
}
.ev-card::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--vc); }
.ev-card:hover { border-color: var(--line); box-shadow: var(--shadow-2); transform: translateY(-2px); }
.ev-card .ec-top { display: flex; align-items: center; gap: 8px; }
.ev-card .ec-id { font-family: var(--cond); font-size: 12px; letter-spacing: .06em; color: var(--prata); margin-left: auto; }
.ev-card h4 { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.12; margin: 14px 0 6px; }
.ev-card .ec-prog { font-size: 12.5px; color: var(--grafite); }
.ev-card .ec-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.ev-card .ec-meta > div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--grafite); min-width: 0; }
.ev-card .ec-meta > div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-card .ec-meta svg { color: var(--prata); }
.ev-card .ec-foot { display: flex; align-items: center; margin-top: 14px; }
.ev-card .ec-go { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--azul); display: inline-flex; align-items: center; gap: 6px; }
.ev-card:hover .ec-go svg { transform: translateX(3px); }
.ev-card .ec-go svg { transition: transform .18s; }
.alert-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--vermelho); }
.alert-dot.pend { color: #7A5E0F; }
.ev-card.new-card { border: 1px dashed var(--hairline); background: transparent; align-items: center; justify-content: center; color: var(--grafite); box-shadow: none; }
.ev-card.new-card::before { display: none; }
.ev-card.new-card:hover { background: var(--branco); color: var(--azul); }
.v-edu { --vc: var(--azul); }
.v-gp { --vc: var(--vermelho); }
.v-sau { --vc: var(--verde); }

.status-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.status-cell { padding: 14px 18px; border-left: 1px solid var(--line-soft); cursor: pointer; transition: background .15s; }
.status-cell:first-child { border-left: 0; }
.status-cell:hover { background: var(--surface-2); }
.status-cell .sc-n { font-size: 30px; font-weight: 600; line-height: 1; }
.status-cell .sc-l { font-size: 12.5px; color: var(--grafite); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.status-cell .sc-bar { height: 3px; margin-top: 12px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.status-cell .sc-bar i { display: block; height: 100%; background: var(--grafite); }

/* recent list */
.rlist { display: flex; flex-direction: column; }
.ritem { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 22px; border-top: 1px solid var(--line-soft); cursor: pointer; transition: background .12s; }
.ritem:hover { background: var(--surface-2); }
.ritem .rbar { align-self: stretch; background: var(--vc); border-radius: 2px; }
.ritem .rname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ritem .rmeta { font-size: 12px; color: var(--prata); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* alerts */
.alist { display: flex; flex-direction: column; }
.aitem { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 22px; border-top: 1px solid var(--line-soft); cursor: pointer; transition: background .12s; }
.aitem:hover { background: var(--surface-2); }
.aicon { width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
.aicon.s-vencido { background: var(--vermelho-50); color: var(--vermelho); }
.aicon.s-pendente { background: var(--dourado-50); color: #7A5E0F; }
.aicon.s-atencao { background: var(--azul-50); color: var(--azul); }
.aicon.s-validar { background: #EDEBE4; color: var(--grafite); }
.aitem .at { font-weight: 600; font-size: 13.5px; }
.aitem .ad { font-size: 12px; color: var(--prata); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aitem .av { text-align: right; font-weight: 600; font-size: 13px; white-space: nowrap; }
.aitem .as { font-family: var(--cond); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--prata); }
.asum { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- Event workspace ---------------- */
.ws-head { background: var(--branco); border: 1px solid var(--line-soft); border-radius: var(--r-md); box-shadow: var(--shadow-1); margin-bottom: 20px; position: relative; overflow: hidden; }
.ws-head::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--vc); }
.ws-top { padding: 20px 26px 16px 30px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.ws-back { display: inline-flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--grafite); font-weight: 600; }
.ws-back:hover { color: var(--azul); }
.ws-id { font-family: var(--cond); font-size: 13px; letter-spacing: .1em; color: var(--prata); margin-top: 12px; }
.ws-title { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.08; margin-top: 2px; }
.ws-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; color: var(--grafite); font-size: 13.5px; }
.ws-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 2px; padding: 0 22px; border-top: 1px solid var(--line-soft); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; padding: 14px 12px 13px; font-weight: 600; font-size: 13.5px; color: var(--grafite); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tabs a:hover { color: var(--tinta); }
.tabs a.on { color: var(--azul); }
.tabs a.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--azul); }
.tabs .tcount { font-family: var(--cond); font-size: 11.5px; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: #EDEBE4; color: var(--grafite); display: inline-flex; align-items: center; justify-content: center; }
.tabs a.on .tcount { background: var(--azul-50); color: var(--azul); }

.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fact { padding: 14px 20px; border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft); min-width: 0; }
.fact:nth-child(4n+1) { border-left: 0; }
.fact:nth-child(-n+4) { border-top: 0; }
.fact .fl { font-family: var(--cond); font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--prata); }
.fact .fv { font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.flow-step { padding: 16px 20px; position: relative; }
.flow-step + .flow-step { border-left: 1px solid var(--line-soft); }
.flow-step .fs-l { font-family: var(--cond); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--grafite); display: flex; align-items: center; gap: 6px; }
.flow-step .fs-v { font-size: 21px; font-weight: 600; margin-top: 6px; white-space: nowrap; }
.flow-step .fs-v .cur { font-size: 13px; font-weight: 500; color: var(--grafite); margin-right: 3px; }
.flow-step .fs-v .cents { font-size: 14px; color: var(--prata); font-weight: 500; }
.flow-step .fs-s { font-size: 12px; color: var(--prata); margin-top: 4px; }
.flow-step .fs-arrow { position: absolute; right: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; background: var(--branco); border: 1px solid var(--line-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--prata); z-index: 1; }
.flow-step .fs-arrow svg { width: 10px; height: 10px; }

.mini-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.mini-kpis > div { padding: 14px 18px; border-left: 1px solid var(--line-soft); }
.mini-kpis > div:first-child { border-left: 0; }
.mini-kpis .ml { font-family: var(--cond); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--grafite); }
.mini-kpis .mv { font-size: 19px; font-weight: 600; margin-top: 4px; white-space: nowrap; }
.mini-kpis .ms { font-size: 11.5px; color: var(--prata); margin-top: 2px; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.search-in { position: relative; }
.search-in input { height: 34px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 0 12px 0 34px; width: 260px; background: var(--branco); font-size: 13px; }
.search-in input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26, 67, 114, .12); }
.search-in svg { position: absolute; left: 10px; top: 9px; color: var(--prata); }

/* composition */
.compose { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cbox { background: var(--branco); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 18px 20px; box-shadow: var(--shadow-1); }
.cbox h4 { font-family: var(--serif); font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.cbox h4 .cb-mark { width: 10px; height: 10px; border-radius: 1px; }
.cline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line-soft); font-size: 13.5px; }
.cline:last-child { border-bottom: 0; }
.cline .cl { color: var(--grafite); display: flex; align-items: center; gap: 6px; }
.cline .cv { font-weight: 600; white-space: nowrap; }
.cline.total { border-top: 1px solid var(--line); border-bottom: 0; margin-top: 4px; padding-top: 12px; }
.cline.total .cl { color: var(--tinta); font-weight: 600; }
.eq { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--grafite); }
.eq b { color: var(--tinta); font-size: 15px; }
.eq .op { font-family: var(--serif); font-size: 22px; color: var(--prata); }

/* ---------------- Charts ---------------- */
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 300px; }
.chart-box.short { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--grafite); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend i.line { height: 2px; width: 14px; border-radius: 0; }
.funnel { display: flex; flex-direction: column; gap: 14px; }
.funnel-row .fr-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; gap: 8px; }
.funnel-row .fr-top .frl { color: var(--grafite); font-weight: 500; }
.funnel-row .fr-top .frv { font-weight: 600; white-space: nowrap; }
.funnel-row .fr-bar { height: 12px; background: var(--surface-2); border-radius: 2px; overflow: hidden; border: 1px solid var(--line-soft); }
.funnel-row .fr-bar i { display: block; height: 100%; transition: width .6s var(--ease); }
.funnel-row .fr-note { font-size: 11.5px; color: var(--prata); margin-top: 4px; }

/* ---------------- Empty ---------------- */
.empty { text-align: center; padding: 48px 20px; color: var(--grafite); }
.empty .e-icon { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px; background: var(--azul-50); color: var(--azul); display: flex; align-items: center; justify-content: center; }
.empty .e-icon svg { width: 24px; height: 24px; }
.empty h4 { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--tinta); }
.empty p { margin: 6px auto 16px; max-width: 420px; font-size: 13.5px; }

/* skeleton */
.sk { background: linear-gradient(90deg, #ECEAE3 0%, #F6F5F1 50%, #ECEAE3 100%); background-size: 200% 100%; animation: sk 1.1s infinite linear; border-radius: 3px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------------- Overlay: modal & drawer ---------------- */
.overlay { position: fixed; inset: 0; background: rgba(11, 23, 38, .42); backdrop-filter: blur(2px); z-index: 60; opacity: 0; transition: opacity .2s; }
.overlay.show { opacity: 1; }
.modal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -48%) scale(.985); opacity: 0; transition: transform .22s var(--ease), opacity .2s;
  width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--branco); border-radius: var(--r-md); z-index: 61;
  display: flex; flex-direction: column; box-shadow: var(--shadow-3); overflow: hidden;
}
.modal.sm { width: min(460px, calc(100vw - 32px)); }
.modal.show { transform: translate(-50%, -50%); opacity: 1; }
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw); background: var(--branco); z-index: 61; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .26s var(--ease); box-shadow: var(--shadow-3);
}
.drawer.show { transform: none; }
.ov-head { padding: 20px 26px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: flex-start; gap: 12px; }
.ov-head .oh-eyebrow { font-family: var(--cond); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--prata); }
.ov-head h3 { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.1; margin-top: 3px; }
.ov-head .oh-sub { font-size: 13px; color: var(--grafite); margin-top: 4px; }
.ov-head .btn-icon { margin-left: auto; margin-top: -2px; }
.ov-body { padding: 20px 26px; overflow-y: auto; flex: 1; }
.ov-foot { padding: 14px 26px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; background: var(--surface-2); }
.ov-foot .spacer { flex: 1; }
.ov-foot .hint { font-size: 12px; color: var(--prata); }

/* wizard */
.wizard { display: grid; grid-template-columns: 220px 1fr; min-height: 0; flex: 1; }
.wsteps { background: var(--surface-2); border-right: 1px solid var(--line-soft); padding: 22px 16px; display: flex; flex-direction: column; gap: 4px; }
.wstep { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: var(--r-md); cursor: pointer; border: 0; background: none; text-align: left; }
.wstep:hover { background: rgba(20, 32, 46, .04); }
.wstep .wn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; color: var(--grafite); flex: none; background: var(--branco); transition: all .2s; }
.wstep .wt { font-weight: 600; font-size: 13.5px; color: var(--grafite); }
.wstep .wd { font-size: 11.5px; color: var(--prata); margin-top: 1px; }
.wstep.on .wn { background: var(--azul); border-color: var(--azul); color: var(--pergaminho); }
.wstep.on .wt { color: var(--tinta); }
.wstep.done .wn { background: var(--verde-50); border-color: var(--verde); color: var(--verde); }
.wstep.err .wn { border-color: var(--vermelho); color: var(--vermelho); background: var(--vermelho-50); }
.wpanel { padding: 22px 28px; overflow-y: auto; }
.wpanel h4 { font-family: var(--serif); font-size: 24px; font-weight: 600; }
.wpanel .wp-sub { font-size: 13px; color: var(--grafite); margin: 4px 0 18px; }

/* ---------------- Forms ---------------- */
.form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px 16px; }
.fld { grid-column: span 6; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld.s1 { grid-column: span 1; } .fld.s2 { grid-column: span 2; } .fld.s3 { grid-column: span 3; } .fld.s4 { grid-column: span 4; }
.fld label { font-size: 12.5px; font-weight: 600; color: var(--grafite); display: flex; align-items: center; gap: 6px; }
.fld label .req { color: var(--vermelho); }
.fld label .opt { font-weight: 400; color: var(--prata); font-size: 11.5px; }
.fld input, .fld select, .fld textarea {
  width: 100%; height: 38px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--branco); padding: 0 12px; font-size: 14px; color: var(--tinta);
  transition: border-color .15s, box-shadow .15s;
}
.fld textarea { height: 76px; padding: 9px 12px; resize: vertical; }
.fld select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--grafite) 50%), linear-gradient(135deg, var(--grafite) 50%, transparent 50%); background-position: calc(100% - 17px) 16px, calc(100% - 12px) 16px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.fld input:hover, .fld select:hover, .fld textarea:hover { border-color: var(--hairline); }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26, 67, 114, .12); }
.fld.invalid input, .fld.invalid select, .fld.invalid textarea { border-color: var(--vermelho); box-shadow: 0 0 0 3px rgba(142, 42, 28, .1); }
.fld .err { font-size: 12px; color: var(--vermelho); display: none; }
.fld.invalid .err { display: block; }
.fld .help { font-size: 11.5px; color: var(--prata); }
.money { position: relative; }
.money::before { content: 'R$'; position: absolute; left: 12px; top: 10px; font-size: 13px; color: var(--prata); pointer-events: none; }
.money input { padding-left: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.computed { height: 38px; border: 1px dashed var(--line); border-radius: var(--r-md); background: var(--surface-2); padding: 0 12px; display: flex; align-items: center; justify-content: flex-end; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tinta); }
.computed.left { justify-content: flex-start; }
.fgroup { grid-column: span 6; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.fgroup span { font-family: var(--cond); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--grafite); font-weight: 600; white-space: nowrap; }
.fgroup::after { content: ''; height: 1px; flex: 1; background: var(--line-soft); }
.ctx-note { grid-column: span 6; display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r-md); background: var(--azul-50); color: var(--azul-700); font-size: 12.5px; line-height: 1.45; }
.ctx-note svg { flex: none; margin-top: 1px; }
.ctx-note.gold { background: var(--dourado-50); color: #5F4B12; }
.details { grid-column: span 6; border: 1px solid var(--line-soft); border-radius: var(--r-md); }
.details summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: var(--grafite); }
.details summary::-webkit-details-marker { display: none; }
.details summary .chev { transition: transform .15s; }
.details[open] summary .chev { transform: rotate(90deg); }
.details summary .opt { font-weight: 400; color: var(--prata); font-size: 12px; margin-left: auto; }
.details .form { padding: 4px 14px 16px; }
.chips-choice { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-choice button { height: 36px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--branco); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; transition: all .15s; }
.chips-choice button:hover { border-color: var(--hairline); }
.chips-choice button.on { border-color: var(--azul); background: var(--azul-50); color: var(--azul); font-weight: 600; box-shadow: inset 0 0 0 1px var(--azul); }
.chips-choice button .dot { width: 8px; height: 8px; border-radius: 1px; background: var(--vc); }
.form-error { grid-column: span 6; padding: 10px 14px; border-radius: var(--r-md); background: var(--vermelho-50); color: var(--vermelho); font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
.cat-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.cat-sugg span { font-size: 12px; padding: 3px 8px; border-radius: 2px; background: var(--branco); border: 1px solid var(--line-soft); color: var(--grafite); }
.summary-box { grid-column: span 6; border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 4px 14px; background: var(--surface-2); }

/* ---------------- Toast / Tooltip / Menu ---------------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: 14px; align-items: center; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast { min-width: 300px; max-width: 420px; background: var(--noite); color: var(--pergaminho); padding: 12px 16px; border-radius: var(--r-md); box-shadow: var(--shadow-3); display: flex; gap: 12px; align-items: flex-start; animation: toastIn .28s var(--ease); font-size: 13.5px; }
.toast .ti { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: rgba(191, 216, 168, .16); color: #BFD8A8; }
.toast.err .ti { background: rgba(232, 163, 150, .16); color: #E8A396; }
.toast .tt { font-weight: 600; }
.toast .td { color: rgba(242, 240, 234, .7); font-size: 12.5px; margin-top: 2px; }
.toast.out { animation: toastOut .22s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }
[data-tip] { position: relative; }
.tip { position: fixed; z-index: 95; background: var(--noite); color: var(--pergaminho); font-size: 12px; line-height: 1.4; padding: 7px 10px; border-radius: 3px; max-width: 280px; pointer-events: none; box-shadow: var(--shadow-2); opacity: 0; transition: opacity .12s; }
.tip.show { opacity: 1; }
.info-i { display: inline-flex; color: var(--prata); cursor: help; }
.info-i:hover { color: var(--azul); }
.menu { position: fixed; z-index: 80; background: var(--branco); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 6px; min-width: 210px; animation: pop .14s var(--ease); }
.menu button { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 3px; cursor: pointer; font-size: 13.5px; text-align: left; color: var(--tinta); }
.menu button:hover { background: var(--azul-50); color: var(--azul); }
.menu button.danger { color: var(--vermelho); }
.menu button.danger:hover { background: var(--vermelho-50); }
.menu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 5px 0; }
.menu .mh { font-family: var(--cond); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--prata); padding: 6px 10px 4px; }

/* ---------------- Reports ---------------- */
.rep-layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 20px; align-items: start; }
.rep-nav { position: sticky; top: calc(var(--topbar) + 20px); padding: 10px 8px; }
.rep-nav .rg { font-family: var(--cond); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--prata); padding: 12px 12px 6px; }
.rep-nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 3px; color: var(--grafite); font-size: 13.5px; font-weight: 500; }
.rep-nav a:hover { background: var(--surface-2); color: var(--tinta); }
.rep-nav a.on { background: var(--azul-50); color: var(--azul); font-weight: 600; }

/* ---------------- Config ---------------- */
.cfg-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.param-list { display: flex; flex-wrap: wrap; gap: 8px; }
.param-list .pchip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line-soft); font-size: 13px; }
.param-list .pchip .x { border: 0; background: none; cursor: pointer; color: var(--prata); padding: 0; display: inline-flex; }
.param-list .pchip .x:hover { color: var(--vermelho); }
.param-list .pchip.session { border-style: dashed; border-color: var(--azul); }
.cat-table td { vertical-align: top; }
.modtag { display: inline-flex; gap: 4px; }

/* ---------------- Responsive ---------------- */
@media (max-width: 1280px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kg-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kg-cells > .kpi:nth-child(3) { border-left: 0; }
  .kg-cells > .kpi:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .hero { grid-template-columns: 1fr; gap: 18px; }
  .gsearch { width: 220px; }
}
@media (max-width: 1100px) {
  :root { --sidebar: 76px; }
  .brand { padding: 4px 4px 16px; }
  .brand .logo, .brand .product, .brand .filete, .nav-label, .nav a .lbl, .nav a .count, .side-foot .ver, .side-foot .side-tag { display: none; }
  .brand .logo-mini { display: block; margin: 0 auto; }
  .nav a { justify-content: center; padding: 12px; }
  .side-foot { text-align: center; padding: 12px 0 0; }
  .pill-homolog { display: none; }
  .ver-mini { display: block; font-family: var(--cond); font-size: 10px; letter-spacing: .08em; color: #D9BE6B; line-height: 1.3; }
  .g-main, .rep-layout, .cfg-layout { grid-template-columns: 1fr; }
  .rep-nav { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
  .rep-nav .rg { width: 100%; padding: 8px 8px 2px; }
  .compose { grid-template-columns: 1fr; }
  .fict .ft { display: none; }
  .fict .ft-s { display: inline; }
}
@media (max-width: 900px) {
  .g-3, .g-2 { grid-template-columns: 1fr; }
  .kpi-group { grid-template-columns: 1fr; }
  .kg-title { border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 14px 20px; }
  .facts, .flow, .mini-kpis, .hero-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact:nth-child(n) { border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft); }
  .fact:nth-child(2n+1) { border-left: 0; }
  .fact:nth-child(-n+2) { border-top: 0; }
  .flow-step .fs-arrow { display: none; }
  .flow-step:nth-child(3), .mini-kpis > div:nth-child(3), .hero-cells > div:nth-child(3) { border-left: 0; }
  .flow-step:nth-child(n+3), .mini-kpis > div:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .hero-cells > div:nth-child(n+3) { margin-top: 12px; }
  .status-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .status-cell:nth-child(4) { border-left: 0; }
  .status-cell:nth-child(n+4) { border-top: 1px solid var(--line-soft); }
  .wizard { grid-template-columns: 1fr; }
  .wsteps { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 10px; }
  .wstep .wd { display: none; }
  .gsearch { display: none; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 248px; transform: translateX(-100%); transition: transform .24s var(--ease); }
  .sidebar.open { transform: none; box-shadow: var(--shadow-3); }
  .brand .logo, .brand .product, .brand .filete, .nav-label, .nav a .lbl, .nav a .count, .side-foot .ver, .side-foot .side-tag { display: revert; }
  .brand .logo-mini { display: none; }
  .ver-mini { display: none !important; }
  .pill-homolog { display: inline-flex; }
  .nav a { justify-content: flex-start; }
  .side-foot { text-align: left; }
  .topbar .menu-btn { display: inline-flex; }
  .topbar { padding: 0 16px; gap: 10px; }
  .content { padding: 20px 16px 48px; }
  .page-title { font-size: 30px; }
  .ws-title { font-size: 26px; }
  .ws-top { padding: 16px 16px 14px 20px; }
  .ws-actions { margin-left: 0; width: 100%; }
  .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fld.s1, .fld.s2 { grid-column: span 1; }
  .fld.s3, .fld.s4, .fld, .fgroup, .ctx-note, .details, .form-error, .summary-box { grid-column: span 2; }
  .g-4 { grid-template-columns: 1fr; }
  .kg-cells { grid-template-columns: 1fr 1fr; }
  .hero .h-value { font-size: 30px; }
  .ev-grid { grid-template-columns: 1fr; }
  .search-in input { width: 100%; }
  .search-in { flex: 1; }
  .crumbs .hide-sm { display: none; }
  .ov-head, .ov-body, .ov-foot { padding-left: 18px; padding-right: 18px; }
  .wpanel { padding: 18px; }
  .toasts { left: 16px; right: 16px; transform: none; }
  .toast { min-width: 0; }
}
@media print { .sidebar, .topbar { display: none; } .app { display: block; } }

/* ======================= v0.2 · componentes novos ======================= */
.lnk { color: var(--azul); font-weight: 600; }
.lnk:hover { text-decoration: underline; }

/* Faixas de vencimento (aging) */
.aging { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.ag-cell { min-width: 0; }
.ag-l { font-family: var(--cond); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--prata); }
.ag-v { font-size: 17px; font-weight: 600; color: var(--tinta); margin: 3px 0 7px; white-space: nowrap; }
.ag-v.neg { color: var(--vermelho); }
.ag-bar { height: 4px; background: #EDEBE4; border-radius: 2px; overflow: hidden; }
.ag-bar i { display: block; height: 100%; background: var(--azul); }
.ag-bar.vermelho i { background: var(--vermelho); }
.ag-bar.verde i { background: var(--verde); }
@media (max-width: 900px) { .aging { grid-template-columns: repeat(2, 1fr); } }

/* Escolha de origem */
.choice-grid { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px;
  text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 3px; background: #fff; cursor: pointer; transition: .15s; }
.choice:hover:not(:disabled) { border-color: var(--azul); background: var(--azul-50); }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice .i { grid-row: 1 / span 2; align-self: center; color: var(--azul); }
.choice b { font-size: 14.5px; color: var(--tinta); }
.choice span { font-size: 12.5px; color: var(--grafite); }

/* Três perspectivas de resultado */
.persp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.persp-card { border: 1px solid var(--line); border-radius: 3px; background: #fff; padding: 18px 20px; position: relative; overflow: hidden; }
.persp-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--prata); }
.persp-card.p1::before { background: var(--dourado); }
.persp-card.p2::before { background: var(--azul); }
.persp-card.p3::before { background: var(--verde); }
.persp-k { font-family: var(--cond); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--prata); }
.persp-t { font-family: var(--serif); font-size: 19px; color: var(--tinta); margin: 2px 0 10px; }
.persp-v { font-size: 27px; font-weight: 600; color: var(--tinta); letter-spacing: -.01em; white-space: nowrap; }
.persp-v.neg { color: var(--vermelho); }
.persp-f { font-size: 12.5px; color: var(--grafite); margin-top: 8px; line-height: 1.5; }
.persp-eq { font-family: var(--cond); font-size: 12px; color: var(--prata); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hairline); }
@media (max-width: 1100px) { .persp { grid-template-columns: 1fr; } }

/* Cartões de conta financeira */
.acc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.acc { border: 1px solid var(--line); border-radius: 3px; background: #fff; padding: 16px 18px; }
.acc.off { opacity: .6; }
.acc-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.acc-h b { font-size: 14px; color: var(--tinta); }
.acc-v { font-size: 22px; font-weight: 600; color: var(--tinta); white-space: nowrap; }
.acc-v.neg { color: var(--vermelho); }
.acc-l { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--grafite); margin-top: 5px; }
.acc-l .num { white-space: nowrap; }

/* Linha de saldo acumulado no extrato */
.t td.saldo { font-weight: 600; background: #FAFAF7; }
.t tr.transf td { background: #FBF8F0; }
.t tr.transf td:first-child { box-shadow: inset 3px 0 0 var(--dourado); }

/* Barra de etapas do orçamento */
.exec-bar { height: 6px; background: #EDEBE4; border-radius: 3px; overflow: hidden; min-width: 70px; }
.exec-bar i { display: block; height: 100%; background: var(--azul); }
.exec-bar i.over { background: var(--vermelho); }
.exec-bar i.ok { background: var(--verde); }

/* Painel de competências */
.comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.comp { border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; background: #fff; text-align: left; cursor: pointer; transition: .15s; }
.comp:hover { border-color: var(--azul); background: var(--azul-50); }
.comp-m { font-family: var(--cond); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--prata); }
.comp-v { font-size: 16px; font-weight: 600; color: var(--tinta); margin: 4px 0 6px; white-space: nowrap; }
.comp-v.neg { color: var(--vermelho); }
@media (max-width: 560px) {
  .persp-v { font-size: 22px; }
  .persp-card { padding: 16px; }
  .acc-v { font-size: 19px; }
  .ag-v { font-size: 15px; }
}
.card-head .ch-right { flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .card-head { flex-wrap: wrap; } .card-head .ch-right { width: 100%; justify-content: flex-start; } }

/* ======================= v0.2.2 · demonstrativo ======================= */
.t.demo td:first-child, .t.demo th:first-child { width: 46%; }
.t.demo tbody tr.demo-total td { border-top: 1.5px solid var(--tinta); background: #FAFAF7; font-size: 15px; }
.t.demo tbody tr.demo-total td:first-child { font-family: var(--serif); font-size: 17px; color: var(--tinta); }
.demo-leg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px 18px 2px;
  font-size: 12.5px; color: var(--grafite); line-height: 1.5; }
.demo-leg b { color: var(--tinta); }
@media (max-width: 900px) { .demo-leg { grid-template-columns: 1fr; gap: 8px; } }

</style>
</head>

function buildSeed() {
  const db = { eventos: [], receitas: [], fatrec: [], custos: [], pagamentos: [], contas: [], movimentos: [], orcamentos: [], fechamentos: [] };
  const seq = { EV: 10, RC: 0, FR: 0, CU: 0, PG: 0, CT: 0, MV: 0, OR: 0, FC: 0 };
  const nid = (p) => p + '-' + String(++seq[p]).padStart(4, '0');

  function ev(e, fn) {
    const id = nid('EV');
    const base = {
      id, programa: '', modulo: '', cliente: '', local: '', efetivos: 0, pagantesPrev: 0, cortesiasPrev: 0,
      refCrm: 'CRM-FIC-' + id.slice(3), refContratual: '', observacoes: 'DADOS FICTÍCIOS — EXCLUSIVOS PARA HOMOLOGAÇÃO',
    };
    const evento = Object.assign(base, e, { id });
    db.eventos.push(evento);
    const b = {
      rec(r) {
        const o = Object.assign({ id: nid('RC'), eventoId: id, tipoLancamento: 'Evento', centroCusto: 'OPE', segmento: 'Estadual', origem: 'Inscrição (evento aberto)', tipoReceita: 'Inscrição', etapa: '', desconto: 0, pagantes: 0, cortesias: 0, statusEconomico: 'Contratada', criterioReconhecimento: 'Execução declarada (provisório)', etapas: [], competencia: '', referencia: '', observacao: '' }, r);
        db.receitas.push(o); return o;
      },
      fat(r, f) {
        const o = Object.assign({ id: nid('FR'), receitaId: r.id, eventoId: id, retencaoTributaria: 0, retencaoContratual: 0, retencaoContratualLiberada: 0, dataRecebimento: '', valorRecebido: 0, contaId: 'CT-0001', quitado: false, observacao: '' }, f);
        db.fatrec.push(o); return o;
      },
      b2g(cliente, segmento, tipoReceita, valor, etapa) {
        return b.rec({ cliente, segmento, origem: 'Contrato B2G', tipoReceita, qtde: 1, valorUnit: valor, etapa: etapa || '', referencia: evento.refContratual });

      criterioApropriacao: '', observacao: o.observacao || '',
      // atributos comerciais
      vendedor: o.vendedor, referenciaComercial: o.referencia || '',
      modalidadeComissao: o.modalidade, baseComissao: o.base || 'Valor informado',
      baseValor: base, percentual: pct, ajuste, ajusteMotivo: o.ajusteMotivo || '',
      condicaoAquisicao: o.condicao || '', devida: !!o.devida, dataAquisicao: o.devida ? (o.dataAquisicao || o.competencia) : '',
    };
    db.custos.push(c);
    if (o.titulo) {
      db.pagamentos.push({
        id: nid('PG'), custoId: c.id, eventoId, documento: 'COM-' + c.id.slice(3),

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const ok = (v) => Promise.resolve(v);

    /** Leitura síncrona para agregações (camada de regras) */
    snapshot() { return state.db; },

      const rows = state.db[entity];

    },
    get(entity, id) { return ok(clone(state.db[entity].find((r) => r.id === id) || null)); },
    create(entity, data) {
      const p = PREFIX[entity];
      const id = p + '-' + String(++state.seq[p]).padStart(4, '0');
      const row = Object.assign({}, data, { id });
      state.db[entity].push(row);

      const row = state.db[entity].find((r) => r.id === id);
      if (!row) return Promise.reject(new Error('Registro não encontrado: ' + id));
      Object.assign(row, patch, { id });
